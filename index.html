<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ล่าหมามาแดก | สั่งอาหาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #FAFAFA; color: #333; }
        .stepper-active { border-color: #EF4444; color: #EF4444; }
        .stepper-done { border-color: #10B981; background-color: #10B981; color: white; }
    </style>
</head>
<body class="antialiased pb-20">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-gray-800">ล่าหมามาแดก</h1>
            <div id="cart-btn" class="relative cursor-pointer" onclick="toggleCart()">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6" id="app-content">
        <!-- Section: Login -->
        <div id="login-section" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-medium mb-4">ข้อมูลลูกค้า</h2>
            <input type="text" id="nikeName" placeholder="ชื่อเล่น" class="w-full mb-3 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400">
            <input type="text" id="classRoom" placeholder="ห้อง (เช่น 6/1)" class="w-full mb-4 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400">
            <button onclick="startOrdering()" class="w-full bg-gray-900 text-white p-3 rounded-lg font-medium hover:bg-gray-800 transition">เริ่มสั่งอาหาร</button>
        </div>

        <!-- Section: Menu -->
        <div id="menu-section" class="hidden mt-6">
            <div id="menu-list" class="grid grid-cols-2 gap-4">
                <!-- รายการอาหารจะถูกโหลดมาใส่ตรงนี้ -->
                <p class="text-center col-span-2 text-gray-500 text-sm py-10">กำลังโหลดเมนู...</p>
            </div>
        </div>
    </div>

    <!-- Modal: Checkout -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md h-5/6 sm:h-auto sm:rounded-xl rounded-t-xl overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">ตะกร้าของคุณ</h2>
                <button onclick="toggleCart()" class="text-gray-500 text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="mb-4 space-y-3"></div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">ระดับความเผ็ด</label>
                <select id="spiciness" class="w-full p-3 border rounded-lg">
                    <option value="ไม่เผ็ด">ไม่เผ็ด</option>
                    <option value="เผ็ดน้อย">เผ็ดน้อย</option>
                    <option value="เผ็ดกลาง" selected>เผ็ดกลาง (แนะนำ)</option>
                    <option value="เผ็ดมาก">เผ็ดมากล่าสัตว์</option>
                </select>
            </div>

            <div class="flex justify-between font-semibold text-lg mb-4 border-t pt-4">
                <span>ยอดรวม</span>
                <span id="total-price" class="text-red-500">0 บาท</span>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">วิธีชำระเงิน</label>
                <div class="flex gap-2">
                    <button onclick="selectPayment('เงินสด')" id="btn-cash" class="flex-1 py-2 border rounded-lg bg-gray-100 font-medium">เงินสด</button>
                    <button onclick="selectPayment('สแกนจ่าย')" id="btn-qr" class="flex-1 py-2 border rounded-lg font-medium">สแกนจ่าย</button>
                </div>
            </div>

            <div id="qr-section" class="hidden text-center mb-6 bg-gray-50 p-4 rounded-lg">
                <p class="text-sm text-gray-600 mb-2">สแกน QR Code นี้ (พร้อมเพย์)</p>
                <img id="qr-image" src="" alt="QR Code" class="mx-auto w-48 h-48 mb-3">
                <input type="file" id="slip-upload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-600 hover:file:bg-red-100">
            </div>

            <button onclick="submitOrder()" class="w-full bg-gray-900 text-white p-3 rounded-lg font-medium hover:bg-gray-800 transition">ยืนยันคำสั่งซื้อ</button>
        </div>
    </div>

    <!-- Modal: Tracking -->
    <div id="tracking-modal" class="fixed inset-0 bg-white hidden z-50 flex flex-col items-center justify-center px-6">
        <h2 class="text-2xl font-semibold mb-8">สถานะออเดอร์</h2>
        
        <div class="w-full max-w-xs relative border-l-2 border-gray-200 ml-3 space-y-8 py-2">
            <!-- Step 1 -->
            <div class="relative pl-6">
                <div id="step-1" class="absolute w-4 h-4 rounded-full -left-[9px] top-1 border-2 bg-white stepper-active"></div>
                <h3 class="font-medium">ร้านรับออเดอร์แล้ว</h3>
            </div>
            <!-- Step 2 -->
            <div class="relative pl-6">
                <div id="step-2" class="absolute w-4 h-4 bg-white border-2 border-gray-300 rounded-full -left-[9px] top-1"></div>
                <h3 class="font-medium">กำลังทอด</h3>
            </div>
            <!-- Step 3 -->
            <div class="relative pl-6">
                <div id="step-3" class="absolute w-4 h-4 bg-white border-2 border-gray-300 rounded-full -left-[9px] top-1"></div>
                <h3 class="font-medium">เสร็จแล้วมารับได้</h3>
            </div>
        </div>

        <button onclick="location.reload()" class="mt-12 text-gray-500 underline text-sm">สั่งออเดอร์ใหม่</button>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYPwixCzaWRagRdkkfO3Na3z62MBtfaJaCzJh5ZN0WA3eTgdakM68pEiLRQMOjHFC3fQ/exec';
        const PROMPTPAY_NUMBER = '1418600121013'; // ใส่เบอร์พร้อมเพย์
        
        let cart = [];
        let menuData = [];
        let paymentMethod = 'เงินสด';
        let currentOrderId = '';
        let trackingInterval;
        const soundAlert = new Audio('https://files.catbox.moe/7s5kwu.mp3');

        function startOrdering() {
            const name = document.getElementById('nikeName').value;
            const room = document.getElementById('classRoom').value;
            if(!name || !room) {
                Swal.fire({icon: 'warning', title: 'กรุณากรอกข้อมูล', text: 'ใส่ชื่อเล่นและห้องก่อนนะครับ', confirmButtonColor: '#333'});
                return;
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('menu-section').classList.remove('hidden');
            fetchMenu();
        }

        async function fetchMenu() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({action: 'getMenu'})
                });
                const response = await res.json();
                menuData = response.data;
                renderMenu();
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดเมนูได้', 'error');
            }
        }

        function renderMenu() {
            const menuContainer = document.getElementById('menu-list');
            menuContainer.innerHTML = '';
            menuData.forEach(item => {
                if(item.stock > 0) {
                    menuContainer.innerHTML += `
                        <div class="bg-white border border-gray-100 rounded-xl overflow-hidden shadow-sm flex flex-col">
                            <img src="${item['รูปภาพ']}" class="w-full h-32 object-cover bg-gray-100" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="p-3 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="font-medium text-sm text-gray-800">${item.Name}</h3>
                                    <p class="text-red-500 font-semibold text-sm mt-1">฿${item.Price}</p>
                                </div>
                                <button onclick="addToCart('${item.Name}', ${item.Price})" class="mt-3 w-full bg-gray-100 text-gray-800 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-200">เพิ่ม</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function addToCart(name, price) {
            const existing = cart.find(i => i.name === name);
            if(existing) existing.qty += 1;
            else cart.push({name, price, qty: 1});
            
            updateCartBadge();
            Swal.fire({title: 'เพิ่มลงตะกร้าแล้ว', toast: true, position: 'bottom', showConfirmButton: false, timer: 1500, background: '#333', color: '#fff'});
        }

        function updateCartBadge() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-count');
            badge.innerText = count;
            count > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');
        }

        function toggleCart() {
            if(cart.length === 0) return Swal.fire({toast: true, position: 'bottom', title: 'ตะกร้าว่างเปล่า', showConfirmButton: false, timer: 1500});
            
            const modal = document.getElementById('checkout-modal');
            if(modal.classList.contains('hidden')) {
                renderCart();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-sm border border-gray-100">
                        <span class="font-medium">${item.name} <span class="text-gray-500 font-normal">x${item.qty}</span></span>
                        <div class="flex items-center gap-3">
                            <span>฿${item.price * item.qty}</span>
                            <button onclick="removeItem(${idx})" class="text-red-400">&times;</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('total-price').innerText = total + ' บาท';
            
            // อัปเดต QR Code หากเลือกสแกนจ่าย
            if(paymentMethod === 'สแกนจ่าย') {
                document.getElementById('qr-image').src = `https://promptpay.io/${PROMPTPAY_NUMBER}/${total}.png`;
            }
        }

        function removeItem(index) {
            cart.splice(index, 1);
            if(cart.length === 0) toggleCart();
            else { renderCart(); updateCartBadge(); }
        }

        function selectPayment(method) {
            paymentMethod = method;
            const btnCash = document.getElementById('btn-cash');
            const btnQr = document.getElementById('btn-qr');
            const qrSection = document.getElementById('qr-section');

            if(method === 'เงินสด') {
                btnCash.classList.add('bg-gray-100'); btnCash.classList.remove('bg-white');
                btnQr.classList.remove('bg-gray-100'); btnQr.classList.add('bg-white');
                qrSection.classList.add('hidden');
            } else {
                btnQr.classList.add('bg-gray-100'); btnQr.classList.remove('bg-white');
                btnCash.classList.remove('bg-gray-100'); btnCash.classList.add('bg-white');
                qrSection.classList.remove('hidden');
                renderCart(); // เพื่อเจน QR ใหม่ตามยอด
            }
        }

        async function submitOrder() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let slipBase64 = null;

            if(paymentMethod === 'สแกนจ่าย') {
                const fileInput = document.getElementById('slip-upload');
                if(!fileInput.files[0]) {
                    return Swal.fire('แจ้งเตือน', 'กรุณาแนบสลิปโอนเงิน', 'warning');
                }
                slipBase64 = await toBase64(fileInput.files[0]);
            }

            Swal.fire({title: 'กำลังส่งคำสั่งซื้อ...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

            const payload = {
                action: 'placeOrder',
                nikeName: document.getElementById('nikeName').value,
                Class: document.getElementById('classRoom').value,
                items: cart,
                spiciness: document.getElementById('spiciness').value,
                totalPrice: total,
                paymentMethod: paymentMethod,
                slipBase64: slipBase64
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await res.json();
                
                if(data.status === 'success') {
                    currentOrderId = data.orderId;
                    Swal.close();
                    document.getElementById('checkout-modal').classList.add('hidden');
                    document.getElementById('tracking-modal').classList.remove('hidden');
                    startTracking();
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถส่งคำสั่งซื้อได้', 'error');
            }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function startTracking() {
            trackingInterval = setInterval(async () => {
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'getOrderStatus', orderId: currentOrderId}) });
                    const data = await res.json();
                    
                    if(data.status === 'success') updateStepper(data.orderStatus);
                } catch(e) {}
            }, 5000); // เช็คทุกๆ 5 วินาที
        }

        function updateStepper(status) {
            const s1 = document.getElementById('step-1');
            const s2 = document.getElementById('step-2');
            const s3 = document.getElementById('step-3');

            s1.className = 'absolute w-4 h-4 rounded-full -left-[9px] top-1 border-2 stepper-done';
            
            if(status === 'กำลังทอด' || status === 'เสร็จแล้วมารับได้') {
                s2.className = 'absolute w-4 h-4 rounded-full -left-[9px] top-1 border-2 stepper-done';
            } else {
                s2.className = 'absolute w-4 h-4 bg-white border-2 border-gray-300 rounded-full -left-[9px] top-1 stepper-active';
            }

            if(status === 'เสร็จแล้วมารับได้') {
                s3.className = 'absolute w-4 h-4 rounded-full -left-[9px] top-1 border-2 stepper-done';
                clearInterval(trackingInterval);
                soundAlert.play();
                Swal.fire({icon: 'success', title: 'อาหารเสร็จแล้ว!', text: 'มารับอาหารที่หน้าร้านได้เลยครับ', confirmButtonColor: '#10B981'});
            }
        }
    </script>
</body>
</html>
