<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ติดตามคิวหมาล่า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .glass-effect { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  </style>
</head>
<body class="pb-28 max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl relative">

  <!-- Header -->
  <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 text-white p-4 sticky top-0 z-50 shadow-lg rounded-b-3xl">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-2xl">🌶️</span>
      <h1 class="text-lg font-black tracking-wide">ระบบสั่งหมาล่า & ติดตามคิว</h1>
    </div>
    <div class="flex bg-black/15 p-1 rounded-2xl border border-white/20 backdrop-blur-md">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all duration-300">📋 เมนูอาหาร</button>
      <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all duration-300">⏳ คิวของฉัน</button>
    </div>
  </div>

  <!-- Tab: เมนูอาหาร -->
  <div id="view-menu" class="p-4 space-y-4">
    <!-- กล่องค้นหานักเรียน -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
      <label class="text-xs font-bold text-slate-500 mb-1.5 block">👤 รหัสนักเรียน</label>
      <div class="flex gap-2">
        <input type="number" id="student-id" placeholder="กรอกรหัสนักเรียน..." class="flex-1 p-2.5 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:border-orange-500 focus:bg-white text-sm transition">
        <button onclick="searchStudent()" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white px-5 rounded-xl font-bold text-xs shadow-md transition">ค้นหา</button>
      </div>
      <div id="student-info" class="hidden mt-3 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-200 text-center shadow-sm"></div>
    </div>

    <!-- รายการเมนู -->
    <div id="menu-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 font-medium">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-orange-500 border-t-transparent mb-2"></div>
        <p class="text-xs">กำลังโหลดเมนูอาหาร...</p>
      </div>
    </div>
  </div>

  <!-- Tab: คิวของฉัน -->
  <div id="view-queue" class="hidden p-4 space-y-4">
    <div id="my-queue-card" class="bg-white border border-slate-200/80 rounded-3xl p-6 text-center shadow-sm">
      <p class="text-slate-400 text-sm font-medium">ยังไม่มีรายการสั่งซื้อ</p>
    </div>
    
    <div class="pt-2">
      <h3 class="font-bold text-slate-700 text-sm mb-3 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
        คิวที่กำลังรอดำเนินการ
      </h3>
      <div id="active-queue" class="space-y-2"></div>
    </div>
  </div>

  <!-- ตะกร้าสินค้า (Drawer) -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200/80 p-5 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.12)] z-50 transform translate-y-full transition-transform duration-300">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-extrabold text-slate-800 text-base flex items-center gap-2">🛒 สรุปรายการสั่งซื้อ</h3>
      <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 font-bold text-xs bg-slate-100 px-3 py-1.5 rounded-full">ปิด 🔽</button>
    </div>
    
    <!-- เลือกระดับความเผ็ด -->
    <label class="text-xs font-bold text-slate-500 mb-1.5 block">🌶️ ระดับความเผ็ด</label>
    <div class="flex gap-2 mb-4">
      <button onclick="setSpice('ไม่เผ็ด')" id="sp-ไม่เผ็ด" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 transition">ไม่เผ็ด</button>
      <button onclick="setSpice('เผ็ดกลาง')" id="sp-เผ็ดกลาง" class="flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold transition">เผ็ดกลาง</button>
      <button onclick="setSpice('เผ็ดมาก')" id="sp-เผ็ดมาก" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 transition">เผ็ดมาก</button>
    </div>
    
    <!-- วิธีชำระเงิน -->
    <label class="text-xs font-bold text-red-500 mb-1.5 block">* กรุณาเลือกวิธีชำระเงิน</label>
    <div class="flex gap-2 mb-5">
      <button onclick="setPayment('เงินโอน')" id="pay-เงินโอน" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition">💳 เงินโอน (PromptPay)</button>
      <button onclick="setPayment('เงินสด')" id="pay-เงินสด" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition">💵 เงินสด</button>
    </div>
    
    <!-- ปุ่มยืนยัน -->
    <button id="btn-submit" onclick="submitOrder()" class="w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl transition shadow-md">
      ยืนยันสั่งอาหาร <span id="cart-total" class="ml-2">0 ฿</span>
    </button>
  </div>

  <!-- ปุ่มลอยตะกร้าสินค้า (FAB) -->
  <button onclick="toggleCart()" id="fab-cart" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white p-4 rounded-full shadow-2xl shadow-slate-900/40 z-40 hover:scale-105 active:scale-95 transition">
    🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-gradient-to-r from-red-500 to-pink-500 text-white text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-white shadow">0</span>
  </button>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    const PROMPTPAY_NUMBER = "1418600121013"; 
    const EXPIRE_MINUTES = 10; 
    
    let cart = {}; 
    let spiciness = 'เผ็ดกลาง'; 
    let paymentMethod = ''; 
    let studentInfo = { id: '', name: '', class: '' };
    let myOrderInfo = { id: localStorage.getItem('my_order'), status: '', timestamp: 0 };
    let pollInterval;
    let qrTimerInterval; 

    // ฟังก์ชันดาวน์โหลด QR Code ลงเครื่องอัตโนมัติ
    async function downloadQRCode(url, filename = 'PromptPay_QR.png') {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    function playNotificationSound() {
      const audio = new Audio("https://files.catbox.moe/7s5kwu.mp3");
      audio.play().catch(e => console.log("Audio play failed:", e));
    }

    function switchTab(tab) {
      document.getElementById('view-menu').classList.add('hidden'); 
      document.getElementById('view-queue').classList.add('hidden');
      document.getElementById('tab-menu').className = 'flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all duration-300';
      document.getElementById('tab-queue').className = 'flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all duration-300';
      
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all duration-300';
      
      if(tab === 'queue') pollData(); else clearInterval(pollInterval);
    }

    async function searchStudent() {
      const id = document.getElementById('student-id').value;
      if (!id) return alert('กรุณากรอกรหัส');
      const btn = document.querySelector('button[onclick="searchStudent()"]'); btn.innerText = '...';
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchStudent', studentId: id }) });
        const data = await res.json();
        
        if (data.found) {
          studentInfo = { id, name: data.name, class: data.class };
          const infoDiv = document.getElementById('student-info');
          infoDiv.innerText = `👋 สวัสดีคุณ ${data.name} (${data.class})`; infoDiv.classList.remove('hidden');
        } else alert('ไม่พบข้อมูลนักเรียน');
      } catch(e) { alert('ค้นหาล้มเหลว กรุณาลองใหม่'); }
      btn.innerText = 'ค้นหา';
    }

    async function loadData() {
      try {
        const res = await fetch(GAS_URL); const data = await res.json();
        const c = document.getElementById('menu-container'); c.innerHTML = '';
        const cats = [...new Set(data.menus.map(m => m.category))];
        
        cats.forEach(cat => {
          c.innerHTML += `<h3 class="text-orange-600 font-extrabold text-sm mt-4 mb-2 pl-2 border-l-4 border-orange-500 flex items-center gap-1">${cat}</h3>`;
          data.menus.filter(m => m.category === cat).forEach(i => {
            const isOutOfStock = i.stock <= 0;
            c.innerHTML += `
              <div class="bg-white p-3 rounded-2xl border ${isOutOfStock ? 'border-red-100 bg-red-50/40' : 'border-slate-200/80'} flex items-center shadow-sm hover:shadow-md transition">
                <img src="${i.image || "https://placehold.co/100x100"}" class="w-16 h-16 object-cover rounded-xl mr-3 ${isOutOfStock ? 'grayscale opacity-60' : ''}">
                <div class="flex-1">
                  <p class="font-bold ${isOutOfStock ? 'text-slate-400' : 'text-slate-800'} text-sm">${i.name}</p>
                  <div class="flex items-center gap-2 mt-1">
                    <p class="text-orange-600 text-sm font-black">${i.price} ฿</p>
                    ${isOutOfStock ? `<span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-extrabold">หมด</span>` : `<span class="text-slate-400 text-[10px] bg-slate-100 px-2 py-0.5 rounded-full font-medium">เหลือ: ${i.stock}</span>`}
                  </div>
                </div>
                <div class="flex items-center space-x-1.5 bg-slate-100/80 rounded-xl p-1 border border-slate-200/60">
                  ${isOutOfStock ? `<span class="text-red-500 font-bold text-xs px-2 py-1">สินค้าหมด</span>` : 
                    `<button onclick="updateCart('${i.name}', ${i.price}, -1, ${i.stock})" class="w-7 h-7 flex items-center justify-center text-slate-600 font-bold bg-white rounded-lg shadow-sm active:scale-95 transition">-</button>
                     <span id="qty-${i.name}" class="w-5 text-center font-bold text-xs text-slate-800">0</span>
                     <button onclick="updateCart('${i.name}', ${i.price}, 1, ${i.stock})" class="w-7 h-7 flex items-center justify-center text-orange-600 font-bold bg-white rounded-lg shadow-sm active:scale-95 transition">+</button>`}
                </div>
              </div>`;
          });
        });
        updateQueueUI(data.orders);
      } catch(e) {}
    }

    function updateCart(n, p, c, maxStock) {
      if (!cart[n]) cart[n] = { price: p, qty: 0 };
      if (c > 0 && cart[n].qty + c > maxStock) return alert(`ขออภัยครับ ${n} เหลือแค่ ${maxStock} ชิ้น`);

      cart[n].qty += c;
      if (cart[n].qty <= 0) delete cart[n];
      else document.getElementById(`qty-${n}`).innerText = cart[n].qty;
      if(!cart[n] && document.getElementById(`qty-${n}`)) document.getElementById(`qty-${n}`).innerText = 0;
      
      const totalQty = Object.values(cart).reduce((s, i) => s + i.qty, 0);
      const totalPrice = Object.values(cart).reduce((s, i) => s + (i.price * i.qty), 0);
      
      const fab = document.getElementById('fab-cart');
      if(totalQty > 0) { 
        fab.classList.remove('hidden'); 
        document.getElementById('cart-badge').innerText = totalQty; 
        document.getElementById('cart-total').innerText = totalPrice + ' ฿'; 
      }
      else { 
        fab.classList.add('hidden'); 
        document.getElementById('cart-bar').classList.add('translate-y-full'); 
      }
    }

    function toggleCart() { document.getElementById('cart-bar').classList.toggle('translate-y-full'); }

    function setSpice(val) {
      spiciness = val;
      ['ไม่เผ็ด','เผ็ดกลาง','เผ็ดมาก'].forEach(v => {
        document.getElementById(`sp-${v}`).className = v === val 
          ? `flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold transition`
          : `flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 transition`;
      });
    }

    function setPayment(val) {
      paymentMethod = val;
      document.getElementById('pay-เงินโอน').className = val === 'เงินโอน' ? 'flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md transition' : 'flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition';
      document.getElementById('pay-เงินสด').className = val === 'เงินสด' ? 'flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow-md transition' : 'flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition';
      
      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.className = "w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-base py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 transition active:scale-98";
    }

    async function submitOrder() {
      if(!studentInfo.id) { toggleCart(); return alert('กรุณาค้นหาและยืนยันข้อมูลนักเรียนก่อนครับ'); }
      if(Object.keys(cart).length === 0) return alert('กรุณาเลือกอาหาร');
      if(!paymentMethod) return alert('กรุณาเลือก "วิธีชำระเงิน" ก่อนกดยืนยันครับ');

      const btn = document.getElementById('btn-submit'); btn.innerText = 'กำลังส่งออเดอร์...'; btn.disabled = true;
      let itemsText = [], total = 0;
      for (const [n, d] of Object.entries(cart)) { itemsText.push(`${n} x${d.qty}`); total += d.price * d.qty; }

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'newOrder', studentId: studentInfo.id, studentName: studentInfo.name, class: studentInfo.class, items: itemsText.join(', '), spiciness, totalPrice: total, paymentMethod, cartRaw: cart }) });
        const result = await res.json();
        
        localStorage.setItem('my_order', result.orderId);
        myOrderInfo = { id: result.orderId, status: 'Pending' };
        
        cart = {}; 
        document.querySelectorAll('[id^="qty-"]').forEach(el => el.innerText = '0');
        document.getElementById('fab-cart').classList.add('hidden'); toggleCart();
        
        paymentMethod = '';
        document.getElementById('pay-เงินโอน').className = 'flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition';
        document.getElementById('pay-เงินสด').className = 'flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200 transition';
        document.getElementById('btn-submit').className = "w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl transition";
        
        switchTab('queue'); btn.innerText = 'ยืนยันสั่งอาหาร'; btn.disabled = false;
        loadData();
      } catch (e) { alert('เกิดข้อผิดพลาด กรุณาลองใหม่'); btn.innerText = 'ยืนยันสั่งอาหาร'; btn.disabled = false; }
    }

    async function autoExpireOrder(orderId) {
      clearInterval(qrTimerInterval);
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', orderId: orderId, type: 'food', value: 'Expired' }) });
      alert('⚠️ ออเดอร์ของคุณหมดเวลาในการชำระเงิน และถูกยกเลิกแล้ว กรุณาสั่งใหม่ครับ');
      clearMyOrder();
    }

    function clearMyOrder() {
      localStorage.removeItem('my_order');
      myOrderInfo = { id: null, status: '' };
      clearInterval(qrTimerInterval);
      loadData();
      switchTab('menu');
    }

    function updateQueueUI(orders) {
      if(myOrderInfo.id) {
        const myO = orders.find(o => o.orderId === myOrderInfo.id);
        const card = document.getElementById('my-queue-card');
        
        if(myO) {
          if (myO.status === 'Cancelled' || myO.status === 'Expired') {
             alert('ออเดอร์นี้ถูกยกเลิก หรือหมดอายุแล้ว ระบบทำการคืนสต๊อกเรียบร้อยแล้ว');
             clearMyOrder(); return;
          }

          if (myOrderInfo.status !== 'Completed' && myO.status === 'Completed') {
             playNotificationSound();
          }

          myOrderInfo.status = myO.status;
          let statusHTML = '';
          
          if(myO.paymentMethod === 'เงินโอน' && myO.paymentStatus !== 'Paid') {
            const orderTimestamp = Number(myO.timestamp) || new Date().getTime();
            const qrImageUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${myO.totalPrice}.png`;
            
            statusHTML = `
              <div class="mt-4 p-5 bg-white border border-slate-200 rounded-2xl flex flex-col items-center shadow-md relative">
                <p class="font-bold text-slate-800 text-sm mb-1">สแกนชำระเงิน <span class="text-xl font-black text-orange-600">${myO.totalPrice} ฿</span></p>
                <div class="p-3 bg-white border border-slate-200 rounded-2xl shadow-inner my-2">
                  <img src="${qrImageUrl}" class="w-48 h-48 rounded-xl object-contain">
                </div>
                
                <!-- ปุ่มดาวน์โหลด QR Code -->
                <button onclick="downloadQRCode('${qrImageUrl}', 'PromptPay_${myO.orderId}.png')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/20 transition my-2">
                  <span>📥</span> บันทึกรูป QR Code ลงเครื่อง
                </button>
                
                <p class="text-[11px] text-slate-400 font-medium mb-3">⚠️ โอนแล้วนำสลิปแสดงที่หน้าเคาน์เตอร์</p>
                <div id="qr-countdown" class="bg-red-50 text-red-600 font-bold px-3.5 py-1.5 rounded-full text-xs border border-red-100 flex items-center gap-1">
                  ⏳ หมดเวลาใน: กำลังคำนวณ...
                </div>
              </div>
            `;
            
            clearInterval(qrTimerInterval);
            qrTimerInterval = setInterval(() => {
              const now = new Date().getTime();
              const expireTime = orderTimestamp + (EXPIRE_MINUTES * 60 * 1000);
              const timeLeft = expireTime - now;

              if (timeLeft <= 0) {
                autoExpireOrder(myO.orderId);
              } else {
                const el = document.getElementById('qr-countdown');
                if (el) {
                  const m = Math.floor(timeLeft / 60000);
                  const s = Math.floor((timeLeft % 60000) / 1000);
                  el.innerText = `⏳ หมดเวลาใน: ${m}:${s < 10 ? '0':''}${s} นาที`;
                }
              }
            }, 1000);

          } else if (myO.status === 'Completed') {
            clearInterval(qrTimerInterval);
            statusHTML = `
              <div class="mt-4 p-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-2xl shadow-lg flex flex-col items-center">
                <span class="text-3xl mb-1 animate-bounce">🎉</span>
                <p class="font-extrabold text-base mb-3">อาหารเสร็จแล้ว! มารับได้เลยครับ</p>
                <button onclick="clearMyOrder()" class="bg-white text-emerald-700 font-bold py-2 px-6 rounded-xl text-xs shadow hover:bg-emerald-50 transition active:scale-95">รับอาหารเรียบร้อย (สั่งใหม่)</button>
              </div>`;
          } else if (myO.status === 'Cooking') {
            clearInterval(qrTimerInterval);
            statusHTML = `<div class="mt-4 p-3 bg-amber-50 text-amber-700 rounded-xl font-bold border border-amber-200/80 text-xs flex items-center justify-center gap-1.5">🔥 กำลังประกอบอาหาร...</div>`;
          } else {
            clearInterval(qrTimerInterval);
            statusHTML = `<div class="mt-4 p-3 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5">⏳ รอร้านรับออเดอร์</div>`;
          }
          
          card.innerHTML = `<p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1">หมายเลขคิวของคุณ</p><h2 class="text-5xl font-black text-slate-800 tracking-tight">${myO.orderId}</h2>${statusHTML}`;
        }
      }

      const q = document.getElementById('active-queue'); q.innerHTML = '';
      const active = orders.filter(o => o.status === 'Pending' || o.status === 'Cooking');
      if (active.length === 0) q.innerHTML = '<p class="text-center text-xs text-slate-400 py-6 bg-white rounded-2xl border border-slate-200/80">ไม่มีคิวที่กำลังรออยู่ในขณะนี้</p>';
      else {
        active.forEach(o => {
          q.innerHTML += `
            <div class="flex justify-between items-center p-3.5 bg-white border border-slate-200/80 rounded-2xl shadow-sm">
              <span class="font-black text-base ${o.orderId === myOrderInfo.id ? 'text-orange-600' : 'text-slate-800'}">${o.orderId}</span>
              <span class="text-[11px] px-3 py-1 rounded-full font-bold ${o.status === 'Cooking' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-slate-100 text-slate-600'}">${o.status === 'Cooking' ? '🔥 กำลังทำ' : '⏳ รอคิว'}</span>
            </div>`;
        });
      }
    }

    async function pollData() {
      try {
        const res = await fetch(GAS_URL); const data = await res.json();
        updateQueueUI(data.orders);
      } catch(e) {}
    }

    loadData();
    setInterval(() => { if(!document.getElementById('view-queue').classList.contains('hidden')) pollData(); }, 10000);
  </script>
</body>
</html>
