<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
  </style>
</head>
<body class="pb-24 text-slate-800">

  <!-- Header -->
  <header class="bg-gradient-to-r from-red-600 to-orange-500 text-white p-5 shadow-lg sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-wider">🌶️ ล่าหมามาแดก</h1>
        <p class="text-xs text-orange-100 font-medium">หมาล่าจ้าาา</p>
      </div>
      <button onclick="checkOrderStatusPrompt()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-2 rounded-xl backdrop-blur-md border border-white/30 transition-all">
        🔍 เช็คคิวอาหาร
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">
    
    <!-- Step 1: ค้นหานักเรียน -->
    <section id="studentSection" class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
      <label class="block text-sm font-bold text-slate-700 mb-2">👤 ข้อมูลผู้สั่งซื้อ (ค้นหาด้วยชื่อหรือรหัส)</label>
      <div class="flex gap-2">
        <input type="text" id="studentSearchInput" placeholder="พิมพ์ชื่อ หรือ รหัสนักเรียน..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
        <button onclick="searchStudent()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-5 py-2.5 rounded-2xl text-sm transition-all shadow-sm">
          ค้นหา
        </button>
      </div>
      <div id="studentInfo" class="hidden mt-3 p-3 bg-orange-50 border border-orange-200 rounded-2xl text-xs text-orange-900 font-bold flex justify-between items-center">
        <span id="studentDetailText"></span>
        <button onclick="resetStudent()" class="text-red-500 hover:underline">เปลี่ยน</button>
      </div>
    </section>

    <!-- Step 2: เลือกเมนูอาหาร -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-black text-slate-800 text-lg">🍡 เลือกเมนูอาหาร</h2>
        <span id="menuLoading" class="text-xs text-slate-400">กำลังโหลดเมนู...</span>
      </div>
      <div id="menuContainer" class="grid grid-cols-2 gap-3"></div>
    </section>

  </main>

  <!-- Floating Cart Bar (แถบตะกร้าลอยด้านล่าง) -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-4 shadow-2xl z-40 hidden">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-slate-500 font-bold">รวมทั้งหมด (<span id="cartTotalCount">0</span> ชิ้น)</p>
        <p class="text-xl font-black text-red-500"><span id="cartTotalPrice">0</span> ฿</p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-gradient-to-r from-orange-500 to-red-600 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-md hover:opacity-95 transition-all">
        ไปหน้าชำระเงิน ➔
      </button>
    </div>
  </div>

  <script>
    // ⚙️ กำหนดค่าระบบ (แก้ไขตรงนี้)
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; // 👈 วาง URL Web App ของคุณ
    const PROMPTPAY_NUMBER = "1418600121013";                // 👈 เบอร์พร้อมเพย์
    const ACCOUNT_NAME = "ศิวัช เรียมแสน";               // 👈 ชื่อบัญชี

    let currentStudent = null;
    let menuList = [];
    let cart = {}; // { 'ชื่อเมนู': { price: 10, qty: 2 } }

    window.onload = () => {
      fetchMenu();
    };

    // 1. ดึงข้อมูลเมนูจาก Google Sheets
    async function fetchMenu() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        menuList = data.menus || [];
        document.getElementById('menuLoading').classList.add('hidden');
        renderMenu();
      } catch (e) {
        document.getElementById('menuLoading').innerText = 'โหลดเมนูไม่สำเร็จ';
      }
    }

    // 2. แสดงรายการเมนู
    function renderMenu() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      menuList.forEach(item => {
        const isOutOfStock = item.stock <= 0;
        const qtyInCart = cart[item.name] ? cart[item.name].qty : 0;

        const card = `
          <div class="bg-white rounded-3xl p-3 border border-slate-100 shadow-sm flex flex-col justify-between ${isOutOfStock ? 'opacity-50' : ''}">
            <div>
              <img src="${item.image || 'https://via.placeholder.com/150?text=Mala'}" class="w-full h-28 object-cover rounded-2xl mb-2">
              <h3 class="font-bold text-sm text-slate-800 line-clamp-1">${item.name}</h3>
              <p class="text-xs font-black text-orange-600 mt-0.5">${item.price} ฿ <span class="text-[10px] text-slate-400 font-normal">(เหลือ ${item.stock})</span></p>
            </div>
            
            <div class="mt-3">
              ${isOutOfStock ? `
                <button disabled class="w-full bg-slate-200 text-slate-400 text-xs font-bold py-2 rounded-xl">หมดแล้ว</button>
              ` : `
                <div class="flex items-center justify-between bg-slate-50 p-1 rounded-xl border border-slate-100">
                  <button onclick="updateCart('${item.name}', ${item.price}, -1, ${item.stock})" class="w-7 h-7 bg-white text-slate-700 font-bold rounded-lg shadow-sm border flex items-center justify-center">-</button>
                  <span class="text-xs font-black px-1">${qtyInCart}</span>
                  <button onclick="updateCart('${item.name}', ${item.price}, 1, ${item.stock})" class="w-7 h-7 bg-orange-500 text-white font-bold rounded-lg shadow-sm flex items-center justify-center">+</button>
                </div>
              `}
            </div>
          </div>
        `;
        container.innerHTML += card;
      });

      updateCartBar();
    }

    // 3. ค้นหานักเรียน
    async function searchStudent() {
      const query = document.getElementById('studentSearchInput').value.trim();
      if (!query) return Swal.fire('เตือน', 'กรุณากรอกชื่อหรือรหัสนักเรียน', 'warning');

      Swal.showLoading();
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'searchStudent', query: query })
        });
        const data = await res.json();
        Swal.close();

        if (data.found) {
          currentStudent = data;
          document.getElementById('studentDetailText').innerText = `👤 ${data.name} (${data.class}) ID: ${data.studentId}`;
          document.getElementById('studentInfo').classList.remove('hidden');
        } else {
          Swal.fire('ไม่พบข้อมูล', 'ไม่พบรายชื่อนักเรียนในระบบ', 'error');
        }
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อระบบไม่สำเร็จ', 'error');
      }
    }

    function resetStudent() {
      currentStudent = null;
      document.getElementById('studentInfo').classList.add('hidden');
      document.getElementById('studentSearchInput').value = '';
    }

    // 4. จัดการตะกร้าสินค้า
    function updateCart(name, price, change, maxStock) {
      if (!cart[name]) cart[name] = { price: price, qty: 0 };
      
      let newQty = cart[name].qty + change;
      if (newQty > maxStock) return Swal.fire('สินค้าไม่พอ', `เหลือสต๊อกเพียง ${maxStock} ชิ้น`, 'warning');
      
      if (newQty <= 0) {
        delete cart[name];
      } else {
        cart[name].qty = newQty;
      }
      renderMenu();
    }

    function updateCartBar() {
      let totalCount = 0;
      let totalPrice = 0;

      for (const item of Object.values(cart)) {
        totalCount += item.qty;
        totalPrice += (item.price * item.qty);
      }

      document.getElementById('cartTotalCount').innerText = totalCount;
      document.getElementById('cartTotalPrice').innerText = totalPrice.toLocaleString();

      if (totalCount > 0) {
        document.getElementById('cartBar').classList.remove('hidden');
      } else {
        document.getElementById('cartBar').classList.add('hidden');
      }
    }

    // 5. สั่งซื้อสินค้า & เลือกวิธีชำระเงิน
    async function openCheckoutModal() {
      if (!currentStudent) return Swal.fire('เตือน', 'กรุณาค้นหาและยืนยันชื่อผู้สั่งก่อนครับ', 'warning');

      let itemsSummary = Object.entries(cart).map(([name, item]) => `${name} x${item.qty}`).join(', ');
      let totalPrice = Object.values(cart).reduce((sum, item) => sum + (item.price * item.qty), 0);

      const { value: formValues } = await Swal.fire({
        title: 'ยืนยันรายการสั่งซื้อ',
        html: `
          <div class="text-left text-xs space-y-3">
            <div class="bg-slate-50 p-3 rounded-2xl border">
              <p class="font-bold text-slate-700">👤 ผู้สั่ง: ${currentStudent.name} (${currentStudent.class})</p>
              <p class="text-slate-500 mt-1">🍡 รายการ: ${itemsSummary}</p>
              <p class="text-red-500 font-black text-sm mt-1">ยอดรวม: ${totalPrice} บาท</p>
            </div>

            <div>
              <label class="block font-bold mb-1 text-slate-700">🌶️ เลือกระดับความเผ็ด:</label>
              <select id="spicinessSelect" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">
                <option value="เผ็ดน้อย">🌶️ เผ็ดน้อย (อนุบาล)</option>
                <option value="เผ็ดกลาง" selected>🌶️🌶️ เผ็ดกลาง (กำลังดี)</option>
                <option value="เผ็ดมาก">🌶️🌶️🌶️ เผ็ดมาก (พ่นไฟ)</option>
              </select>
            </div>

            <div>
              <label class="block font-bold mb-1 text-slate-700">💳 ช่องทางการชำระเงิน:</label>
              <select id="paymentMethodSelect" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">
                <option value="เงินโอน">📲 เงินโอน (แนบสลิปทันที)</option>
                <option value="เงินสด">💵 เงินสด (ชำระหน้าร้าน)</option>
              </select>
            </div>
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'ยืนยันการสั่งซื้อ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#f97316',
        preConfirm: () => {
          return {
            spiciness: document.getElementById('spicinessSelect').value,
            paymentMethod: document.getElementById('paymentMethodSelect').value
          }
        }
      });

      if (formValues) {
        submitOrder(itemsSummary, totalPrice, formValues.spiciness, formValues.paymentMethod);
      }
    }

    // 6. ส่งออเดอร์ไป Google Apps Script
    async function submitOrder(itemsStr, totalPrice, spiciness, paymentMethod) {
      Swal.fire({ title: 'กำลังบันทึกออเดอร์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const payload = {
          action: 'newOrder',
          studentId: currentStudent.studentId,
          studentName: currentStudent.name,
          class: currentStudent.class,
          items: itemsStr,
          spiciness: spiciness,
          totalPrice: totalPrice,
          paymentMethod: paymentMethod,
          cartRaw: cart
        };

        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();

        if (data.status === 'success') {
          const orderId = data.orderId;
          cart = {}; // ล้างตะกร้า
          renderMenu();

          if (paymentMethod === 'เงินโอน') {
            showPromptPayQRCode(orderId, totalPrice);
          } else {
            Swal.fire('สั่งซื้อสำเร็จ!', `รหัสออเดอร์ของคุณคือ ${orderId}`, 'success');
          }
        }
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'ส่งออเดอร์ไม่สำเร็จ กรุณาลองใหม่', 'error');
      }
    }

    // 7. บังคับแนบสลิป (เฉพาะเงินโอน)
    function showPromptPayQRCode(orderId, amount) {
      const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;
      
      Swal.fire({
        title: 'ชำระเงิน & แนบสลิป',
        html: `
          <div class="flex flex-col items-center">
            <div class="bg-white p-2 rounded-2xl border mb-2"><img src="${qrUrl}" class="w-44 h-44 object-contain"></div>
            <p class="text-2xl font-black text-emerald-600 mb-1">${amount.toLocaleString()} บาท</p>
            <p class="text-xs text-slate-500 font-bold mb-3">ชื่อบัญชี: ${ACCOUNT_NAME}</p>
            <hr class="w-full mb-3">
            <label class="block text-xs font-bold text-red-600 mb-2 w-full text-left">📸 บังคับแนบสลิปโอนเงิน (หากไม่แนบจะสั่งไม่สำเร็จ):</label>
            <input type="file" id="slipInput" accept="image/*" class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
          </div>
        `,
        confirmButtonText: 'บันทึกสลิปส่งร้าน ➔',
        confirmButtonColor: '#ea580c',
        allowOutsideClick: false,
        preConfirm: () => {
          const file = document.getElementById('slipInput').files[0];
          if (!file) {
            Swal.showValidationMessage('คุณต้องแนบรูปสลิปโอนเงินก่อนครับ!');
            return false;
          }
          return file;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'กำลังอัปโหลดสลิป...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          
          // ย่อขนาดภาพก่อนส่งขึ้นระบบ
          compressImage(result.value, async (base64Image) => {
            await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'uploadSlip', orderId: orderId, image: base64Image })
            });
            Swal.fire('สำเร็จ!', `ส่งออเดอร์ ${orderId} ให้ร้าน ล่าหมามาแดก เรียบร้อย`, 'success');
          });
        }
      });
    }

    // 8. ฟังก์ชันย่อขนาดภาพรูปสลิป
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 9. ตรวจสอบสถานะคิว
    async function checkOrderStatusPrompt() {
      const { value: orderId } = await Swal.fire({
        title: 'ตรวจสอบสถานะคิว',
        input: 'text',
        inputLabel: 'กรอกรหัสออเดอร์ของคุณ (เช่น #1001)',
        inputPlaceholder: '#1001',
        showCancelButton: true,
        confirmButtonText: 'เช็คคิว',
        confirmButtonColor: '#f97316'
      });

      if (orderId) {
        Swal.showLoading();
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'checkStatus', orderId: orderId.trim() })
          });
          const data = await res.json();
          
          if (data.found) {
            let statusText = '';
            if (data.status === 'Pending') statusText = '⏳ กำลังรอคิว (ยังไม่ทำ)';
            else if (data.status === 'Cooking') statusText = '🍳 กำลังทอดอยู่!';
            else if (data.status === 'Ready') statusText = '🔔 ทอดเสร็จแล้ว รับอาหารได้เลย!';
            else statusText = data.status;

            Swal.fire({
              title: `ออเดอร์ ${orderId}`,
              html: `
                <p class="text-base font-bold text-slate-800 mb-2">สถานะ: <span class="text-orange-600">${statusText}</span></p>
                <p class="text-xs text-slate-500">มีออเดอร์ก่อนหน้าคุณ: <b class="text-slate-800 text-sm">${data.queueAhead}</b> คิว</p>
              `,
              icon: 'info'
            });
          } else {
            Swal.fire('ไม่พบออเดอร์', 'โปรดตรวจสอบรหัสออเดอร์ใหม่อีกครั้ง', 'error');
          }
        } catch (e) {
          Swal.fire('ข้อผิดพลาด', 'เช็คสถานะไม่สำเร็จ', 'error');
        }
      }
    }
  </script>
</body>
</html>
