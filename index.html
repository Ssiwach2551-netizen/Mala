<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก — สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.75rem !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-header { background: linear-gradient(135deg, #ea580c 0%, #dc2626 100%); }
    .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="pb-32 min-h-screen">

  <!-- หน้าจอเปิดเสียงแจ้งเตือน -->
  <div id="soundUnlockOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full space-y-5 animate-fade-in">
      <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-3xl flex items-center justify-center text-4xl mx-auto animate-bounce shadow-inner">
        🔔
      </div>
      <div>
        <h2 class="text-2xl font-black text-slate-800">ล่าหมามาแดก</h2>
        <p class="text-xs text-slate-500 mt-1">กดปุ่มด้านล่างเพื่อเปิดระบบเสียงแจ้งเตือนเมื่ออาหารพร้อมรับ</p>
      </div>
      <button onclick="enableCustomerSound()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all text-base">
        เข้าสู่หน้าสั่งอาหาร 🌶️
      </button>
    </div>
  </div>

  <!-- Hero Header -->
  <div class="glass-header text-white px-5 pt-8 pb-10 rounded-b-[2.5rem] shadow-xl relative overflow-hidden">
    <div class="absolute -right-6 -bottom-6 text-white/5 font-black text-9xl select-none pointer-events-none">🌶️</div>
    <div class="max-w-md mx-auto space-y-4 relative z-10">
      <div class="flex justify-between items-center">
        <div>
          <span class="bg-white/20 backdrop-blur-md text-white text-[10px] px-3 py-1 rounded-full font-bold tracking-wider uppercase border border-white/20">🔥 อร่อยเผ็ดชา</span>
          <h1 class="text-2xl font-black tracking-tight mt-1">หม่าล่าซ่าฮาเฮ</h1>
        </div>
        <button onclick="openStatusPage()" class="bg-white/90 hover:bg-white text-orange-600 px-4 py-2.5 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition-all flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-orange-500"></span>
          </span>
          📊 สถานะคิว
        </button>
      </div>
      
      <!-- ข้อมูลผู้สั่ง -->
      <div class="bg-slate-950/20 backdrop-blur-md p-3.5 rounded-2xl border border-white/15 flex justify-between items-center text-xs">
        <div id="studentInfoDisplay" class="font-bold text-white/90 flex items-center gap-2">
          <span>👤</span> <span>ยังไม่ได้ระบุชื่อผู้สั่ง</span>
        </div>
        <button onclick="promptStudentSearch()" class="bg-white/20 hover:bg-white/30 text-white font-extrabold text-[11px] px-3 py-1.5 rounded-xl transition-all border border-white/10 active:scale-95">
          ระบุตัวตน
        </button>
      </div>
    </div>
  </div>

  <!-- หมวดหมู่และเมนู -->
  <div class="max-w-md mx-auto px-4 -mt-4 relative z-20">
    <div id="categoryTabs" class="flex gap-2 overflow-x-auto hide-scrollbar py-1"></div>
  </div>

  <div class="max-w-md mx-auto px-4 mt-4">
    <div id="menuGrid" class="grid grid-cols-2 gap-3.5"></div>
  </div>

  <!-- Floating Cart -->
  <div id="floatingCart" class="fixed bottom-5 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur-md text-white rounded-3xl p-4 shadow-2xl border border-slate-800 flex justify-between items-center transition-all duration-300 translate-y-36 z-50">
    <div>
      <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">ยอดรวมทั้งหมด</p>
      <p id="cartTotalPrice" class="text-xl font-black text-emerald-400">0 ฿</p>
    </div>
    <button onclick="openCheckoutModal()" class="bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 text-white font-black px-5 py-3 rounded-2xl shadow-lg shadow-orange-500/20 active:scale-95 transition-all flex items-center gap-2 text-xs">
      <span>🛒</span> สั่งซื้อเลย (<span id="cartTotalQty">0</span>)
    </button>
  </div>

  <audio id="adminSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    const PROMPTPAY_NUMBER = "1418600121013"; // 👈 ใส่เบอร์พร้อมเพย์
    const ACCOUNT_NAME = "ศิวัช เรียมแสน"; // 👈 ชื่อบัญชีที่แสดง

    let menus = [], cart = {}, currentUser = null, activeCategory = 'ทั้งหมด', statusInterval = null;
    let myActiveOrderId = localStorage.getItem('mala_active_order') || null;

    function enableCustomerSound() {
      document.getElementById('soundUnlockOverlay').classList.add('hidden');
      const sound = document.getElementById('adminSound');
      sound.play().then(() => { sound.pause(); sound.currentTime = 0; }).catch(() => {});
      init();
    }

    async function init() {
      await loadMenuData();
      if (myActiveOrderId) startQueueTracking(myActiveOrderId);
    }

    async function loadMenuData() {
      try {
        const res = await fetch(GAS_URL + "?action=getMenus");
        const data = await res.json();
        menus = data.menus || [];
        renderCategories();
        renderMenu();
      } catch (e) {
        console.error("Load menu failed", e);
      }
    }

    function renderCategories() {
      const cats = ['ทั้งหมด', ...new Set(menus.map(m => m.category || 'อาหารจานหลัก'))];
      document.getElementById('categoryTabs').innerHTML = cats.map(c => `
        <button onclick="setCategory('${c}')" class="px-4 py-2 rounded-2xl font-black text-xs whitespace-nowrap transition-all shadow-sm ${activeCategory === c ? 'bg-orange-600 text-white shadow-orange-500/20' : 'bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-50'}">${c}</button>
      `).join('');
    }

    function setCategory(cat) { activeCategory = cat; renderCategories(); renderMenu(); }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      const filtered = activeCategory === 'ทั้งหมด' ? menus : menus.filter(m => (m.category || 'อาหารจานหลัก') === activeCategory);

      if (!filtered.length) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-slate-400 py-10">ไม่มีรายการอาหารในหมวดหมู่นี้</p>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const qty = cart[m.name]?.qty || 0;
        const stock = Number(m.stock) || 0;
        const isOutOfStock = stock <= 0;
        const hasImg = m.image && m.image.trim() !== '' && m.image !== 'undefined';
        
        return `
          <div class="bg-white rounded-3xl p-3 border border-slate-100 card-shadow relative overflow-hidden flex flex-col justify-between ${isOutOfStock ? 'opacity-60' : ''}">
            ${isOutOfStock ? '<div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] z-10 flex items-center justify-center font-black text-white text-xs tracking-wide">สินค้าหมด 😭</div>' : ''}
            <div>
              <div class="w-full h-28 rounded-2xl overflow-hidden bg-slate-100 mb-2.5 relative">
                ${hasImg ? `<img src="${m.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-3xl bg-slate-100">🍲</div>`}
                <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-md text-amber-400 font-black text-[11px] px-2.5 py-0.5 rounded-xl border border-white/10">${m.price} ฿</span>
              </div>
              <h3 class="font-bold text-slate-800 text-xs leading-snug mb-0.5 truncate">${m.name}</h3>
              <p class="text-[10px] text-slate-400 font-semibold mb-3">คงเหลือ: ${stock}</p>
            </div>
            <div class="flex items-center justify-between bg-slate-50 p-1 rounded-2xl border border-slate-100">
              <button onclick="changeQty('${m.name}', -1)" class="w-7 h-7 rounded-xl bg-white text-slate-700 shadow-sm font-black active:scale-90 transition-all text-xs">-</button>
              <span class="font-black text-xs text-slate-800">${qty}</span>
              <button onclick="changeQty('${m.name}', 1)" ${isOutOfStock ? 'disabled' : ''} class="w-7 h-7 rounded-xl bg-orange-500 text-white shadow-sm font-black active:scale-90 transition-all text-xs">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(name, delta) {
      const item = menus.find(m => m.name === name);
      if (!item) return;
      if (!cart[name]) cart[name] = { price: Number(item.price), qty: 0 };
      
      cart[name].qty += delta;
      if (cart[name].qty > item.stock) {
        cart[name].qty = item.stock;
        Swal.fire({ title: 'สต๊อกสินค้าไม่พอ', icon: 'warning', timer: 1200, showConfirmButton: false, background: '#0f172a', color: '#fff' });
      }
      if (cart[name].qty <= 0) delete cart[name];
      renderMenu(); 
      updateCartBar();
    }

    function updateCartBar() {
      let totalQty = 0, totalPrice = 0;
      Object.values(cart).forEach(i => { totalQty += i.qty; totalPrice += (i.qty * i.price); });
      document.getElementById('cartTotalQty').innerText = totalQty;
      document.getElementById('cartTotalPrice').innerText = totalPrice.toLocaleString() + ' ฿';
      document.getElementById('floatingCart').classList.toggle('translate-y-36', totalQty === 0);
    }

    async function promptStudentSearch() {
      const { value: query } = await Swal.fire({ 
        title: 'ระบุตัวตนผู้สั่ง', 
        input: 'text', 
        inputPlaceholder: 'กรอกรหัส หรือ ชื่อนักเรียน/เลขโต๊ะ...', 
        showCancelButton: true, 
        confirmButtonText: 'ค้นหา 🔍',
        confirmButtonColor: '#ea580c'
      });
      if (query) {
        Swal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
          const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchStudent', studentId: query }) });
          const data = await res.json();
          if (data.found) {
            currentUser = data; 
            document.getElementById('studentInfoDisplay').innerHTML = `<span>👤</span> <b>${data.name}</b> (${data.class || 'ทั่วไป'})`;
            Swal.fire({ icon: 'success', title: 'พบข้อมูล!', text: `${data.name} ${data.class ? 'ห้อง ' + data.class : ''}`, timer: 1500, showConfirmButton: false });
          } else {
            currentUser = { name: query, class: 'ทั่วไป' };
            document.getElementById('studentInfoDisplay').innerHTML = `<span>👤</span> <b>${query}</b>`;
            Swal.fire({ icon: 'info', title: 'บันทึกชื่อผู้ใช้งานแล้ว', text: `คุณสั่งในชื่อ: ${query}`, timer: 1500, showConfirmButton: false });
          }
        } catch(e) {
          currentUser = { name: query, class: 'ทั่วไป' };
          document.getElementById('studentInfoDisplay').innerHTML = `<span>👤</span> <b>${query}</b>`;
          Swal.close();
        }
      }
    }

    async function openCheckoutModal() {
      if (!currentUser) { await promptStudentSearch(); if (!currentUser) return; }
      const itemsStr = Object.entries(cart).map(([k, v]) => `${k} x${v.qty}`).join(', ');
      const totalPrice = Object.values(cart).reduce((a, b) => a + (b.qty * b.price), 0);

      const { value: form } = await Swal.fire({
        title: 'สรุปรายการสั่งซื้อ',
        html: `
          <div class="text-left text-xs space-y-3 mb-2">
            <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-slate-700 leading-relaxed font-semibold">
              <p class="text-slate-400 text-[10px] mb-1 uppercase font-bold">รายการอาหาร</p>
              ${itemsStr}
            </div>
            <p class="text-xl font-black text-emerald-600 text-right">ยอดรวม: ${totalPrice.toLocaleString()} ฿</p>
            <div>
              <label class="font-bold block mb-1 text-slate-700">🌶️ เลือกระดับความเผ็ด:</label>
              <select id="swal-spiciness" class="w-full p-3 rounded-xl border border-slate-200 bg-white font-bold text-slate-700 focus:outline-none">
                <option value="เผ็ดน้อย">🌱 เผ็ดน้อย (กลมกล่อม)</option>
                <option value="เผ็ดกลาง" selected>🌶️ เผ็ดกลาง (สูตรต้นตำรับ)</option>
                <option value="เผ็ดมาก">🔥🔥 เผ็ดมาก (สะใจ)</option>
                <option value="ไม่เผ็ด">❌ ไม่เผ็ด</option>
              </select>
            </div>
            <div>
              <label class="font-bold block mb-1 text-slate-700">💳 วิธีการชำระเงิน:</label>
              <select id="swal-payment" class="w-full p-3 rounded-xl border border-slate-200 bg-white font-bold text-slate-700 focus:outline-none">
                <option value="เงินโอน">💳 เงินโอน (สแกน PromptPay)</option>
                <option value="เงินสด">💵 เงินสด</option>
              </select>
            </div>
          </div>
        `,
        showCancelButton: true, 
        confirmButtonText: '🚀 ยืนยันการสั่งซื้อ', 
        confirmButtonColor: '#ea580c',
        preConfirm: () => ({ spiciness: document.getElementById('swal-spiciness').value, paymentMethod: document.getElementById('swal-payment').value })
      });

      if (form) sendOrder(itemsStr, totalPrice, form.spiciness, form.paymentMethod);
    }

    async function sendOrder(itemsStr, totalPrice, spiciness, paymentMethod) {
      Swal.fire({ title: 'กำลังส่งออเดอร์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const payload = {
          action: 'createOrder',
          studentId: currentUser.studentId || currentUser.name,
          studentName: currentUser.name,
          class: currentUser.class || '',
          items: itemsStr,
          spiciness: spiciness,
          totalPrice: totalPrice,
          paymentMethod: paymentMethod,
          paymentStatus: paymentMethod === 'เงินโอน' ? 'Pending' : 'Unpaid'
        };

        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        
        if (data.status === 'success' || data.orderId) {
          const orderId = data.orderId;
          cart = {}; 
          updateCartBar(); 
          loadMenuData();
          localStorage.setItem('mala_active_order', orderId);
          startQueueTracking(orderId);
          
          if (paymentMethod === 'เงินโอน') {
            showPromptPayQRCode(orderId, totalPrice);
          } else {
            Swal.fire({ icon: 'success', title: 'สั่งซื้อสำเร็จ!', text: `รหัสออเดอร์ของคุณ: #${orderId}`, confirmButtonText: 'ดูสถานะคิว', confirmButtonColor: '#ea580c' }).then(openStatusPage);
          }
        }
      } catch(e) { 
        Swal.fire({ icon: 'error', title: 'ส่งออเดอร์ไม่สำเร็จ', text: 'กรุณาลองใหม่อีกครั้ง', confirmButtonColor: '#ea580c' }); 
      }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = e => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400;
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        }
      }
    }

    function showPromptPayQRCode(orderId, amount) {
      const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;
      Swal.fire({
        title: 'ชำระเงิน & แนบสลิป',
        html: `
          <div class="flex flex-col items-center text-xs">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 mb-2 shadow-sm">
              <img src="${qrUrl}" class="w-44 h-44 rounded-xl object-contain">
            </div>
            <p class="text-xl font-black text-emerald-600 mb-0.5">${amount.toLocaleString()} บาท</p>
            <p class="text-[11px] text-slate-500 font-bold mb-3">ชื่อบัญชี: ${ACCOUNT_NAME}</p>
            <hr class="w-full mb-3 border-slate-100">
            <label class="block text-xs font-bold text-slate-700 mb-2 w-full text-left">📸 แนบรูปภาพสลิปโอนเงิน:</label>
            <input type="file" id="slipInput" accept="image/*" class="w-full text-xs file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-extrabold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
          </div>
        `,
        confirmButtonText: 'บันทึกสลิป ➔', 
        confirmButtonColor: '#ea580c', 
        allowOutsideClick: false,
        preConfirm: () => {
          const file = document.getElementById('slipInput').files[0];
          if (!file) { Swal.showValidationMessage('กรุณาแนบรูปสลิปโอนเงินก่อนยืนยัน'); return false; }
          return file;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'กำลังอัปโหลดสลิป...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          compressImage(result.value, async (base64Image) => {
            await fetch(GAS_URL, { 
              method: 'POST', 
              body: JSON.stringify({ action: 'uploadSlip', orderId: orderId, image: base64Image }) 
            });
            Swal.fire({ icon: 'success', title: 'อัปโหลดสำเร็จ!', text: 'ทางร้านได้รับสลิปเรียบร้อยแล้วครับ', confirmButtonColor: '#ea580c' }).then(openStatusPage);
          });
        }
      });
    }

    function startQueueTracking(orderId) {
      myActiveOrderId = orderId;
      if (statusInterval) clearInterval(statusInterval);
      checkOrderStatus(orderId);
      statusInterval = setInterval(() => checkOrderStatus(orderId), 5000);
    }

    async function checkOrderStatus(orderId) {
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: orderId }) });
        const data = await res.json();
        if (data.found && data.status === 'Ready') {
          clearInterval(statusInterval);
          document.getElementById('adminSound').play().catch(()=>{});
          Swal.fire({ 
            title: '🔔 อาหารเสร็จเรียบร้อย!', 
            html: `<p class="text-2xl font-black text-emerald-600 mb-1">#${orderId}</p><p class="text-xs text-slate-500">เชิญรับอาหารรสเด็ดที่เคาน์เตอร์ได้เลยครับ!</p>`, 
            icon: 'success', 
            confirmButtonText: 'รับอาหารแล้ว 👍',
            confirmButtonColor: '#ea580c' 
          }).then(() => { 
            localStorage.removeItem('mala_active_order'); 
            myActiveOrderId = null; 
          });
        }
      } catch(e) {}
    }

    async function openStatusPage() {
      if (!myActiveOrderId) return Swal.fire({ title: 'ไม่มีคิวที่รอดำเนินการ', text: 'คุณยังไม่มีรายการสั่งซื้อในขณะนี้', icon: 'info', confirmButtonColor: '#ea580c' });
      
      Swal.fire({ title: 'กำลังโหลดสถานะ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: myActiveOrderId }) });
        const data = await res.json();

        if (data.found) {
          const st = data.status;
          const step1 = true;
          const step2 = (st === 'Cooking' || st === 'Ready' || st === 'Completed');
          const step3 = (st === 'Ready' || st === 'Completed');

          Swal.fire({
            title: `สถานะคิว #${myActiveOrderId}`,
            html: `
              <div class="mb-4 bg-orange-50 text-orange-600 p-3 rounded-2xl text-center border border-orange-200/60">
                <p class="text-[10px] font-bold uppercase tracking-wider">จำนวนคิวก่อนหน้า</p>
                <p class="text-3xl font-black mt-0.5">${data.queueAhead || 0} <span class="text-xs font-normal">คิว</span></p>
              </div>

              <div class="relative ml-2 py-2 mt-4 space-y-6 text-left">
                <div class="absolute left-4 top-2 bottom-2 w-1 bg-slate-200 -z-10 rounded-full"></div>

                <div class="flex items-center gap-4 relative">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-md z-10 ${step1 ? 'bg-orange-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">1</div>
                  <div>
                    <h4 class="font-bold text-xs ${step1 && !step2 ? 'text-orange-600 text-sm' : 'text-slate-700'}">รับออเดอร์แล้ว 📝</h4>
                    <p class="text-[10px] text-slate-400">ทางร้านได้รับรายการอาหารของคุณเรียบร้อยแล้ว</p>
                  </div>
                </div>

                <div class="flex items-center gap-4 relative">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-md z-10 ${step2 ? 'bg-orange-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">${step2 ? '2' : ''}</div>
                  <div>
                    <h4 class="font-bold text-xs ${step2 && !step3 ? 'text-orange-600 text-sm animate-pulse' : 'text-slate-700'}">กำลังปรุงอาหาร 🍳</h4>
                    <p class="text-[10px] text-slate-400">เชฟกำลังปรุงหม่าล่าด้วยความพิถีพิถัน</p>
                  </div>
                </div>

                <div class="flex items-center gap-4 relative">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shadow-md z-10 ${step3 ? 'bg-emerald-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">${step3 ? '✓' : ''}</div>
                  <div>
                    <h4 class="font-bold text-xs ${step3 ? 'text-emerald-600 text-sm animate-bounce' : 'text-slate-700'}">พร้อมรับอาหาร 🔔</h4>
                    <p class="text-[10px] text-slate-400">เชิญมารับอาหารสุดอร่อยที่เคาน์เตอร์ได้เลย</p>
                  </div>
                </div>
              </div>
            `,
            confirmButtonText: 'ปิดหน้าต่าง',
            confirmButtonColor: '#475569'
          });
        }
      } catch(e) {
        Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถโหลดข้อมูลคิวได้', icon: 'error', confirmButtonColor: '#ea580c' });
      }
    }
  </script>
</body>
</html>
