<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28 text-slate-800">

  <!-- หน้าจอเปิดเสียง -->
  <div id="soundUnlockOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full">
      <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 animate-bounce">🔔</div>
      <h2 class="text-2xl font-black text-slate-800 mb-2">ต้อนรับสู่ร้านหม่าล่า!</h2>
      <p class="text-sm text-slate-500 mb-6">กดปุ่มด้านล่างเพื่อเปิดเสียงแจ้งเตือนเมื่ออาหารทำเสร็จพร้อมรับ</p>
      <button onclick="enableCustomerSound()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 text-white font-extrabold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-lg">
        เข้าสู่หน้าสั่งอาหาร 🌶️
      </button>
    </div>
  </div>

  <!-- Hero Header -->
  <div class="bg-gradient-to-r from-orange-600 via-orange-500 to-red-600 text-white p-6 pt-8 rounded-b-[2.5rem] shadow-xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <span class="bg-white/20 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-bold">🔥 อร่อยเผ็ดชา</span>
          <h1 class="text-3xl font-black tracking-tight mt-1">ล่าหมามาแดก</h1>
        </div>
        <button onclick="openStatusPage()" class="bg-white text-orange-600 px-4 py-2.5 rounded-2xl font-extrabold text-xs shadow-md active:scale-95 transition-all flex items-center gap-1.5 relative">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
          </span>
          📊 สถานะคิว
        </button>
      </div>
      
      <!-- ข้อมูลผู้สั่ง -->
      <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20 flex justify-between items-center text-sm">
        <div id="studentInfoDisplay" class="font-semibold text-white/90">👤 ยังไม่ได้ระบุชื่อผู้สั่ง</div>
        <button onclick="promptStudentSearch()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all">ระบุตัวตน</button>
      </div>
    </div>
  </div>

  <!-- หมวดหมู่และเมนู -->
  <div class="max-w-md mx-auto px-4 mt-6"><div id="categoryTabs" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div></div>
  <div class="max-w-md mx-auto px-4 mt-4"><div id="menuGrid" class="grid grid-cols-2 gap-4"></div></div>

  <!-- Floating Cart -->
  <div id="floatingCart" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-3xl p-4 shadow-2xl border border-slate-700/50 flex justify-between items-center transition-all duration-300 translate-y-32">
    <div>
      <p class="text-xs text-slate-400 font-bold">ยอดรวมทั้งหมด</p>
      <p id="cartTotalPrice" class="text-2xl font-black text-emerald-400">0 ฿</p>
    </div>
    <button onclick="openCheckoutModal()" class="bg-gradient-to-r from-orange-500 to-red-500 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-lg active:scale-95 transition-all flex items-center gap-2">
      🛒 สั่งซื้อเลย (<span id="cartTotalQty">0</span>)
    </button>
  </div>

  <audio id="adminSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    const PROMPTPAY_NUMBER = "1418600121013"; // 👈 ใส่เบอร์พร้อมเพย์
    const ACCOUNT_NAME = "ศิวัช เรียมแสน"; // 👈 ชื่อบัญชีที่แสดง

    let menus = [], cart = {}, currentUser = null, activeCategory = 'ทั้งหมด', statusInterval = null;
    let myActiveOrderId = localStorage.getItem('mala_active_order') || null;

    function enableCustomerSound() {
      document.getElementById('soundUnlockOverlay').classList.add('hidden');
      document.getElementById('adminSound').play().then(() => { document.getElementById('adminSound').pause(); document.getElementById('adminSound').currentTime = 0; }).catch(() => {});
      init();
    }

    async function init() {
      await loadMenuData();
      if (myActiveOrderId) startQueueTracking(myActiveOrderId);
    }

    async function loadMenuData() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        menus = data.menus; renderCategories(); renderMenu();
      } catch (e) { console.error("Load menu failed", e); }
    }

    function renderCategories() {
      const cats = ['ทั้งหมด', ...new Set(menus.map(m => m.category))];
      document.getElementById('categoryTabs').innerHTML = cats.map(c => `
        <button onclick="setCategory('${c}')" class="px-5 py-2.5 rounded-2xl font-extrabold text-xs whitespace-nowrap transition-all ${activeCategory === c ? 'bg-orange-500 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}">${c}</button>
      `).join('');
    }

    function setCategory(cat) { activeCategory = cat; renderCategories(); renderMenu(); }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      const filtered = activeCategory === 'ทั้งหมด' ? menus : menus.filter(m => m.category === activeCategory);
      grid.innerHTML = filtered.map(m => {
        const qty = cart[m.name]?.qty || 0;
        const isOutOfStock = m.stock <= 0;
        return `
          <div class="bg-white rounded-3xl p-3 border border-slate-100 shadow-sm relative overflow-hidden flex flex-col justify-between">
            ${isOutOfStock ? '<div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] z-10 flex items-center justify-center font-black text-white text-sm">หมดแล้ว 😭</div>' : ''}
            <div>
              <div class="w-full h-32 rounded-2xl overflow-hidden bg-slate-100 mb-3 relative">
                <img src="${m.image || 'https://images.unsplash.com/photo-1555126634-323283e090fa?w=500&q=80'}" class="w-full h-full object-cover">
                <span class="absolute top-2 right-2 bg-slate-900/70 backdrop-blur-md text-white font-black text-[11px] px-2.5 py-1 rounded-xl">${m.price} ฿</span>
              </div>
              <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">${m.name}</h3>
              <p class="text-[10px] text-slate-400 font-semibold mb-3">คงเหลือ: ${m.stock}</p>
            </div>
            <div class="flex items-center justify-between bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
              <button onclick="changeQty('${m.name}', -1)" class="w-8 h-8 rounded-xl bg-white shadow-sm font-black active:scale-95">-</button>
              <span class="font-black text-sm">${qty}</span>
              <button onclick="changeQty('${m.name}', 1)" ${isOutOfStock ? 'disabled' : ''} class="w-8 h-8 rounded-xl bg-orange-500 text-white shadow-sm font-black active:scale-95">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(name, delta) {
      const item = menus.find(m => m.name === name);
      if (!item) return;
      if (!cart[name]) cart[name] = { price: item.price, qty: 0 };
      cart[name].qty += delta;
      if (cart[name].qty > item.stock) { cart[name].qty = item.stock; Swal.fire({ title: 'สต๊อกไม่พอ', icon: 'warning', timer: 1500, showConfirmButton: false }); }
      if (cart[name].qty <= 0) delete cart[name];
      renderMenu(); updateCartBar();
    }

    function updateCartBar() {
      let totalQty = 0, totalPrice = 0;
      Object.values(cart).forEach(i => { totalQty += i.qty; totalPrice += (i.qty * i.price); });
      document.getElementById('cartTotalQty').innerText = totalQty;
      document.getElementById('cartTotalPrice').innerText = totalPrice + ' ฿';
      document.getElementById('floatingCart').classList.toggle('translate-y-32', totalQty === 0);
    }

    async function promptStudentSearch() {
      const { value: query } = await Swal.fire({ title: 'ระบุตัวตน', input: 'text', inputPlaceholder: 'กรอกรหัส หรือ ชื่อนักเรียน', showCancelButton: true, confirmButtonText: 'ค้นหา 🔍' });
      if (query) {
        Swal.fire({ title: 'กำลังค้นหา...', didOpen: () => Swal.showLoading() });
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchStudent', studentId: query }) });
        const data = await res.json();
        if (data.found) {
          currentUser = data; document.getElementById('studentInfoDisplay').innerHTML = `👤 <b>${data.name}</b> (${data.class})`;
          Swal.fire({ icon: 'success', title: 'พบข้อมูล!', text: `${data.name} ห้อง ${data.class}`, timer: 1500, showConfirmButton: false });
        } else { Swal.fire('ไม่พบข้อมูล', '', 'error'); }
      }
    }

    async function openCheckoutModal() {
      if (!currentUser) { await promptStudentSearch(); if (!currentUser) return; }
      const itemsStr = Object.entries(cart).map(([k, v]) => `${k} x${v.qty}`).join(', ');
      const totalPrice = Object.values(cart).reduce((a, b) => a + (b.qty * b.price), 0);

      const { value: form } = await Swal.fire({
        title: 'ยืนยันรายการสั่งซื้อ',
        html: `
          <div class="text-left text-sm space-y-3 mb-4">
            <p class="bg-slate-50 p-3 rounded-xl"><b>รายการ:</b> ${itemsStr}</p>
            <p class="text-xl font-black text-emerald-600 text-right">ยอดรวม: ${totalPrice} ฿</p>
            <label class="font-bold block mb-1">🌶️ ความเผ็ด:</label>
            <select id="swal-spiciness" class="w-full p-3 rounded-xl border-2 border-slate-200"><option value="เผ็ดน้อย">เผ็ดน้อย</option><option value="เผ็ดกลาง" selected>เผ็ดกลาง</option><option value="เผ็ดมาก">เผ็ดมาก</option></select>
            <label class="font-bold block mb-1">💳 การชำระเงิน:</label>
            <select id="swal-payment" class="w-full p-3 rounded-xl border-2 border-slate-200"><option value="เงินโอน">เงินโอน (แนบสลิป)</option><option value="เงินสด">เงินสด</option></select>
          </div>
        `,
        showCancelButton: true, confirmButtonText: '🚀 ดำเนินการสั่งซื้อ', preConfirm: () => ({ spiciness: document.getElementById('swal-spiciness').value, paymentMethod: document.getElementById('swal-payment').value })
      });

      if (form) sendOrder(itemsStr, totalPrice, form.spiciness, form.paymentMethod);
    }

    async function sendOrder(itemsStr, totalPrice, spiciness, paymentMethod) {
      Swal.fire({ title: 'ส่งออเดอร์...', didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'newOrder', studentId: currentUser.studentId || currentUser.name, studentName: currentUser.name, class: currentUser.class, items: itemsStr, spiciness: spiciness, totalPrice: totalPrice, paymentMethod: paymentMethod, cartRaw: cart }) });
        const data = await res.json();
        if (data.status === 'success') {
          cart = {}; updateCartBar(); loadMenuData();
          localStorage.setItem('mala_active_order', data.orderId);
          startQueueTracking(data.orderId);
          
          if (paymentMethod === 'เงินโอน') showPromptPayQRCode(data.orderId, totalPrice);
          else Swal.fire({ icon: 'success', title: 'สั่งสำเร็จ!', text: `ออเดอร์: ${data.orderId}`, confirmButtonText: 'ดูคิว' }).then(openStatusPage);
        }
      } catch(e) { Swal.fire('Error', 'ไม่สามารถส่งออเดอร์ได้', 'error'); }
    }

    // ฟังก์ชันย่อขนาดรูปภาพสลิปให้เล็กก่อนส่ง (กัน Google Sheet ค้าง)
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = e => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400; // ย่อเหลือ 400px
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.6)); // แปลงเป็น Base64 แบบลดคุณภาพ
        }
      }
    }

    function showPromptPayQRCode(orderId, amount) {
      const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;
      Swal.fire({
        title: 'ชำระเงิน & แนบสลิป',
        html: `
          <div class="flex flex-col items-center">
            <div class="bg-white p-2 rounded-2xl border mb-2"><img src="${qrUrl}" class="w-48 h-48 rounded-xl object-contain"></div>
            <p class="text-2xl font-black text-emerald-600 mb-1">${amount.toLocaleString()} บาท</p>
            <p class="text-xs text-slate-500 font-bold mb-4">ชื่อบัญชี: ${ACCOUNT_NAME}</p>
            <hr class="w-full mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2 w-full text-left">📸 แนบรูปสลิปโอนเงิน:</label>
            <input type="file" id="slipInput" accept="image/*" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
          </div>
        `,
        confirmButtonText: 'บันทึกสลิป ➔', confirmButtonColor: '#f97316', allowOutsideClick: false,
        preConfirm: () => {
          const file = document.getElementById('slipInput').files[0];
          if (!file) { Swal.showValidationMessage('กรุณาแนบรูปสลิปโอนเงิน'); return false; }
          return file;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'กำลังอัปโหลดสลิป...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          compressImage(result.value, async (base64Image) => {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'uploadSlip', orderId: orderId, image: base64Image }) });
            Swal.fire('อัปโหลดสำเร็จ!', 'ส่งข้อมูลให้ร้านเรียบร้อย', 'success').then(openStatusPage);
          });
        }
      });
    }

    function startQueueTracking(orderId) {
      myActiveOrderId = orderId;
      if (statusInterval) clearInterval(statusInterval);
      checkOrderStatus(orderId);
      statusInterval = setInterval(() => checkOrderStatus(orderId), 5000);
    }

    async function checkOrderStatus(orderId) {
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: orderId }) });
        const data = await res.json();
        if (data.found && data.status === 'Ready') {
          clearInterval(statusInterval);
          document.getElementById('adminSound').play().catch(()=>{});
          Swal.fire({ title: '🔔 อาหารเสร็จเรียบร้อย!', html: `<p class="text-3xl font-black text-emerald-600 mb-1">${orderId}</p><p>เชิญรับอาหารที่เคาน์เตอร์ได้เลยครับ!</p>`, icon: 'success', confirmButtonText: 'รับอาหารแล้ว 👍' }).then(() => { localStorage.removeItem('mala_active_order'); myActiveOrderId = null; });
        }
      } catch(e) {}
    }

    // ดีไซน์หน้าต่างเช็กสถานะแบบเส้น (Visual Stepper)
    async function openStatusPage() {
      if (!myActiveOrderId) return Swal.fire('ไม่มีคิว', 'คุณยังไม่มีรายการอาหาร', 'info');
      Swal.fire({ title: 'สถานะคิวของคุณ', didOpen: () => Swal.showLoading() });

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: myActiveOrderId }) });
        const data = await res.json();

        if (data.found) {
          const st = data.status;
          const step1 = true;
          const step2 = (st === 'Cooking' || st === 'Ready' || st === 'Completed');
          const step3 = (st === 'Ready' || st === 'Completed');

          Swal.fire({
            title: `ออเดอร์ ${myActiveOrderId}`,
            html: `
              <div class="mb-4 bg-orange-50 text-orange-600 p-3 rounded-2xl text-center border border-orange-200">
                <p class="text-xs font-bold">จำนวนคิวก่อนหน้า</p>
                <p class="text-3xl font-black">${data.queueAhead} <span class="text-sm font-normal">คิว</span></p>
              </div>

              <!-- Stepper Design (แบบเส้นเชื่อมวงกลม) -->
              <div class="relative ml-4 py-2 mt-4 space-y-6 text-left">
                <!-- เส้นแกนกลาง -->
                <div class="absolute left-4 top-2 bottom-2 w-1 bg-slate-200 -z-10 rounded-full"></div>

                <!-- Step 1: รับออเดอร์ -->
                <div class="flex items-center gap-4 relative">
                  <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold shadow-md z-10 ${step1 ? 'bg-orange-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">1</div>
                  <div>
                    <h4 class="font-bold text-sm ${step1 && !step2 ? 'text-orange-600 text-base' : 'text-slate-700'}">รับออเดอร์แล้ว 📝</h4>
                    <p class="text-[11px] text-slate-500">ทางร้านได้รับรายการอาหารของคุณแล้ว</p>
                  </div>
                </div>

                <!-- Step 2: กำลังทำ -->
                <div class="flex items-center gap-4 relative">
                  <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold shadow-md z-10 ${step2 ? 'bg-orange-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">${step2 ? '2' : ''}</div>
                  <div>
                    <h4 class="font-bold text-sm ${step2 && !step3 ? 'text-orange-600 text-base animate-pulse' : 'text-slate-700'}">กำลังปรุงอาหาร 🍳</h4>
                    <p class="text-[11px] text-slate-500">เชฟกำลังปิ้งหม่าล่าให้คุณ</p>
                  </div>
                </div>

                <!-- Step 3: เสร็จสิ้น -->
                <div class="flex items-center gap-4 relative">
                  <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold shadow-md z-10 ${step3 ? 'bg-emerald-500 text-white ring-4 ring-white' : 'bg-slate-200 text-slate-400 ring-4 ring-white'}">${step3 ? '✓' : ''}</div>
                  <div>
                    <h4 class="font-bold text-sm ${step3 ? 'text-emerald-600 text-base animate-bounce' : 'text-slate-700'}">พร้อมรับอาหาร 🔔</h4>
                    <p class="text-[11px] text-slate-500">มารับอาหารที่เคาน์เตอร์ได้เลย</p>
                  </div>
                </div>
              </div>
            `,
            confirmButtonText: 'ปิดหน้าต่าง',
            confirmButtonColor: '#475569'
          });
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
