<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.25rem !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <!-- Header Nav -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-orange-500 flex items-center justify-center shadow-md shadow-orange-500/20 text-white font-black text-xl">
          🍳
        </div>
        <div>
          <h1 class="text-base font-black text-slate-800 leading-tight">ล่าหมามาแดก</h1>
          <p class="text-xs text-orange-600 font-semibold">สั่งง่าย เสิร์ฟไว สดใหม่ทุกจาน</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto w-full p-4 space-y-6">

    <!-- Section: Customer Info Form -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
        <span>👤</span> ข้อมูลผู้สั่งอาหาร
      </h2>
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-1">ชื่อผู้สั่ง / โต๊ะ / เบอร์โทร *</label>
        <input type="text" id="studentName" placeholder="ระบุชื่อหรือหมายเลขโต๊ะ..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold focus:outline-none focus:border-orange-500">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-1">ระดับความเผ็ด 🌶️</label>
        <select id="spiciness" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:border-orange-500">
          <option value="เผ็ดปกติ">🌶️ เผ็ดปกติ (สูตรเด็ดของร้าน)</option>
          <option value="เผ็ดน้อย">🌱 เผ็ดน้อย</option>
          <option value="เผ็ดมาก">🔥🔥 เผ็ดมาก</option>
          <option value="ไม่เผ็ดเลย">❌ ไม่เผ็ดเลย</option>
        </select>
      </div>
    </div>

    <!-- Section: Menu Grid -->
    <div class="space-y-3">
      <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
        <span>🍜</span> รายการอาหาร
      </h2>
      <div id="menuContainer" class="grid grid-cols-2 gap-3">
        <div class="col-span-2 text-center py-10 text-slate-400 text-xs">กำลังโหลดเมนู...</div>
      </div>
    </div>

  </main>

  <!-- Fixed Bottom Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 z-40 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-[11px] font-bold text-slate-400">ราคารวมทั้งหมด</p>
        <p class="text-lg font-black text-orange-600"><span id="totalPriceDisplay">0</span> ฿</p>
      </div>
      <button onclick="openCheckoutModal()" class="flex-1 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-extrabold text-xs py-3 rounded-xl transition-all shadow-md shadow-orange-500/20 flex items-center justify-center gap-2">
        <span>🛒</span> ดูตะกร้า & ยืนยันสั่ง (<span id="cartCountDisplay">0</span>)
      </button>
    </div>
  </div>

  <!-- Modal: Checkout & Dynamic PromptPay QR -->
  <div id="checkoutModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="font-extrabold text-slate-800 text-sm">สรุปรายการสั่งซื้อ</h3>
        <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold text-xs">✕</button>
      </div>

      <div class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-4">
        <!-- Selected Items -->
        <div id="cartItemsList" class="space-y-2"></div>

        <hr class="border-slate-100">

        <!-- Payment Method -->
        <div class="space-y-2">
          <label class="text-xs font-bold text-slate-700 block">ช่องทางการชำระเงิน</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectPayment('เงินสด')" id="btnPayCash" class="p-3 rounded-xl border border-orange-500 bg-orange-50 text-orange-700 font-bold text-xs flex items-center justify-center gap-2">
              💵 เงินสด
            </button>
            <button type="button" onclick="selectPayment('เงินโอน')" id="btnPayTransfer" class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold text-xs flex items-center justify-center gap-2">
              💳 สแกนโอนเงิน
            </button>
          </div>
        </div>

        <!-- Dynamic Dynamic PromptPay QR Section -->
        <div id="qrSection" class="hidden bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center space-y-3">
          <p class="text-xs font-extrabold text-slate-700">สแกน QR Code พร้อมเพย์เพื่อชำระเงิน</p>
          
          <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm w-fit mx-auto">
            <img id="qrImage" src="" alt="PromptPay QR Code" class="w-48 h-48 object-contain rounded-lg mx-auto">
            <div class="mt-2 pt-2 border-t border-slate-100">
              <p class="text-[11px] font-bold text-slate-400">เบอร์พร้อมเพย์: <span id="promptpayIdDisplay" class="text-slate-800 font-extrabold"></span></p>
              <p class="text-xs font-black text-orange-600 mt-0.5">ยอดชำระ: <span id="qrAmountDisplay">0</span> ฿</p>
            </div>
          </div>
          
          <p class="text-[10px] text-slate-400 font-medium">แสกนผ่านแอปธนาคารใดก็ได้ ระบบใส่ยอดเงินให้อัตโนมัติ</p>
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-2">
        <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-xs py-3 rounded-xl transition-all shadow-md shadow-emerald-500/20">
          🚀 ยืนยันการส่งออเดอร์
        </button>
      </div>

    </div>
  </div>

  <script>
    // ⚠️ ใส่เบอร์โทรศัพท์พร้อมเพย์ หรือ เลขประจำตัวผู้เสียภาษี ที่นี่ (ตัดขีดออก)
    const PROMPTPAY_ID = "1418600121013"; 

    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    
    let menus = [];
    let cart = {};
    let selectedPayment = 'เงินสด';

    window.onload = () => {
      document.getElementById('promptpayIdDisplay').innerText = PROMPTPAY_ID;
      fetchMenus();
    };

    async function fetchMenus() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (data.menus) {
          menus = data.menus;
          renderMenus();
        }
      } catch (e) {
        document.getElementById('menuContainer').innerHTML = `<p class="col-span-2 text-center text-red-500 text-xs">ไม่สามารถโหลดรายการเมนูได้</p>`;
      }
    }

    function renderMenus() {
      const container = document.getElementById('menuContainer');
      if (menus.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-slate-400 text-xs py-8">ไม่มีรายการเมนูในขณะนี้</p>`;
        return;
      }

      container.innerHTML = menus.map(item => {
        const stock = Number(item.stock) || 0;
        const isOutOfStock = stock <= 0;
        const hasImage = item.image && String(item.image).trim() !== '' && item.image !== 'undefined';

        const imageElement = hasImage 
          ? `<img src="${item.image}" alt="${item.name}" class="w-full h-24 object-cover rounded-xl mb-2">`
          : `<div class="w-full h-24 bg-orange-50 rounded-xl mb-2 flex items-center justify-center text-3xl">🍜</div>`;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between ${isOutOfStock ? 'opacity-60' : ''}">
            <div>
              ${imageElement}
              <h3 class="font-bold text-xs text-slate-800 line-clamp-1">${item.name}</h3>
              <p class="text-[11px] font-black text-orange-600 mt-0.5">${item.price} ฿</p>
              <p class="text-[10px] ${isOutOfStock ? 'text-red-500 font-bold' : 'text-slate-400'}">
                ${isOutOfStock ? 'สินค้าหมด' : `คงเหลือ: ${stock}`}
              </p>
            </div>
            
            <button 
              onclick="addToCart('${item.name}', ${item.price}, ${stock})" 
              ${isOutOfStock ? 'disabled' : ''} 
              class="w-full mt-2.5 ${isOutOfStock ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-900 hover:bg-slate-800 text-white active:scale-95'} font-bold text-[11px] py-1.5 rounded-xl transition-all">
              ${isOutOfStock ? 'สินค้าหมด' : '+ เพิ่มลงตะกร้า'}
            </button>
          </div>
        `;
      }).join('');
    }

    function addToCart(name, price, maxStock) {
      const currentQty = cart[name] ? cart[name].qty : 0;
      if (currentQty + 1 > maxStock) {
        Swal.fire({ icon: 'warning', title: 'สินค้าไม่พอ', text: `เหลือสต๊อกเพียง ${maxStock} ชิ้น`, timer: 1500, showConfirmButton: false });
        return;
      }

      if (cart[name]) {
        cart[name].qty++;
      } else {
        cart[name] = { price: price, qty: 1 };
      }
      updateCartDisplay();
    }

    function changeQty(name, delta) {
      if (!cart[name]) return;
      
      const itemData = menus.find(m => m.name === name);
      const maxStock = itemData ? Number(itemData.stock) : 99;

      if (delta > 0 && cart[name].qty + delta > maxStock) {
        Swal.fire({ icon: 'warning', title: 'สินค้าไม่พอ', text: `เหลือสต๊อกเพียง ${maxStock} ชิ้น`, timer: 1500, showConfirmButton: false });
        return;
      }

      cart[name].qty += delta;
      if (cart[name].qty <= 0) delete cart[name];
      
      updateCartDisplay();
      renderCartModalList();
    }

    function updateCartDisplay() {
      let totalQty = 0;
      let totalPrice = 0;

      for (const name in cart) {
        totalQty += cart[name].qty;
        totalPrice += cart[name].price * cart[name].qty;
      }

      document.getElementById('cartCountDisplay').innerText = totalQty;
      document.getElementById('totalPriceDisplay').innerText = totalPrice;
      document.getElementById('qrAmountDisplay').innerText = totalPrice;

      // อัปเดต URL สำหรับเจน QR Code พร้อมเพย์ตามยอดเงินรวม
      if (totalPrice > 0) {
        document.getElementById('qrImage').src = `https://promptpay.io/${PROMPTPAY_ID}/${totalPrice}.png`;
      }
    }

    function openCheckoutModal() {
      if (Object.keys(cart).length === 0) {
        Swal.fire({ icon: 'info', title: 'ตะกร้ายังว่างอยู่', text: 'กรุณาเลือกรายการอาหารก่อนครับ', timer: 1500, showConfirmButton: false });
        return;
      }
      renderCartModalList();
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    function renderCartModalList() {
      const container = document.getElementById('cartItemsList');
      let html = '';

      for (const name in cart) {
        const item = cart[name];
        html += `
          <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
            <div>
              <p class="font-bold text-slate-800">${name}</p>
              <p class="text-orange-600 font-bold">${item.price * item.qty} ฿</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty('${name}', -1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold text-xs shadow-sm">-</button>
              <span class="font-bold text-slate-800 w-4 text-center">${item.qty}</span>
              <button onclick="changeQty('${name}', 1)" class="w-7 h-7 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold text-xs shadow-sm">+</button>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function selectPayment(method) {
      selectedPayment = method;
      const btnCash = document.getElementById('btnPayCash');
      const btnTransfer = document.getElementById('btnPayTransfer');
      const qrSec = document.getElementById('qrSection');

      if (method === 'เงินสด') {
        btnCash.className = "p-3 rounded-xl border border-orange-500 bg-orange-50 text-orange-700 font-bold text-xs flex items-center justify-center gap-2";
        btnTransfer.className = "p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold text-xs flex items-center justify-center gap-2";
        qrSec.classList.add('hidden');
      } else {
        btnTransfer.className = "p-3 rounded-xl border border-orange-500 bg-orange-50 text-orange-700 font-bold text-xs flex items-center justify-center gap-2";
        btnCash.className = "p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 font-bold text-xs flex items-center justify-center gap-2";
        qrSec.classList.remove('hidden');
      }
    }

    async function submitOrder() {
      const studentName = document.getElementById('studentName').value.trim();
      const spiciness = document.getElementById('spiciness').value;

      if (!studentName) {
        Swal.fire('กรุณาระบุชื่อ', 'กรุณากรอกชื่อผู้สั่งหรือหมายเลขโต๊ะก่อนส่งออเดอร์', 'warning');
        return;
      }

      let itemsText = [];
      let totalPrice = 0;
      for (const name in cart) {
        itemsText.push(`${name} x${cart[name].qty}`);
        totalPrice += cart[name].price * cart[name].qty;
      }

      const payload = {
        action: 'createOrder',
        studentName: studentName,
        spiciness: spiciness,
        items: itemsText.join('\n'),
        totalPrice: totalPrice,
        paymentMethod: selectedPayment,
        paymentStatus: selectedPayment === 'เงินสด' ? 'Unpaid' : 'Pending',
        slipImage: ''
      };

      try {
        Swal.fire({ title: 'กำลังส่งออเดอร์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'ส่งออเดอร์เรียบร้อย!',
            text: `รหัสออเดอร์ #${data.orderId || ''}`,
            confirmButtonColor: '#f97316'
          });
          cart = {};
          document.getElementById('studentName').value = '';
          updateCartDisplay();
          closeCheckoutModal();
          fetchMenus();
        } else {
          Swal.fire('เกิดข้อผิดพลาด', data.message || 'ไม่สามารถส่งออเดอร์ได้', 'error');
        }
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'เกิดปัญหาในการเชื่อมต่อกับเซิร์ฟเวอร์', 'error');
      }
    }
  </script>
</body>
</html>
