<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-28 text-slate-800">

  <!-- หน้าจอเปิดเสียง notification -->
  <div id="soundUnlockOverlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center">
      <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 animate-bounce">
        🔔
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-2">ต้อนรับสู่ร้านหม่าล่า!</h2>
      <p class="text-sm text-slate-500 mb-6">กดปุ่มด้านล่างเพื่อเปิดเสียงแจ้งเตือนเมื่ออาหารทำเสร็จพร้อมรับ</p>
      <button onclick="enableCustomerSound()" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all text-lg">
        เข้าสู่หน้าสั่งอาหาร 🌶️
      </button>
    </div>
  </div>

  <!-- Hero Header -->
  <div class="bg-gradient-to-r from-orange-600 via-orange-500 to-red-600 text-white p-6 pt-8 rounded-b-[2.5rem] shadow-xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-4">
        <div>
          <span class="bg-white/20 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-bold">🔥 อร่อยเผ็ดชา</span>
          <h1 class="text-3xl font-black tracking-tight mt-1">ร้านล่าหมามาแดก</h1>
        </div>
        <button onclick="openStatusPage()" class="bg-white text-orange-600 px-4 py-2.5 rounded-2xl font-extrabold text-xs shadow-md active:scale-95 transition-all flex items-center gap-1.5 relative">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
          </span>
          📊 สถานะคิวอาหาร
        </button>
      </div>
      
      <!-- ข้อมูลผู้สั่ง -->
      <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20 flex justify-between items-center text-sm">
        <div id="studentInfoDisplay" class="font-semibold text-white/90">
          👤 ยังไม่ได้ระบุชื่อผู้สั่ง
        </div>
        <button onclick="promptStudentSearch()" class="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all">
          ระบุตัวตน
        </button>
      </div>
    </div>
  </div>

  <!-- หมวดหมู่สินค้า -->
  <div class="max-w-md mx-auto px-4 mt-6">
    <div id="categoryTabs" class="flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div>
  </div>

  <!-- รายการอาหาร -->
  <div class="max-w-md mx-auto px-4 mt-4">
    <div id="menuGrid" class="grid grid-cols-2 gap-4"></div>
  </div>

  <!-- แถบตะกร้าสินค้าด้านล่าง (Floating Cart) -->
  <div id="floatingCart" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white rounded-3xl p-4 shadow-2xl border border-slate-700/50 flex justify-between items-center transition-all duration-300 translate-y-32">
    <div>
      <p class="text-xs text-slate-400 font-bold">ยอดรวมทั้งหมด</p>
      <p id="cartTotalPrice" class="text-2xl font-black text-emerald-400">0 ฿</p>
    </div>
    <button onclick="openCheckoutModal()" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all flex items-center gap-2">
      🛒 สั่งซื้อเลย (<span id="cartTotalQty">0</span>)
    </button>
  </div>

  <!-- เสียงแจ้งเตือน -->
  <audio id="adminSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    const PROMPTPAY_NUMBER = "1418600121013"; // 👈 ใส่เบอร์โทรหรือเลขบัตรประชาชน PromptPay ที่นี่

    let menus = [];
    let cart = {};
    let currentUser = null;
    let activeCategory = 'ทั้งหมด';
    let myActiveOrderId = localStorage.getItem('mala_active_order') || null;
    let statusInterval = null;

    function enableCustomerSound() {
      document.getElementById('soundUnlockOverlay').classList.add('hidden');
      const sound = document.getElementById('adminSound');
      sound.play().then(() => { sound.pause(); sound.currentTime = 0; }).catch(() => {});
      init();
    }

    async function init() {
      await loadMenuData();
      if (myActiveOrderId) startQueueTracking(myActiveOrderId);
    }

    async function loadMenuData() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        menus = data.menus;
        renderCategories();
        renderMenu();
      } catch (e) {
        console.error("Load menu failed", e);
      }
    }

    function renderCategories() {
      const cats = ['ทั้งหมด', ...new Set(menus.map(m => m.category))];
      const container = document.getElementById('categoryTabs');
      container.innerHTML = cats.map(c => `
        <button onclick="setCategory('${c}')" class="px-5 py-2.5 rounded-2xl font-extrabold text-xs whitespace-nowrap transition-all ${activeCategory === c ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' : 'bg-white text-slate-600 border border-slate-200'}">
          ${c}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      const filtered = activeCategory === 'ทั้งหมด' ? menus : menus.filter(m => m.category === activeCategory);
      
      grid.innerHTML = filtered.map(m => {
        const qty = cart[m.name]?.qty || 0;
        const isOutOfStock = m.stock <= 0;
        const defaultImg = "https://images.unsplash.com/photo-1555126634-323283e090fa?w=500&q=80";

        return `
          <div class="bg-white rounded-3xl p-3 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between relative overflow-hidden">
            ${isOutOfStock ? '<div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px] z-10 flex items-center justify-center font-black text-white text-sm">หมดแล้ว 😭</div>' : ''}
            <div>
              <div class="w-full h-32 rounded-2xl overflow-hidden bg-slate-100 mb-3 relative">
                <img src="${m.image || defaultImg}" class="w-full h-full object-cover">
                <span class="absolute top-2 right-2 bg-slate-900/70 backdrop-blur-md text-white font-black text-[11px] px-2.5 py-1 rounded-xl">
                  ${m.price} ฿
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">${m.name}</h3>
              <p class="text-[10px] text-slate-400 font-semibold mb-3">คงเหลือ: ${m.stock} ชิ้น</p>
            </div>
            
            <div class="flex items-center justify-between bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
              <button onclick="changeQty('${m.name}', -1)" class="w-8 h-8 rounded-xl bg-white shadow-sm font-black text-slate-600 active:scale-95 transition-all">-</button>
              <span class="font-black text-sm text-slate-800">${qty}</span>
              <button onclick="changeQty('${m.name}', 1)" ${isOutOfStock ? 'disabled' : ''} class="w-8 h-8 rounded-xl bg-orange-500 text-white shadow-sm font-black active:scale-95 transition-all">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(name, delta) {
      const item = menus.find(m => m.name === name);
      if (!item) return;

      if (!cart[name]) cart[name] = { price: item.price, qty: 0 };
      cart[name].qty += delta;

      if (cart[name].qty > item.stock) {
        cart[name].qty = item.stock;
        Swal.fire({ title: 'สต๊อกไม่พอ!', text: `เหลือเพียง ${item.stock} ชิ้น`, icon: 'warning', timer: 1500, showConfirmButton: false });
      }

      if (cart[name].qty <= 0) delete cart[name];
      
      renderMenu();
      updateCartBar();
    }

    function updateCartBar() {
      const bar = document.getElementById('floatingCart');
      let totalQty = 0;
      let totalPrice = 0;

      Object.values(cart).forEach(i => {
        totalQty += i.qty;
        totalPrice += (i.qty * i.price);
      });

      document.getElementById('cartTotalQty').innerText = totalQty;
      document.getElementById('cartTotalPrice').innerText = totalPrice.toLocaleString() + ' ฿';

      if (totalQty > 0) {
        bar.classList.remove('translate-y-32');
      } else {
        bar.classList.add('translate-y-32');
      }
    }

    async function promptStudentSearch() {
      const { value: query } = await Swal.fire({
        title: 'ระบุตัวตนผู้สั่ง',
        input: 'text',
        inputPlaceholder: 'กรอกรหัส หรือ ชื่อนักเรียน...',
        showCancelButton: true,
        confirmButtonText: 'ค้นหา 🔍',
        cancelButtonText: 'ยกเลิก'
      });

      if (query) {
        Swal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'searchStudent', studentId: query })
          });
          const data = await res.json();
          if (data.found) {
            currentUser = data;
            document.getElementById('studentInfoDisplay').innerHTML = `👤 <b>${data.name}</b> (${data.class})`;
            Swal.fire({ icon: 'success', title: 'พบข้อมูลแล้ว!', text: `${data.name} ห้อง ${data.class}`, timer: 1500, showConfirmButton: false });
          } else {
            Swal.fire('ไม่พบข้อมูล!', 'กรุณาตรวจสอบรหัสหรือชื่ออีกครั้ง', 'error');
          }
        } catch(e) { Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบได้', 'error'); }
      }
    }

    async function openCheckoutModal() {
      if (!currentUser) {
        await promptStudentSearch();
        if (!currentUser) return;
      }

      const itemsStr = Object.entries(cart).map(([k, v]) => `${k} x${v.qty}`).join(', ');
      let totalPrice = Object.values(cart).reduce((a, b) => a + (b.qty * b.price), 0);

      const { value: formValues } = await Swal.fire({
        title: 'ยืนยันรายการสั่งซื้อ',
        html: `
          <div class="text-left text-sm space-y-3 mb-4">
            <p class="bg-orange-50 p-3 rounded-xl border border-orange-100"><b>ผู้สั่ง:</b> ${currentUser.name} (${currentUser.class})</p>
            <p class="bg-slate-50 p-3 rounded-xl border border-slate-100"><b>รายการ:</b> ${itemsStr}</p>
            <p class="text-xl font-black text-emerald-600 text-right">ยอดรวม: ${totalPrice} ฿</p>
            <hr>
            <label class="font-bold block mb-1">🌶️ ระดับความเผ็ด:</label>
            <select id="swal-spiciness" class="w-full p-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-orange-500">
              <option value="เผ็ดน้อย">เผ็ดน้อย 🌶️</option>
              <option value="เผ็ดกลาง" selected>เผ็ดกลาง 🌶️🌶️</option>
              <option value="เผ็ดมาก">เผ็ดมาก 🌶️🌶️🌶️</option>
            </select>
            <label class="font-bold block mb-1">💳 การชำระเงิน:</label>
            <select id="swal-payment" class="w-full p-3 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-orange-500">
              <option value="เงินโอน">เงินโอน (สแกน QR PromptPay)</option>
              <option value="เงินสด">เงินสดหน้าเคาน์เตอร์</option>
            </select>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: '🚀 ดำเนินการสั่งซื้อ',
        cancelButtonText: 'แก้ไขรายการ',
        preConfirm: () => {
          return {
            spiciness: document.getElementById('swal-spiciness').value,
            paymentMethod: document.getElementById('swal-payment').value
          }
        }
      });

      if (formValues) {
        sendOrder(itemsStr, totalPrice, formValues.spiciness, formValues.paymentMethod);
      }
    }

    async function sendOrder(itemsStr, totalPrice, spiciness, paymentMethod) {
      Swal.fire({ title: 'กำลังบันทึกออเดอร์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const payload = {
          action: 'newOrder',
          studentId: currentUser.studentId || currentUser.name,
          studentName: currentUser.name,
          class: currentUser.class,
          items: itemsStr,
          spiciness: spiciness,
          totalPrice: totalPrice,
          paymentMethod: paymentMethod,
          cartRaw: cart
        };

        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();

        if (data.status === 'success') {
          cart = {};
          updateCartBar();
          loadMenuData();
          localStorage.setItem('mala_active_order', data.orderId);
          startQueueTracking(data.orderId);
          
          if (paymentMethod === 'เงินโอน') {
            showPromptPayQRCode(data.orderId, totalPrice);
          } else {
            Swal.fire({
              icon: 'success',
              title: 'สั่งอาหารสำเร็จ!',
              html: `หมายเลขออเดอร์ของคุณคือ <b class="text-2xl text-orange-500">${data.orderId}</b><br><span class="text-sm text-slate-500">กรุณาเตรียมเงินสดชำระที่เคาน์เตอร์</span>`,
              confirmButtonText: 'ติดตามสถานะคิว 📊'
            }).then(() => openStatusPage());
          }
        }
      } catch(e) { Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถส่งออเดอร์ได้', 'error'); }
    }

    // แสดงคิวอาร์โค้ดพร้อมเพย์สแกนจ่าย
    function showPromptPayQRCode(orderId, amount) {
      const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;

      Swal.fire({
        title: 'สแกน QR Code ชำระเงิน',
        html: `
          <div class="flex flex-col items-center">
            <p class="text-xs text-slate-500 mb-2">ออเดอร์หมายเลข: <b>${orderId}</b></p>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-md mb-3">
              <img src="${qrUrl}" class="w-56 h-56 rounded-xl object-contain" alt="PromptPay QR">
            </div>
            <p class="text-2xl font-black text-emerald-600 mb-1">${amount.toLocaleString()} บาท</p>
            <p class="text-xs text-slate-400">ชื่อบัญชี: ร้านหม่าล่าซ่าฮาเฮ (${PROMPTPAY_NUMBER})</p>
          </div>
        `,
        confirmButtonText: 'ชำระเงินเรียบร้อย / ไปหน้าคิว ➔',
        confirmButtonColor: '#f97316',
        allowOutsideClick: false
      }).then(() => {
        openStatusPage();
      });
    }

    // เริ่มระบบเช็กสถานะอัตโนมัติ
    function startQueueTracking(orderId) {
      myActiveOrderId = orderId;
      if (statusInterval) clearInterval(statusInterval);
      
      checkOrderStatus(orderId);
      statusInterval = setInterval(() => checkOrderStatus(orderId), 5000);
    }

    async function checkOrderStatus(orderId) {
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: orderId }) });
        const data = await res.json();

        if (data.found && data.status === 'Ready') {
          clearInterval(statusInterval);
          // เสียงแจ้งเตือน
          document.getElementById('adminSound').play().catch(e => console.log(e));
          
          Swal.fire({
            title: '🔔 อาหารเสร็จเรียบร้อย!',
            html: `<div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                     <p class="text-3xl font-black text-emerald-600 mb-1">${orderId}</p>
                     <p class="text-sm font-bold text-slate-700">เชิญรับอาหารรสเด็ดที่เคาน์เตอร์ได้เลยครับ!</p>
                   </div>`,
            icon: 'success',
            confirmButtonText: 'รับอาหารแล้ว 👍',
            confirmButtonColor: '#10b981'
          }).then(() => {
            localStorage.removeItem('mala_active_order');
            myActiveOrderId = null;
          });
        }
      } catch(e) {}
    }

    // หน้าแสดงสถานะคิวแบบ Visual Stepper
    async function openStatusPage() {
      if (!myActiveOrderId) {
        return Swal.fire('ไม่มีคิวอาหาร', 'คุณยังไม่มีรายการอาหารที่กำลังรอดำเนินการ', 'info');
      }

      Swal.fire({ title: 'กำลังโหลดสถานะคิว...', didOpen: () => Swal.showLoading() });

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'checkStatus', orderId: myActiveOrderId }) });
        const data = await res.json();

        if (data.found) {
          const st = data.status; // Pending, Cooking, Ready, Completed
          const isPending = st === 'Pending' || st === 'Waiting Transfer';
          const isCooking = st === 'Cooking';
          const isReady = st === 'Ready';

          Swal.fire({
            title: `ออเดอร์ ${myActiveOrderId}`,
            html: `
              <div class="text-left space-y-5 my-2">
                <!-- แถบจำนวนคิวก่อนหน้า -->
                <div class="bg-gradient-to-r from-orange-500 to-red-500 text-white p-4 rounded-2xl text-center shadow-lg shadow-orange-500/20">
                  <p class="text-xs font-bold text-orange-100">จำนวนคิวก่อนหน้าคุณ</p>
                  <p class="text-4xl font-black mt-1">${data.queueAhead} <span class="text-lg font-normal">คิว</span></p>
                </div>

                <!-- Stepper แสดงลำดับสถานะ -->
                <div class="space-y-4 pt-2">
                  <!-- Step 1 -->
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold ${isPending ? 'bg-orange-500 text-white animate-pulse' : (isCooking || isReady ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-400')}">
                      ${isCooking || isReady ? '✓' : '1'}
                    </div>
                    <div>
                      <p class="font-bold text-sm ${isPending ? 'text-orange-600' : 'text-slate-800'}">รับออเดอร์แล้ว 📝</p>
                      <p class="text-xs text-slate-400">เข้าสู่ระบบคิวเรียบร้อย</p>
                    </div>
                  </div>

                  <!-- Step 2 -->
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold ${isCooking ? 'bg-orange-500 text-white animate-pulse' : (isReady ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-400')}">
                      ${isReady ? '✓' : '2'}
                    </div>
                    <div>
                      <p class="font-bold text-sm ${isCooking ? 'text-orange-600' : 'text-slate-800'}">กำลังปรุงอาหาร 🍳</p>
                      <p class="text-xs text-slate-400">เชฟกำลังปิ้งหม่าล่าให้คุณ</p>
                    </div>
                  </div>

                  <!-- Step 3 -->
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold ${isReady ? 'bg-emerald-500 text-white animate-bounce' : 'bg-slate-200 text-slate-400'}">
                      3
                    </div>
                    <div>
                      <p class="font-bold text-sm ${isReady ? 'text-emerald-600' : 'text-slate-800'}">พร้อมรับอาหาร 🔔</p>
                      <p class="text-xs text-slate-400">อาหารพร้อมส่งมอบที่เคาน์เตอร์</p>
                    </div>
                  </div>
                </div>
              </div>
            `,
            confirmButtonText: 'ปิดหน้าต่าง',
            confirmButtonColor: '#475569'
          });
        } else {
          Swal.fire('ไม่พบออเดอร์', 'ออเดอร์อาจถูกยกเลิกหรือเสร็จสิ้นแล้ว', 'warning');
        }
      } catch(e) { Swal.fire('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลสถานะได้', 'error'); }
    }
  </script>
