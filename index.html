<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ติดตามคิวหมาล่า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- เพิ่ม SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    /* ปรับแต่งฟอนต์ให้ SweetAlert */
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
  </style>
</head>
<body class="pb-28 max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl relative">

  <!-- Header -->
  <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 text-white p-4 sticky top-0 z-50 shadow-lg rounded-b-3xl">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-2xl">🌶️</span>
      <h1 class="text-lg font-black tracking-wide">ระบบสั่งหมาล่า & ติดตามคิว</h1>
    </div>
    <div class="flex bg-black/15 p-1 rounded-2xl border border-white/20">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all">📋 เมนูอาหาร</button>
      <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all">⏳ คิวของฉัน</button>
    </div>
  </div>

  <!-- Tab: เมนูอาหาร -->
  <div id="view-menu" class="p-4 space-y-4">
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
      <label class="text-xs font-bold text-slate-500 mb-1.5 block">👤 รหัสนักเรียน</label>
      <div class="flex gap-2">
        <input type="number" id="student-id" placeholder="กรอกรหัสนักเรียน..." class="flex-1 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-orange-500 text-sm">
        <button onclick="searchStudent()" id="btn-search-student" class="bg-slate-900 text-white px-5 rounded-xl font-bold text-xs shadow-md">ค้นหา</button>
      </div>
      <div id="student-info" class="hidden mt-3 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-200 text-center shadow-sm"></div>
    </div>

    <!-- เมนูอาหาร -->
    <div id="menu-container" class="space-y-3">
      <p class="text-center py-10 text-slate-400 text-sm">กำลังโหลดเมนู...</p>
    </div>
  </div>

  <!-- Tab: คิวของฉัน -->
  <div id="view-queue" class="hidden p-4 space-y-4">
    <div id="my-queue-card" class="bg-white border border-slate-200/80 rounded-3xl p-6 text-center shadow-sm">
      <p class="text-slate-400 text-sm">ยังไม่มีรายการสั่งซื้อ</p>
    </div>
  </div>

  <!-- ตะกร้าสินค้า -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200/80 p-5 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.12)] z-50 transform translate-y-full transition-transform duration-300">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-extrabold text-slate-800 text-base">🛒 สรุปรายการสั่งซื้อ</h3>
      <button onclick="toggleCart()" class="text-slate-400 font-bold text-xs bg-slate-100 px-3 py-1.5 rounded-full">ปิด 🔽</button>
    </div>
    
    <div id="cart-items-list" class="max-h-36 overflow-y-auto hide-scrollbar mb-3 divide-y divide-slate-100 border-b border-slate-100 pb-2 text-xs"></div>

    <label class="text-xs font-bold text-slate-500 mb-1.5 block">🌶️ ระดับความเผ็ด</label>
    <div class="flex gap-2 mb-3">
      <button onclick="setSpice('ไม่เผ็ด')" id="sp-ไม่เผ็ด" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">ไม่เผ็ด</button>
      <button onclick="setSpice('เผ็ดกลาง')" id="sp-เผ็ดกลาง" class="flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold">เผ็ดกลาง</button>
      <button onclick="setSpice('เผ็ดมาก')" id="sp-เผ็ดมาก" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">เผ็ดมาก</button>
    </div>

    <label class="text-xs font-bold text-red-500 mb-1.5 block">* กรุณาเลือกวิธีชำระเงิน</label>
    <div class="flex gap-2 mb-4">
      <button onclick="setPayment('เงินโอน')" id="pay-เงินโอน" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200">💳 เงินโอน</button>
      <button onclick="setPayment('เงินสด')" id="pay-เงินสด" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200">💵 เงินสด</button>
    </div>

    <button id="btn-submit" onclick="submitOrder()" class="w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl" disabled>
      ยืนยันสั่งอาหาร <span id="cart-total" class="ml-2">0 ฿</span>
    </button>
  </div>

  <button onclick="toggleCart()" id="fab-cart" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white p-4 rounded-full shadow-2xl shadow-slate-900/40 z-40">
    🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-white">0</span>
  </button>

  <canvas id="qr-canvas" class="hidden"></canvas>

  <script>
    // ⚠️ นำ URL จาก Deploy Web App ใน Google Apps Script มาวางตรงนี้
    const GAS_URL = " https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; 
    const PROMPTPAY_NUMBER = "1418600121013"; // <-- เบอร์พร้อมเพย์ของคุณ
    
    let cart = {}; 
    let spiciness = 'เผ็ดกลาง'; 
    let paymentMethod = ''; 
    let currentStudent = { id: '', name: '', class: '' };

    // --- 1. โหลดข้อมูลเมนูจาก Apps Script ---
    async function fetchMenu() {
      const container = document.getElementById('menu-container');
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        
        if (!data.menus || data.menus.length === 0) {
          container.innerHTML = `<p class="text-center py-10 text-slate-400 text-sm">ไม่มีรายการเมนูอาหาร</p>`;
          return;
        }

        container.innerHTML = data.menus.map(item => `
          <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-3">
            <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-20 h-20 rounded-xl object-cover bg-slate-100">
            <div class="flex-1">
              <span class="text-[10px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded-md">${item.category}</span>
              <h4 class="font-bold text-slate-800 text-sm mt-0.5">${item.name}</h4>
              <p class="text-xs font-black text-slate-600 mt-1">${item.price} ฿ <span class="text-[10px] font-normal text-slate-400">(คงเหลือ ${item.stock})</span></p>
            </div>
            ${item.stock > 0 ? `
              <div class="flex items-center gap-2">
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, -1)" class="w-7 h-7 bg-slate-100 rounded-lg font-bold text-slate-600 text-sm">-</button>
                <span id="qty-${item.name}" class="font-bold text-xs w-4 text-center">0</span>
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, 1)" class="w-7 h-7 bg-orange-500 text-white rounded-lg font-bold text-sm">+</button>
              </div>
            ` : `<span class="text-xs font-bold text-red-500 bg-red-50 px-2.5 py-1 rounded-lg">หมด</span>`}
          </div>
        `).join('');

        updateCartUI();
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="text-center py-10 text-red-500 text-sm">เกิดข้อผิดพลาดในการโหลดเมนู กรุณาเช็ค GAS_URL</p>`;
      }
    }

    // --- 2. ค้นหานักเรียน ---
    async function searchStudent() {
      const idInput = document.getElementById('student-id').value.trim();
      const infoBox = document.getElementById('student-info');
      const btn = document.getElementById('btn-search-student');

      if (!idInput) {
        return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสนักเรียนก่อนค้นหา', confirmButtonColor: '#f97316' });
      }

      btn.innerText = "⏳...";
      btn.disabled = true;

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchStudent', studentId: idInput }) });
        const result = await res.json();

        if (result.found) {
          currentStudent = { id: idInput, name: result.name, class: result.class };
          infoBox.classList.remove('hidden');
          infoBox.className = "mt-3 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-200 text-center shadow-sm";
          infoBox.innerText = `✅ พบข้อมูล: ${result.name} (ห้อง ${result.class})`;
        } else {
          currentStudent = { id: '', name: '', class: '' };
          infoBox.classList.remove('hidden');
          infoBox.className = "mt-3 p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-200 text-center shadow-sm";
          infoBox.innerText = `❌ ไม่พบข้อมูลนักเรียนรหัสนี้`;
          Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: 'ไม่มีรหัสนักเรียนนี้ในระบบ', confirmButtonColor: '#ef4444' });
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', confirmButtonColor: '#ef4444' });
      } finally {
        btn.innerText = "ค้นหา";
        btn.disabled = false;
        checkSubmitReady();
      }
    }

    // --- 3. จัดการตะกร้าสินค้า ---
    function updateCartItem(name, price, maxStock, change) {
      if (!cart[name]) cart[name] = { price: price, qty: 0 };
      
      let newQty = cart[name].qty + change;
      if (newQty > maxStock) {
        return Swal.fire({ icon: 'warning', title: 'สินค้าไม่พอ', text: 'จำนวนสินค้าเกินสต๊อกที่มี', confirmButtonColor: '#f97316' });
      }
      
      if (newQty <= 0) delete cart[name];
      else cart[name].qty = newQty;
      
      const qtyEl = document.getElementById(`qty-${name}`);
      if (qtyEl) qtyEl.innerText = cart[name] ? cart[name].qty : 0;
      
      updateCartUI();
    }

    function updateCartUI() {
      let totalCount = 0; let totalPrice = 0; let itemsHtml = '';
      for (let name in cart) {
        totalCount += cart[name].qty;
        totalPrice += cart[name].qty * cart[name].price;
        itemsHtml += `
          <div class="flex justify-between items-center py-1">
            <span>${name} x${cart[name].qty}</span>
            <span class="font-bold">${cart[name].qty * cart[name].price} ฿</span>
          </div>
        `;
      }
      document.getElementById('cart-badge').innerText = totalCount;
      document.getElementById('cart-total').innerText = `${totalPrice} ฿`;
      document.getElementById('cart-items-list').innerHTML = itemsHtml || '<p class="text-slate-400 text-center">ยังไม่ได้เลือกรายการอาหาร</p>';
      
      const fabBtn = document.getElementById('fab-cart');
      if (totalCount > 0) fabBtn.classList.remove('hidden');
      else {
        fabBtn.classList.add('hidden');
        document.getElementById('cart-bar').classList.add('translate-y-full');
      }
      checkSubmitReady();
    }

    function checkSubmitReady() {
      const btn = document.getElementById('btn-submit');
      if (Object.keys(cart).length > 0 && currentStudent.id !== '' && paymentMethod !== '') {
        btn.className = "w-full bg-orange-500 text-white font-extrabold text-base py-3.5 rounded-2xl shadow-lg shadow-orange-500/30 cursor-pointer";
        btn.disabled = false;
      } else {
        btn.className = "w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl cursor-not-allowed";
        btn.disabled = true;
      }
    }

    // --- 4. ส่งคำสั่งซื้อ ---
    async function submitOrder() {
      if (!currentStudent.id) return Swal.fire('แจ้งเตือน', 'กรุณาค้นหารหัสนักเรียนก่อน', 'warning');
      if (Object.keys(cart).length === 0) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการอาหาร', 'warning');
      if (!paymentMethod) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกวิธีชำระเงิน', 'warning');

      const btn = document.getElementById('btn-submit');
      btn.innerText = "⏳ กำลังส่งออเดอร์...";
      btn.disabled = true;

      const itemsStr = Object.entries(cart).map(([name, item]) => `${name} x${item.qty}`).join(', ');
      let totalPrice = 0;
      for (let name in cart) totalPrice += cart[name].qty * cart[name].price;

      const payload = {
        action: 'newOrder', studentId: currentStudent.id, studentName: currentStudent.name,
        class: currentStudent.class, items: itemsStr, spiciness: spiciness,
        totalPrice: totalPrice, paymentMethod: paymentMethod, cartRaw: cart
      };

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();

        if (result.status === 'success') {
          const orderData = { orderId: result.orderId, items: cart, spiciness: spiciness, paymentMethod: paymentMethod, totalPrice: totalPrice, status: paymentMethod === 'เงินสด' ? 'Pending' : 'Waiting Transfer' };
          localStorage.setItem('my_order_details', JSON.stringify(orderData));

          // SweetAlert แจ้งเตือนสั่งซื้อสำเร็จ (พร้อมโชว์ QR หากเลือกเงินโอน)
          if (paymentMethod === 'เงินโอน') {
            Swal.fire({
              title: 'สั่งอาหารสำเร็จ!',
              html: `กรุณาสแกน QR Code ด้านล่างเพื่อชำระเงิน<br><span class="text-xl font-bold text-orange-600 mt-2 block">ยอดรวม: ${totalPrice} ฿</span>`,
              imageUrl: `https://promptpay.io/${PROMPTPAY_NUMBER}/${totalPrice}.png`,
              imageWidth: 250,
              imageHeight: 250,
              imageAlt: 'PromptPay QR',
              confirmButtonText: 'บันทึกสลิปเรียบร้อยแล้ว',
              confirmButtonColor: '#f97316',
              allowOutsideClick: false
            }).then(() => {
              finishOrderUI();
            });
          } else {
            Swal.fire({
              icon: 'success',
              title: 'สั่งอาหารสำเร็จ!',
              text: `หมายเลขออเดอร์ของคุณคือ ${result.orderId} (กรุณาเตรียมเงินสดให้พอดี)`,
              confirmButtonText: 'ดูคิวของฉัน',
              confirmButtonColor: '#f97316'
            }).then(() => {
              finishOrderUI();
            });
          }
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถสั่งซื้อได้ กรุณาลองใหม่อีกครั้ง', confirmButtonColor: '#ef4444' });
      } finally {
        btn.innerText = "ยืนยันสั่งอาหาร";
        btn.disabled = false;
      }
    }

    function finishOrderUI() {
      cart = {};
      paymentMethod = '';
      setPayment('');
      updateCartUI();
      switchTab('queue');
      fetchMenu();
    }

    // --- 5. แสดงผลคิวของฉัน ---
    function renderMyQueue() {
      const queueCard = document.getElementById('my-queue-card');
      const savedOrder = JSON.parse(localStorage.getItem('my_order_details'));

      if (!savedOrder) {
        queueCard.innerHTML = `<p class="text-slate-400 text-sm py-4">ยังไม่มีรายการสั่งซื้อ</p>`;
        return;
      }

      let itemsListHtml = '';
      if (savedOrder.items) {
        for (let itemName in savedOrder.items) {
          const item = savedOrder.items[itemName];
          itemsListHtml += `
            <div class="flex justify-between text-xs text-slate-600 mb-1">
              <span>- ${itemName} (x${item.qty})</span>
              <span>${item.price * item.qty} ฿</span>
            </div>
          `;
        }
      }

      // แสดง QR Code เล็กๆ ในหน้าคิวด้วย หากยังเป็น Waiting Transfer
      let qrHtml = '';
      if (savedOrder.paymentMethod === 'เงินโอน' && savedOrder.status === 'Waiting Transfer') {
        qrHtml = `
          <div class="mt-4 border-t border-orange-200 pt-3 text-center">
            <p class="text-xs font-bold text-red-500 mb-2">สแกนชำระเงินที่นี่ 👇</p>
            <img src="https://promptpay.io/${PROMPTPAY_NUMBER}/${savedOrder.totalPrice}.png" class="w-32 h-32 mx-auto rounded-lg shadow-sm border border-slate-200">
          </div>
        `;
      }

      queueCard.innerHTML = `
        <div class="bg-orange-50 border-2 border-orange-100 rounded-2xl p-4 text-left">
          <div class="flex justify-between items-center mb-3 border-b border-orange-200 pb-2">
            <h4 class="font-bold text-orange-700">ออเดอร์: <span class="text-xl">${savedOrder.orderId}</span></h4>
            <span class="bg-orange-500 text-white text-[10px] px-2.5 py-1 rounded-full font-bold">${savedOrder.status}</span>
          </div>
          <div class="mb-3">
            <p class="text-xs font-bold text-slate-700 mb-1">รายการอาหารที่คุณสั่ง:</p>
            ${itemsListHtml}
          </div>
          <div class="flex justify-between items-center mt-3 pt-2 border-t border-orange-200">
            <span class="text-xs text-slate-500">เผ็ด: <b class="text-orange-600">${savedOrder.spiciness}</b> | ชำระ: <b>${savedOrder.paymentMethod}</b></span>
            <span class="text-sm font-black text-slate-800">ยอดรวม: ${savedOrder.totalPrice} ฿</span>
          </div>
          ${qrHtml}
        </div>
      `;
    }

    // UI Helper Functions
    function switchTab(tab) {
      document.getElementById('view-menu').classList.toggle('hidden', tab !== 'menu');
      document.getElementById('view-queue').classList.toggle('hidden', tab !== 'queue');
      document.getElementById('tab-menu').className = tab === 'menu' ? "flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all" : "flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all";
      document.getElementById('tab-queue').className = tab === 'queue' ? "flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all" : "flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all";
      if (tab === 'queue') renderMyQueue();
    }

    function toggleCart() { document.getElementById('cart-bar').classList.toggle('translate-y-full'); }

    function setSpice(level) {
      spiciness = level;
      ['ไม่เผ็ด', 'เผ็ดกลาง', 'เผ็ดมาก'].forEach(l => {
        document.getElementById(`sp-${l}`).className = l === level ? "flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold" : "flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500";
      });
    }

    function setPayment(method) {
      paymentMethod = method;
      ['เงินโอน', 'เงินสด'].forEach(m => {
        document.getElementById(`pay-${m}`).className = m === method ? "flex-1 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold text-xs shadow-sm" : "flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200";
      });
      checkSubmitReady();
    }

    // โหลดเมนูตอนเข้าเว็บ
    window.onload = () => { fetchMenu(); };
  </script>
</body>
</html>
