<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALA — สั่งอาหารออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-28">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-card border-b border-slate-800">
    <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl gold-gradient flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
          🔥
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-wide gold-text">ล่าหมามาแดก</h1>
          <p class="text-[11px] text-slate-400 font-light">Fine Dining Experience</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full px-4 pt-5 space-y-5">
    
    <!-- Table / Name Info -->
    <div class="glass-card p-4 rounded-3xl space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
        <span>👤</span> ข้อมูลผู้สั่งอาหาร
      </h2>
      <div>
        <input type="text" id="studentName" placeholder="ระบุชื่อผู้สั่ง / เลขโต๊ะอาหาร..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all">
      </div>
      <div>
        <select id="spiciness" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 transition-all">
          <option value="เผ็ดปกติ"> เผ็ดปกติ </option>
          <option value="เผ็ดน้อย"> เผ็ดน้อย </option>
          <option value="เผ็ดมาก">เผ็ดมาก </option>
          <option value="ไม่เผ็ด"> ไม่เผ็ด</option>
        </select>
      </div>
    </div>

    <!-- Menu List -->
    <div class="space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
        <span>🍽️</span> รายการอาหารแนะนำ
      </h2>
      <div id="menuContainer" class="grid grid-cols-2 gap-3.5">
        <div class="col-span-2 text-center py-12 text-slate-500 text-xs">กำลังโหลดเมนูอาหาร...</div>
      </div>
    </div>

  </main>

  <!-- Bottom Checkout Bar -->
  <div class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-800 p-4 z-40">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-[10px] text-slate-400 uppercase tracking-wider">ราคารวมทั้งหมด</p>
        <p class="text-xl font-black text-amber-400"><span id="totalPriceDisplay">0</span> <span class="text-xs">฿</span></p>
      </div>
      <button onclick="openCheckoutModal()" class="flex-1 gold-gradient hover:opacity-95 active:scale-95 text-slate-950 font-black text-xs py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
        <span>🛒</span> ดูตะกร้า (<span id="cartCountDisplay">0</span>)
      </button>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div id="checkoutModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-800 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-extrabold text-slate-100 text-sm">สรุปรายการสั่งซื้อ</h3>
        <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white font-bold text-xs">✕</button>
      </div>
      
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        <div id="cartItemsList" class="space-y-2"></div>
        
        <div class="space-y-2 pt-2">
          <label class="text-xs font-bold text-slate-400">วิธีชำระเงิน</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectPayment('เงินสด')" id="btnCash" class="p-3 rounded-2xl border border-amber-500 bg-amber-500/10 text-amber-400 font-bold text-xs">💵 เงินสด</button>
            <button type="button" onclick="selectPayment('เงินโอน')" id="btnTransfer" class="p-3 rounded-2xl border border-slate-800 bg-slate-800 text-slate-400 font-bold text-xs">💳 โอนเงิน (PromptPay)</button>
          </div>
        </div>

        <div id="qrSection" class="hidden bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center space-y-3">
          <p class="text-xs font-bold text-amber-400">สแกน QR Code เพื่อชำระเงิน</p>
          <div class="bg-white p-3 rounded-xl w-48 h-48 mx-auto flex items-center justify-center">
            <img id="qrImage" src="" alt="PromptPay QR" class="w-full h-full object-contain">
          </div>
          <p class="text-xs text-slate-400">เบอร์พร้อมเพย์: <b class="text-slate-200" id="ppId">0812345678</b></p>
        </div>
      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-900/50">
        <button onclick="submitOrder()" class="w-full gold-gradient text-slate-950 font-black text-xs py-3.5 rounded-2xl active:scale-95 transition-all shadow-lg shadow-amber-500/20">
          ✨ ยืนยันการสั่งซื้อ
        </button>
      </div>
    </div>
  </div>

  <script>
    const PROMPTPAY_ID = "1418600121013"; // ⚠️ เปลี่ยนเป็นเบอร์พร้อมเพย์ของคุณ
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; 

    let menus = [];
    let cart = {};
    let selectedPayment = 'เงินสด';

    window.onload = () => {
      document.getElementById('ppId').innerText = PROMPTPAY_ID;
      fetchMenus();
    };

    async function fetchMenus() {
      try {
        const res = await fetch(GAS_URL + "?action=getMenus");
        const data = await res.json();
        if (data.menus) {
          menus = data.menus;
          renderMenus();
        }
      } catch (e) {
        document.getElementById('menuContainer').innerHTML = `<p class="col-span-2 text-center text-red-400 text-xs">เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ</p>`;
      }
    }

    function renderMenus() {
      const container = document.getElementById('menuContainer');
      if (!menus.length) {
        container.innerHTML = `<p class="col-span-2 text-center text-slate-500 text-xs py-8">ไม่มีรายการอาหาร</p>`;
        return;
      }

      container.innerHTML = menus.map(item => {
        const stock = Number(item.stock) || 0;
        const isOut = stock <= 0;
        const hasImg = item.image && item.image.trim() !== '' && item.image !== 'undefined';
        const imgMarkup = hasImg 
          ? `<img src="${item.image}" class="w-full h-24 object-cover rounded-2xl mb-2">`
          : `<div class="w-full h-24 bg-slate-800 rounded-2xl mb-2 flex items-center justify-center text-3xl">🍲</div>`;

        return `
          <div class="glass-card rounded-3xl p-3 flex flex-col justify-between ${isOut ? 'opacity-40' : ''}">
            <div>
              ${imgMarkup}
              <h3 class="font-bold text-xs text-slate-200 truncate">${item.name}</h3>
              <p class="text-xs font-black text-amber-400 mt-0.5">${item.price} ฿</p>
              <p class="text-[10px] ${isOut ? 'text-red-400 font-bold' : 'text-slate-500'}">${isOut ? 'สินค้าหมด' : 'คงเหลือ: ' + stock}</p>
            </div>
            <button onclick="addToCart('${item.name}', ${item.price}, ${stock})" ${isOut ? 'disabled' : ''} class="w-full mt-3 ${isOut ? 'bg-slate-800 text-slate-600' : 'gold-gradient text-slate-950 active:scale-95'} font-extrabold text-[11px] py-2 rounded-xl transition-all">
              ${isOut ? 'หมด' : '+ เพิ่มลงตะกร้า'}
            </button>
          </div>
        `;
      }).join('');
    }

    function addToCart(name, price, stock) {
      const current = cart[name] ? cart[name].qty : 0;
      if (current + 1 > stock) {
        Swal.fire({ icon: 'warning', title: 'สินค้าไม่พอ', background: '#0f172a', color: '#fff', timer: 1200, showConfirmButton: false });
        return;
      }
      cart[name] = { price, qty: current + 1 };
      updateCartDisplay();
    }

    function updateCartDisplay() {
      let qty = 0, total = 0;
      for (const k in cart) {
        qty += cart[k].qty;
        total += cart[k].price * cart[k].qty;
      }
      document.getElementById('cartCountDisplay').innerText = qty;
      document.getElementById('totalPriceDisplay').innerText = total;
      if (total > 0) {
        document.getElementById('qrImage').src = `https://promptpay.io/${PROMPTPAY_ID}/${total}.png`;
      }
    }

    function openCheckoutModal() {
      if (!Object.keys(cart).length) return;
      renderCartList();
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }

    function renderCartList() {
      let html = '';
      for (const k in cart) {
        html += `
          <div class="flex justify-between items-center bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs">
            <div>
              <p class="font-bold text-slate-200">${k}</p>
              <p class="text-amber-400 font-bold">${cart[k].price * cart[k].qty} ฿</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty('${k}', -1)" class="w-7 h-7 bg-slate-800 text-slate-200 rounded-lg font-bold">-</button>
              <span class="font-bold w-4 text-center text-slate-200">${cart[k].qty}</span>
              <button onclick="changeQty('${k}', 1)" class="w-7 h-7 bg-slate-800 text-slate-200 rounded-lg font-bold">+</button>
            </div>
          </div>
        `;
      }
      document.getElementById('cartItemsList').innerHTML = html;
    }

    function changeQty(name, delta) {
      const item = menus.find(m => m.name === name);
      const stock = item ? item.stock : 99;
      if (delta > 0 && cart[name].qty + delta > stock) return;
      cart[name].qty += delta;
      if (cart[name].qty <= 0) delete cart[name];
      updateCartDisplay();
      renderCartList();
    }

    function selectPayment(m) {
      selectedPayment = m;
      const bC = document.getElementById('btnCash');
      const bT = document.getElementById('btnTransfer');
      const qr = document.getElementById('qrSection');
      if (m === 'เงินสด') {
        bC.className = "p-3 rounded-2xl border border-amber-500 bg-amber-500/10 text-amber-400 font-bold text-xs";
        bT.className = "p-3 rounded-2xl border border-slate-800 bg-slate-800 text-slate-400 font-bold text-xs";
        qr.classList.add('hidden');
      } else {
        bT.className = "p-3 rounded-2xl border border-amber-500 bg-amber-500/10 text-amber-400 font-bold text-xs";
        bC.className = "p-3 rounded-2xl border border-slate-800 bg-slate-800 text-slate-400 font-bold text-xs";
        qr.classList.remove('hidden');
      }
    }

    async function submitOrder() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        Swal.fire({ icon: 'warning', title: 'กรุณาระบุชื่อผู้สั่ง', background: '#0f172a', color: '#fff' });
        return;
      }

      let itemsStr = [], total = 0;
      for (const k in cart) {
        itemsStr.push(`${k} x${cart[k].qty}`);
        total += cart[k].price * cart[k].qty;
      }

      const payload = {
        action: 'createOrder',
        studentName: name,
        spiciness: document.getElementById('spiciness').value,
        items: itemsStr.join('\n'),
        totalPrice: total,
        paymentMethod: selectedPayment,
        paymentStatus: selectedPayment === 'เงินโอน' ? 'Pending' : 'Unpaid'
      };

      Swal.fire({ title: 'กำลังส่งออเดอร์...', allowOutsideClick: false, background: '#0f172a', color: '#fff', didOpen: () => Swal.showLoading() });

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.status === 'success') {
          Swal.fire({ icon: 'success', title: 'สั่งอาหารสำเร็จ!', text: `รหัสสั่งซื้อ #${data.orderId}`, background: '#0f172a', color: '#fff' });
          cart = {};
          document.getElementById('studentName').value = '';
          updateCartDisplay();
          closeCheckoutModal();
          fetchMenus();
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'กรุณาลองใหม่อีกครั้ง', background: '#0f172a', color: '#fff' });
      }
    }
  </script>
</body>
</html>
