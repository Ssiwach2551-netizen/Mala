<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ติดตามคิวหมาล่า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- เพิ่ม Library jsQR สำหรับสแกนสลิปบนเว็บ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-28 max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl relative">

  <!-- Header -->
  <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 text-white p-4 sticky top-0 z-50 shadow-lg rounded-b-3xl">
    <div class="flex items-center justify-center gap-2 mb-2">
      <span class="text-2xl">🌶️</span>
      <h1 class="text-lg font-black tracking-wide">ระบบสั่งหมาล่า & ติดตามคิว</h1>
    </div>
    <div class="flex bg-black/15 p-1 rounded-2xl border border-white/20">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all">📋 เมนูอาหาร</button>
      <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all">⏳ คิวของฉัน</button>
    </div>
  </div>

  <!-- Tab: เมนูอาหาร -->
  <div id="view-menu" class="p-4 space-y-4">
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
      <label class="text-xs font-bold text-slate-500 mb-1.5 block">👤 รหัสนักเรียน</label>
      <div class="flex gap-2">
        <input type="number" id="student-id" placeholder="กรอกรหัสนักเรียน..." class="flex-1 p-2.5 rounded-xl border border-slate-200 outline-none focus:border-orange-500 text-sm">
        <button onclick="searchStudent()" class="bg-slate-900 text-white px-5 rounded-xl font-bold text-xs shadow-md">ค้นหา</button>
      </div>
      <div id="student-info" class="hidden mt-3 p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold border border-emerald-200 text-center shadow-sm"></div>
    </div>
    <div id="menu-container" class="space-y-3"><p class="text-center py-10 text-slate-400 text-sm">กำลังโหลดเมนู...</p></div>
  </div>

  <!-- Tab: คิวของฉัน -->
  <div id="view-queue" class="hidden p-4 space-y-4">
    <div id="my-queue-card" class="bg-white border border-slate-200/80 rounded-3xl p-6 text-center shadow-sm">
      <p class="text-slate-400 text-sm">ยังไม่มีรายการสั่งซื้อ</p>
    </div>
    <div class="pt-2">
      <h3 class="font-bold text-slate-700 text-sm mb-3">คิวที่กำลังรอดำเนินการ</h3>
      <div id="active-queue" class="space-y-2"></div>
    </div>
  </div>

  <!-- ตะกร้าสินค้า -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200/80 p-5 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.12)] z-50 transform translate-y-full transition-transform duration-300">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-extrabold text-slate-800 text-base">🛒 สรุปรายการสั่งซื้อ</h3>
      <button onclick="toggleCart()" class="text-slate-400 font-bold text-xs bg-slate-100 px-3 py-1.5 rounded-full">ปิด 🔽</button>
    </div>
    <label class="text-xs font-bold text-slate-500 mb-1.5 block">🌶️ ระดับความเผ็ด</label>
    <div class="flex gap-2 mb-4">
      <button onclick="setSpice('ไม่เผ็ด')" id="sp-ไม่เผ็ด" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">ไม่เผ็ด</button>
      <button onclick="setSpice('เผ็ดกลาง')" id="sp-เผ็ดกลาง" class="flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold">เผ็ดกลาง</button>
      <button onclick="setSpice('เผ็ดมาก')" id="sp-เผ็ดมาก" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">เผ็ดมาก</button>
    </div>
    <label class="text-xs font-bold text-red-500 mb-1.5 block">* กรุณาเลือกวิธีชำระเงิน</label>
    <div class="flex gap-2 mb-5">
      <button onclick="setPayment('เงินโอน')" id="pay-เงินโอน" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200">💳 เงินโอน</button>
      <button onclick="setPayment('เงินสด')" id="pay-เงินสด" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200">💵 เงินสด</button>
    </div>
    <button id="btn-submit" onclick="submitOrder()" class="w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl" disabled>
      ยืนยันสั่งอาหาร <span id="cart-total" class="ml-2">0 ฿</span>
    </button>
  </div>

  <button onclick="toggleCart()" id="fab-cart" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white p-4 rounded-full shadow-2xl shadow-slate-900/40 z-40">
    🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-white">0</span>
  </button>

  <!-- ซ่อน Canvas ไว้สำหรับประมวลผลรูปภาพ (ห้ามลบ) -->
  <canvas id="qr-canvas" class="hidden"></canvas>

  <script>
    const GAS_URL = "เปลี่ยน_เป็น_URL_ของคุนที่นี่_นะคัรบ"; 
    const PROMPTPAY_NUMBER = "1418600121013"; 
    const EXPIRE_MINUTES = 10; 
    
    // ตั้งค่าตัวแปรจำลองข้อมูลตะกร้าเริ่มต้น (เพื่อให้พอกดทดสอบได้)
    let cart = {}; 
    let spiciness = 'เผ็ดกลาง'; 
    let paymentMethod = ''; 
    let studentInfo = { id: '', name: '', class: '' };
    let myOrderInfo = { id: localStorage.getItem('my_order'), status: '', timestamp: 0 };
    let pollInterval; let qrTimerInterval; 

    // --- ส่วนการค้นหานักเรียน (ฟังก์ชันจำลอง) ---
    function searchStudent() {
      const studentId = document.getElementById('student-id').value;
      const infoBox = document.getElementById('student-info');
      if(studentId) {
        infoBox.classList.remove('hidden');
        infoBox.innerHTML = `พบข้อมูลนักเรียนรหัส ${studentId}`;
      } else {
        alert("กรุณากรอกรหัสนักเรียน");
      }
    }

    // --- ส่วนการสแกนสลิป ---
    function handleSlipUpload(event, orderId) {
      const file = event.target.files[0];
      if (!file) return;

      const uploadBtn = document.getElementById('btn-upload-text');
      if (uploadBtn) uploadBtn.innerText = "⏳ กำลังตรวจสอบสลิป...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('qr-canvas');
          const context = canvas.getContext('2d', { willReadFrequently: true });
          
          // ปรับขนาดภาพให้เล็กลงเพื่อประมวลผลเร็วขึ้น
          const maxWidth = 800;
          const scale = Math.min(maxWidth / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          context.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
          
          // ใช้ jsQR อ่านข้อมูลจากรูปภาพ
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          
          if (uploadBtn) {
            if (code) {
              console.log("Found QR code", code.data);
              uploadBtn.innerText = "✅ ตรวจสอบสลิปสำเร็จ";
              uploadBtn.classList.replace('bg-slate-100', 'bg-emerald-100');
              uploadBtn.classList.replace('text-slate-600', 'text-emerald-700');
            } else {
              uploadBtn.innerText = "❌ ไม่พบ QR ในสลิป กรุณาลองใหม่";
              uploadBtn.classList.replace('bg-slate-100', 'bg-red-100');
              uploadBtn.classList.replace('text-slate-600', 'text-red-600');
            }
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- ฟังก์ชันจัดการแท็บ ---
    function switchTab(tab) {
      document.getElementById('view-menu').classList.toggle('hidden', tab !== 'menu');
      document.getElementById('view-queue').classList.toggle('hidden', tab !== 'queue');
      
      const tabMenu = document.getElementById('tab-menu');
      const tabQueue = document.getElementById('tab-queue');
      
      if (tab === 'menu') {
        tabMenu.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all";
        tabQueue.className = "flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all";
      } else {
        tabQueue.className = "flex-1 py-2 rounded-xl text-xs font-bold bg-white text-orange-600 shadow-md transition-all";
        tabMenu.className = "flex-1 py-2 rounded-xl text-xs font-bold text-white/90 hover:text-white transition-all";
        renderMyQueue(); // โหลดข้อมูลคิวเมื่อสลับแท็บ
      }
    }

    // --- ฟังก์ชันเลือกระดับความเผ็ด & วิธีชำระเงิน ---
    function setSpice(level) {
      spiciness = level;
      ['ไม่เผ็ด', 'เผ็ดกลาง', 'เผ็ดมาก'].forEach(l => {
        const btn = document.getElementById(`sp-${l}`);
        if (l === level) {
          btn.className = "flex-1 py-2 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-bold";
        } else {
          btn.className = "flex-1 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500";
        }
      });
    }

    function setPayment(method) {
      paymentMethod = method;
      ['เงินโอน', 'เงินสด'].forEach(m => {
        const btn = document.getElementById(`pay-${m}`);
        if (m === method) {
          btn.className = "flex-1 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-bold text-xs shadow-sm";
        } else {
          btn.className = "flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs border border-slate-200";
        }
      });
      checkSubmitReady();
    }

    // --- ฟังก์ชันตะกร้าสินค้าและการสั่งซื้อ ---
    function toggleCart() {
      const cartBar = document.getElementById('cart-bar');
      cartBar.classList.toggle('translate-y-full');
    }

    function checkSubmitReady() {
      const btn = document.getElementById('btn-submit');
      // อนุญาตให้กดสั่งได้เมื่อมีของในตะกร้าและเลือกวิธีจ่ายเงินแล้ว 
      // (ในโค้ดนี้จำลองว่ามีของในตะกร้าเสมอเวลาทดสอบ ถ้าต้องการเชื่อมจริงค่อยแก้เงื่อนไข Object.keys(cart).length > 0)
      if (paymentMethod !== '') { 
        btn.className = "w-full bg-orange-500 text-white font-extrabold text-base py-3.5 rounded-2xl shadow-lg shadow-orange-500/30";
        btn.disabled = false;
      } else {
        btn.className = "w-full bg-slate-300 text-slate-500 font-extrabold text-base py-3.5 rounded-2xl";
        btn.disabled = true;
      }
    }

    function calculateTotal() {
      let total = 0;
      for (let item in cart) {
        total += cart[item].price * cart[item].qty;
      }
      return total; // กลับค่ารวม
    }

    function submitOrder() {
      if (!paymentMethod) return alert('กรุณาเลือกวิธีชำระเงิน');
      
      // ตัวอย่างจำลองตะกร้า หากยังไม่มีการทำระบบ Add to Cart สมบูรณ์
      if (Object.keys(cart).length === 0) {
        cart = {
          "หมูสามชั้น": { qty: 2, price: 15 },
          "ไส้กรอกแดง": { qty: 1, price: 10 }
        };
      }

      const orderData = {
        items: cart,
        spiciness: spiciness,
        payment: paymentMethod,
        total: calculateTotal(),
        status: 'รอดำเนินการ',
        queueNumber: 'A' + Math.floor(Math.random() * 100)
      };

      // บันทึกข้อมูลบิลลงระบบเครื่องลูกค้า
      localStorage.setItem('my_order_details', JSON.stringify(orderData));
      
      alert('สั่งอาหารสำเร็จ! กำลังพาท่านไปที่หน้าคิว...');
      
      // ล้างข้อมูลตะกร้าหลังสั่งเสร็จ
      cart = {};
      paymentMethod = '';
      setPayment('');
      document.getElementById('cart-total').innerText = '0 ฿';
      toggleCart();
      switchTab('queue');
    }

    // --- ฟังก์ชันแสดงคิวและรายละเอียดอาหาร (ส่วนที่เพิ่มใหม่) ---
    function renderMyQueue() {
      const queueCard = document.getElementById('my-queue-card');
      const savedOrder = JSON.parse(localStorage.getItem('my_order_details'));

      if (!savedOrder) {
        queueCard.innerHTML = `<p class="text-slate-400 text-sm py-4">ยังไม่มีรายการสั่งซื้อ</p>`;
        return;
      }

      // สร้างรายชื่ออาหารที่สั่ง
      let itemsListHtml = '';
      if (savedOrder.items && Object.keys(savedOrder.items).length > 0) {
        for (let itemName in savedOrder.items) {
          const item = savedOrder.items[itemName];
          itemsListHtml += `
            <div class="flex justify-between text-xs text-slate-600 mb-1">
              <span>- ${itemName} <span class="text-slate-400">(x${item.qty})</span></span>
              <span>${item.price * item.qty} ฿</span>
            </div>
          `;
        }
      }

      // จัดการหน้าตาของบิลในหน้าคิว
      queueCard.innerHTML = `
        <div class="bg-orange-50 border-2 border-orange-100 rounded-2xl p-4 text-left">
          <div class="flex justify-between items-center mb-3 border-b border-orange-200 pb-2">
            <h4 class="font-bold text-orange-700">หมายเลขคิว: <span class="text-xl">${savedOrder.queueNumber}</span></h4>
            <span class="bg-orange-500 text-white text-[10px] px-2 py-1 rounded-full font-bold">${savedOrder.status}</span>
          </div>
          
          <div class="mb-3">
            <p class="text-xs font-bold text-slate-800 mb-1">รายการอาหารของคุณ:</p>
            ${itemsListHtml}
          </div>
          
          <div class="flex justify-between items-center mt-3 pt-2 border-t border-orange-200">
            <span class="text-xs text-slate-500">ความเผ็ด: <b class="text-orange-600">${savedOrder.spiciness}</b></span>
            <span class="text-sm font-black text-slate-800">ยอดรวม: ${savedOrder.total} ฿</span>
          </div>
        </div>
      `;
    }

    // เรียกตอนเปิดเว็บ
    window.onload = () => {
      // โหลดเมนู หรือดึงข้อมูลคิวที่ค้างอยู่
      const fabBtn = document.getElementById('fab-cart');
      if(fabBtn) fabBtn.classList.remove('hidden'); // แสดงปุ่มตะกร้า
    };
  </script>
</body>
</html>
