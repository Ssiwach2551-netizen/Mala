<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mala Order </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="pb-32 max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl relative overflow-x-hidden">

  <!-- Header แบบพรีเมียม -->
  <div class="bg-zinc-900 text-white p-5 sticky top-0 z-50 rounded-b-[2rem] shadow-xl">
    <div class="flex items-center justify-between mb-4 mt-2">
      <div>
        <h1 class="text-xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">MALA ORDER</h1>
        <p class="text-xs text-zinc-400 font-medium mt-0.5">ระบบสั่งอาหาร & ติดตามคิว</p>
      </div>
      <div class="bg-zinc-800 p-2.5 rounded-2xl border border-zinc-700 shadow-inner">
        <span class="text-2xl">🌶️</span>
      </div>
    </div>
    
    <!-- Tab Navigation แบบปุ่ม Pill -->
    <div class="flex bg-zinc-800 p-1.5 rounded-2xl relative">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-md transition-all active:scale-95">🔥 เมนูอาหาร</button>
      <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95">⏳ คิวของฉัน</button>
    </div>
  </div>

  <!-- Tab: เมนูอาหาร -->
  <div id="view-menu" class="p-4 space-y-5 animate-fade-in">
    <!-- กล่องค้นหานักเรียน -->
    <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 text-sm">👤</div>
        <label class="text-sm font-extrabold text-slate-800">ระบุตัวตนของคุณ</label>
      </div>
      <div class="flex gap-2">
        <input type="number" id="student-id" placeholder="รหัสนักเรียน..." class="flex-1 p-3.5 rounded-2xl bg-slate-50 border-none ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-orange-500 text-sm font-medium transition-all">
        <button onclick="searchStudent()" id="btn-search-student" class="bg-orange-500 text-white px-6 rounded-2xl font-bold text-sm shadow-[0_4px_14px_0_rgba(249,115,22,0.39)] transition-all active:scale-95">ค้นหา</button>
      </div>
      <div id="student-info" class="hidden mt-4 p-3.5 rounded-2xl text-xs font-bold text-center transition-all duration-300"></div>
    </div>

    <!-- รายการเมนูอาหาร -->
    <div>
      <h2 class="text-lg font-extrabold text-slate-800 mb-3 px-1">เมนูยอดฮิต 🔥</h2>
      <div id="menu-container" class="space-y-3">
        <!-- Skeleton Loading -->
        <div class="bg-white p-3 rounded-2xl border border-slate-100 flex gap-3 animate-pulse">
          <div class="w-20 h-20 bg-slate-200 rounded-xl"></div>
          <div class="flex-1 py-1">
            <div class="w-12 h-4 bg-slate-200 rounded-md mb-2"></div>
            <div class="w-3/4 h-5 bg-slate-200 rounded-md mb-2"></div>
            <div class="w-1/2 h-4 bg-slate-200 rounded-md"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab: คิวของฉัน -->
  <div id="view-queue" class="hidden p-4 space-y-4 animate-fade-in">
    <div id="my-queue-card" class="bg-white border border-slate-100 rounded-[2rem] p-8 text-center shadow-sm">
      <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3">
        <span class="text-2xl opacity-50">🍽️</span>
      </div>
      <p class="text-slate-400 font-medium text-sm">ยังไม่มีรายการสั่งซื้อในระบบ</p>
    </div>
  </div>

  <!-- ตะกร้าสินค้า (Glassmorphism Bottom Sheet) -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t border-white/40 p-6 rounded-t-[2.5rem] shadow-[0_-20px_40px_rgba(0,0,0,0.08)] z-50 transform translate-y-full transition-transform duration-500 ease-out">
    
    <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-5 cursor-pointer" onclick="toggleCart()"></div>

    <div class="flex justify-between items-center mb-4">
      <h3 class="font-extrabold text-slate-900 text-lg flex items-center gap-2">🛒 สรุปคำสั่งซื้อ</h3>
      <span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-black" id="cart-total-badge">0 ฿</span>
    </div>
    
    <div id="cart-items-list" class="max-h-32 overflow-y-auto hide-scrollbar mb-4 space-y-2 text-sm font-medium text-slate-600"></div>

    <div class="space-y-4 mb-5">
      <!-- เลือกระดับความเผ็ด -->
      <div>
        <label class="text-[10px] font-bold text-slate-400 mb-2 block uppercase tracking-wider">ระดับความเผ็ด</label>
        <div class="flex gap-2">
          <button onclick="setSpice('ไม่เผ็ด')" id="sp-ไม่เผ็ด" class="flex-1 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-500 transition-all active:scale-95">ไม่เผ็ด</button>
          <button onclick="setSpice('เผ็ดกลาง')" id="sp-เผ็ดกลาง" class="flex-1 py-2.5 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-black shadow-sm transition-all active:scale-95">เผ็ดกลาง</button>
          <button onclick="setSpice('เผ็ดมาก')" id="sp-เผ็ดมาก" class="flex-1 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-500 transition-all active:scale-95">เผ็ดมาก</button>
        </div>
      </div>

      <!-- เลือกวิธีชำระเงิน -->
      <div>
        <label class="text-[10px] font-bold text-slate-400 mb-2 block uppercase tracking-wider">วิธีชำระเงิน</label>
        <div class="flex gap-2">
          <button onclick="setPayment('เงินโอน')" id="pay-เงินโอน" class="flex-1 py-3 rounded-2xl bg-slate-50 text-slate-500 font-bold text-sm border border-slate-200 transition-all active:scale-95 flex justify-center items-center gap-2">💳 เงินโอน</button>
          <button onclick="setPayment('เงินสด')" id="pay-เงินสด" class="flex-1 py-3 rounded-2xl bg-slate-50 text-slate-500 font-bold text-sm border border-slate-200 transition-all active:scale-95 flex justify-center items-center gap-2">💵 เงินสด</button>
        </div>
      </div>
    </div>

    <button id="btn-submit" onclick="submitOrder()" class="w-full bg-slate-200 text-slate-400 font-extrabold text-base py-4 rounded-[1.25rem] transition-all" disabled>
      กรุณาเลือกเมนูและวิธีชำระเงิน
    </button>
  </div>

  <!-- ปุ่มเปิดตะกร้า (Floating Action Button) -->
  <button onclick="toggleCart()" id="fab-cart" class="hidden fixed bottom-6 right-6 bg-zinc-900 text-white p-4 rounded-full shadow-2xl shadow-zinc-900/40 z-40 transition-all hover:scale-105 active:scale-95">
    🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-white">0</span>
  </button>

  <script>
    // ⚠️ นำ URL จาก Deploy Web App ใน Google Apps Script มาวางตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; 
    // ⚠️ เปลี่ยนเป็นเบอร์พร้อมเพย์ของคุณ
    const PROMPTPAY_NUMBER = "1418600121013"; 
    
    let cart = {}; 
    let spiciness = 'เผ็ดกลาง'; 
    let paymentMethod = ''; 
    let currentStudent = { id: '', name: '', class: '' };

    // --- 1. โหลดข้อมูลเมนู ---
    async function fetchMenu() {
      const container = document.getElementById('menu-container');
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        
        if (!data.menus || data.menus.length === 0) {
          container.innerHTML = `<div class="p-10 text-center"><p class="text-slate-400 text-sm font-medium">ยังไม่มีรายการเมนูอาหาร</p></div>`;
          return;
        }

        container.innerHTML = data.menus.map(item => `
          <div class="bg-white p-3 rounded-[1.25rem] border border-slate-100 shadow-sm flex items-center gap-3 transition-all hover:shadow-md">
            <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-20 h-20 rounded-xl object-cover bg-slate-50">
            <div class="flex-1">
              <span class="text-[9px] font-black text-orange-500 bg-orange-50 px-2 py-0.5 rounded-md uppercase tracking-wider">${item.category}</span>
              <h4 class="font-extrabold text-slate-800 text-sm mt-1">${item.name}</h4>
              <div class="flex items-end justify-between mt-1">
                <p class="text-sm font-black text-zinc-800">${item.price} ฿ <span class="text-[10px] font-medium text-slate-400 ml-1">(เหลือ ${item.stock})</span></p>
              </div>
            </div>
            ${item.stock > 0 ? `
              <div class="flex flex-col items-center gap-1 bg-slate-50 rounded-xl p-1 border border-slate-100">
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, 1)" class="w-7 h-7 bg-orange-500 text-white rounded-lg font-bold text-sm shadow-sm active:scale-90">+</button>
                <span id="qty-${item.name}" class="font-bold text-xs w-4 text-center text-slate-700">0</span>
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, -1)" class="w-7 h-7 bg-white text-slate-600 rounded-lg font-bold text-sm shadow-sm border border-slate-200 active:scale-90">-</button>
              </div>
            ` : `<span class="text-[10px] font-black text-red-500 bg-red-50 px-3 py-1.5 rounded-xl border border-red-100">หมดแล้ว</span>`}
          </div>
        `).join('');

        updateCartUI();
      } catch (err) {
        container.innerHTML = `<div class="p-10 text-center"><p class="text-red-400 text-sm font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูล</p></div>`;
      }
    }

    // --- 2. ค้นหานักเรียน ---
    async function searchStudent() {
      const idInput = document.getElementById('student-id').value.trim();
      const infoBox = document.getElementById('student-info');
      const btn = document.getElementById('btn-search-student');

      if (!idInput) return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสนักเรียนก่อนค้นหา', confirmButtonColor: '#f97316' });

      btn.innerHTML = `<span class="animate-pulse">⏳</span>`;
      btn.disabled = true;

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchStudent', studentId: idInput }) });
        const result = await res.json();

        infoBox.classList.remove('hidden');
        if (result.found) {
          currentStudent = { id: idInput, name: result.name, class: result.class };
          infoBox.className = "mt-4 p-3.5 bg-emerald-50 text-emerald-700 rounded-2xl text-xs font-bold border border-emerald-100 text-center shadow-sm animate-fade-in";
          infoBox.innerHTML = `<span class="text-emerald-500 mr-1">✓</span> ${result.name} (ห้อง ${result.class})`;
        } else {
          currentStudent = { id: '', name: '', class: '' };
          infoBox.className = "mt-4 p-3.5 bg-red-50 text-red-600 rounded-2xl text-xs font-bold border border-red-100 text-center shadow-sm animate-fade-in";
          infoBox.innerHTML = `❌ ไม่พบข้อมูลในระบบ`;
          Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: 'กรุณาตรวจสอบรหัสนักเรียนอีกครั้ง', confirmButtonColor: '#ef4444' });
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', confirmButtonColor: '#ef4444' });
      } finally {
        btn.innerText = "ค้นหา";
        btn.disabled = false;
        checkSubmitReady();
      }
    }

    // --- 3. จัดการตะกร้า ---
    function updateCartItem(name, price, maxStock, change) {
      if (!cart[name]) cart[name] = { price: price, qty: 0 };
      
      let newQty = cart[name].qty + change;
      if (newQty > maxStock) return Swal.fire({ icon: 'warning', title: 'สินค้าไม่พอ', text: 'จำนวนสินค้าเกินสต๊อกที่มี', confirmButtonColor: '#f97316' });
      
      if (newQty <= 0) delete cart[name];
      else cart[name].qty = newQty;
      
      const qtyEl = document.getElementById(`qty-${name}`);
      if (qtyEl) qtyEl.innerText = cart[name] ? cart[name].qty : 0;
      
      updateCartUI();
    }

    function updateCartUI() {
      let totalCount = 0; let totalPrice = 0; let itemsHtml = '';
      for (let name in cart) {
        totalCount += cart[name].qty;
        totalPrice += cart[name].qty * cart[name].price;
        itemsHtml += `
          <div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
            <span><span class="font-bold text-orange-500 mr-1">${cart[name].qty}x</span> ${name}</span>
            <span class="font-extrabold text-slate-800">${cart[name].qty * cart[name].price} ฿</span>
          </div>
        `;
      }
      
      document.getElementById('cart-badge').innerText = totalCount;
      document.getElementById('cart-total-badge').innerText = `${totalPrice} ฿`;
      document.getElementById('cart-items-list').innerHTML = itemsHtml || '<p class="text-slate-400 text-center py-2">ยังไม่ได้เลือกรายการอาหาร</p>';
      
      const fabBtn = document.getElementById('fab-cart');
      if (totalCount > 0) fabBtn.classList.remove('hidden');
      else { fabBtn.classList.add('hidden'); document.getElementById('cart-bar').classList.add('translate-y-full'); }
      
      checkSubmitReady();
    }

    function checkSubmitReady() {
      const btn = document.getElementById('btn-submit');
      let totalPrice = 0; for (let name in cart) totalPrice += cart[name].qty * cart[name].price;

      if (Object.keys(cart).length > 0 && currentStudent.id !== '' && paymentMethod !== '') {
        btn.className = "w-full bg-orange-500 text-white font-extrabold text-base py-4 rounded-[1.25rem] shadow-[0_8px_20px_0_rgba(249,115,22,0.3)] transition-all active:scale-95";
        btn.innerText = `ชำระเงิน ${totalPrice} ฿`;
        btn.disabled = false;
      } else {
        btn.className = "w-full bg-slate-200 text-slate-400 font-extrabold text-base py-4 rounded-[1.25rem] transition-all cursor-not-allowed";
        btn.innerText = "กรุณาเลือกเมนูและวิธีชำระเงิน";
        btn.disabled = true;
      }
    }

    // --- 4. ส่งคำสั่งซื้อ ---
    async function submitOrder() {
      if (!currentStudent.id) return Swal.fire('แจ้งเตือน', 'กรุณาค้นหารหัสนักเรียนก่อน', 'warning');
      const btn = document.getElementById('btn-submit');
      btn.innerHTML = `<span class="animate-pulse">กำลังส่งออเดอร์...</span>`;
      btn.disabled = true;

      const itemsStr = Object.entries(cart).map(([name, item]) => `${name} x${item.qty}`).join(', ');
      let totalPrice = 0; for (let name in cart) totalPrice += cart[name].qty * cart[name].price;

      const payload = {
        action: 'newOrder', studentId: currentStudent.id, studentName: currentStudent.name,
        class: currentStudent.class, items: itemsStr, spiciness: spiciness,
        totalPrice: totalPrice, paymentMethod: paymentMethod, cartRaw: cart
      };

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();

        if (result.status === 'success') {
          const orderData = { orderId: result.orderId, items: cart, spiciness: spiciness, paymentMethod: paymentMethod, totalPrice: totalPrice, status: paymentMethod === 'เงินสด' ? 'Pending' : 'Waiting Transfer' };
          localStorage.setItem('my_order_details', JSON.stringify(orderData));

          if (paymentMethod === 'เงินโอน') {
            Swal.fire({
              title: 'สั่งอาหารสำเร็จ!',
              html: `กรุณาสแกนเพื่อชำระเงิน<br><span class="text-2xl font-black text-orange-500 mt-2 block">${totalPrice} ฿</span>`,
              imageUrl: `https://promptpay.io/${PROMPTPAY_NUMBER}/${totalPrice}.png`,
              imageWidth: 220, imageHeight: 220, imageAlt: 'PromptPay QR',
              confirmButtonText: 'บันทึกสลิปเรียบร้อย',
              confirmButtonColor: '#f97316',
              allowOutsideClick: false
            }).then(() => finishOrderUI());
          } else {
            Swal.fire({
              icon: 'success', title: 'สั่งอาหารสำเร็จ!',
              text: `ออเดอร์: ${result.orderId} (เตรียมเงินสดให้พอดีนะ!)`,
              confirmButtonText: 'ดูคิวของฉัน', confirmButtonColor: '#f97316'
            }).then(() => finishOrderUI());
          }
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถสั่งซื้อได้ กรุณาลองใหม่อีกครั้ง', confirmButtonColor: '#ef4444' });
        btn.innerText = "ลองใหม่อีกครั้ง"; btn.disabled = false;
      }
    }

    function finishOrderUI() {
      cart = {}; paymentMethod = ''; setPayment(''); updateCartUI();
      document.getElementById('cart-bar').classList.add('translate-y-full');
      switchTab('queue'); fetchMenu();
    }

    // --- 5. แสดงผลคิว ---
    function renderMyQueue() {
      const queueCard = document.getElementById('my-queue-card');
      const savedOrder = JSON.parse(localStorage.getItem('my_order_details'));

      if (!savedOrder) {
        queueCard.innerHTML = `
          <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3"><span class="text-2xl opacity-50">🍽️</span></div>
          <p class="text-slate-400 font-medium text-sm">ยังไม่มีรายการสั่งซื้อในระบบ</p>
        `;
        return;
      }

      let itemsListHtml = '';
      for (let itemName in savedOrder.items) {
        const item = savedOrder.items[itemName];
        itemsListHtml += `<div class="flex justify-between text-sm font-medium text-slate-600 mb-1"><span>- ${itemName} <span class="text-orange-500 font-bold">x${item.qty}</span></span><span>${item.price * item.qty} ฿</span></div>`;
      }

      let qrHtml = savedOrder.paymentMethod === 'เงินโอน' && savedOrder.status === 'Waiting Transfer' ? `
        <div class="mt-4 border-t border-slate-200 border-dashed pt-4 text-center">
          <p class="text-xs font-bold text-slate-500 mb-3">แสกนชำระเงินที่นี่ 👇</p>
          <img src="https://promptpay.io/${PROMPTPAY_NUMBER}/${savedOrder.totalPrice}.png" class="w-32 h-32 mx-auto rounded-2xl shadow-sm border border-slate-100">
        </div>
      ` : '';

      queueCard.innerHTML = `
        <div class="bg-white rounded-[2rem] p-0 text-left">
          <div class="flex justify-between items-center mb-4 bg-zinc-900 p-4 rounded-2xl text-white">
            <h4 class="font-medium text-zinc-300 text-xs">ออเดอร์ <span class="text-lg font-black text-white block">${savedOrder.orderId}</span></h4>
            <span class="bg-orange-500 text-white text-[10px] px-3 py-1.5 rounded-full font-bold uppercase tracking-wider">${savedOrder.status}</span>
          </div>
          <div class="mb-4 px-2">
            <p class="text-xs font-bold text-slate-400 mb-2 uppercase">รายการอาหาร</p>
            ${itemsListHtml}
          </div>
          <div class="bg-slate-50 p-4 rounded-2xl">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-slate-500 font-medium">ความเผ็ด:</span>
              <span class="text-xs font-bold text-orange-600">${savedOrder.spiciness}</span>
            </div>
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 border-dashed">
              <span class="text-xs text-slate-500 font-medium">วิธีชำระเงิน:</span>
              <span class="text-xs font-bold text-slate-800">${savedOrder.paymentMethod}</span>
            </div>
            <div class="flex justify-between items-center mt-3">
              <span class="text-sm font-bold text-slate-800">ยอดรวมทั้งสิ้น</span>
              <span class="text-lg font-black text-orange-500">${savedOrder.totalPrice} ฿</span>
            </div>
          </div>
          ${qrHtml}
        </div>
      `;
    }

    // UI Utilities
    function switchTab(tab) {
      document.getElementById('view-menu').classList.toggle('hidden', tab !== 'menu');
      document.getElementById('view-queue').classList.toggle('hidden', tab !== 'queue');
      document.getElementById('tab-menu').className = tab === 'menu' ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-md transition-all active:scale-95" : "flex-1 py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95";
      document.getElementById('tab-queue').className = tab === 'queue' ? "flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-md transition-all active:scale-95" : "flex-1 py-2.5 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95";
      if (tab === 'queue') renderMyQueue();
    }

    function toggleCart() { document.getElementById('cart-bar').classList.toggle('translate-y-full'); }

    function setSpice(level) {
      spiciness = level;
      ['ไม่เผ็ด', 'เผ็ดกลาง', 'เผ็ดมาก'].forEach(l => {
        document.getElementById(`sp-${l}`).className = l === level ? "flex-1 py-2.5 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-black shadow-sm transition-all active:scale-95" : "flex-1 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-bold text-slate-500 transition-all active:scale-95";
      });
    }

    function setPayment(method) {
      paymentMethod = method;
      ['เงินโอน', 'เงินสด'].forEach(m => {
        document.getElementById(`pay-${m}`).className = m === method ? "flex-1 py-3 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-black text-sm shadow-sm transition-all active:scale-95 flex justify-center items-center gap-2" : "flex-1 py-3 rounded-2xl bg-slate-50 text-slate-500 font-bold text-sm border border-slate-200 transition-all active:scale-95 flex justify-center items-center gap-2";
      });
      checkSubmitReady();
    }

    window.onload = () => { fetchMenu(); };
  </script>
</body>
</html>
