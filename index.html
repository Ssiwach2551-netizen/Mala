<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mala Order - Premium Queue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Premium Timeline styles */
    .step-active .step-icon { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3); }
    .step-active .step-line { background: linear-gradient(90deg, #f97316, #ea580c); }
    .step-done .step-icon { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3); }
    .step-done .step-line { background: linear-gradient(90deg, #22c55e, #16a34a); }
    .step-icon { transition: all 0.4s ease; border: 2px solid #e2e8f0; }
  </style>
</head>
<body class="pb-32 max-w-md mx-auto bg-slate-50 min-h-screen shadow-[0_0_40px_rgba(0,0,0,0.05)] relative overflow-x-hidden">

  <!-- เสียงแจ้งเตือน -->
  <audio id="ready-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <!-- Header Premium -->
  <div class="bg-zinc-900 text-white p-6 sticky top-0 z-50 rounded-b-[2.5rem] shadow-2xl">
    <div class="flex items-center justify-between mb-5 mt-2">
      <div>
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">MALA ORDER</h1>
        <p class="text-xs text-zinc-400 font-medium mt-1" id="header-status">ระบบสั่งอาหาร & ติดตามคิวอัจฉริยะ</p>
      </div>
      <div class="bg-zinc-800 p-3 rounded-2xl border border-zinc-700 shadow-inner">
        <span class="text-2xl">🌶️</span>
      </div>
    </div>
    <div class="flex bg-zinc-800 p-1.5 rounded-2xl relative shadow-inner">
      <button onclick="switchTab('menu')" id="tab-menu" class="flex-1 py-3 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-lg transition-all active:scale-95">🔥 เมนูอาหาร</button>
      <button onclick="switchTab('queue')" id="tab-queue" class="flex-1 py-3 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95">⏳ คิวของฉัน</button>
    </div>
  </div>

  <!-- Tab: เมนูอาหาร -->
  <div id="view-menu" class="p-5 space-y-6 animate-fade-in">
    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-500 text-lg shadow-inner">👤</div>
        <label class="text-sm font-extrabold text-slate-800">ระบุตัวตนของคุณ</label>
      </div>
      <div class="flex gap-3">
        <input type="number" id="student-id" placeholder="รหัสนักเรียน..." class="flex-1 p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm font-medium transition-all">
        <button onclick="searchStudent()" id="btn-search-student" class="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-7 rounded-2xl font-bold text-sm shadow-lg shadow-orange-500/30 transition-all active:scale-95 hover:shadow-orange-500/50">ค้นหา</button>
      </div>
      <div id="student-info" class="hidden mt-4 p-4 rounded-2xl text-xs font-bold text-center transition-all duration-300"></div>
    </div>
    <div>
      <div class="flex justify-between items-center mb-4 px-2">
        <h2 class="text-lg font-extrabold text-slate-800">เมนูยอดฮิต 🔥</h2>
        <button onclick="fetchMenu()" class="text-xs font-bold text-orange-500 bg-orange-50 px-4 py-2 rounded-full active:scale-95 hover:bg-orange-100 transition-colors">🔄 รีเฟรช</button>
      </div>
      <div id="menu-container" class="space-y-4"></div>
    </div>
  </div>

  <!-- Tab: คิวของฉัน -->
  <div id="view-queue" class="hidden p-5 space-y-4 animate-fade-in">
    <div id="my-queue-card" class="bg-white border border-slate-100 rounded-[2rem] p-6 text-center shadow-sm min-h-[350px] flex flex-col justify-center">
      <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
        <span class="text-3xl opacity-40">🍽️</span>
      </div>
      <p class="text-slate-400 font-medium text-sm">ยังไม่มีรายการสั่งซื้อในระบบ</p>
    </div>
  </div>

  <!-- ตะกร้าสินค้า Premium -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t border-slate-200 p-6 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-50 transform translate-y-full transition-transform duration-500 ease-out">
    <div class="w-16 h-1.5 bg-slate-300 rounded-full mx-auto mb-6 cursor-pointer hover:bg-slate-400 transition-colors" onclick="toggleCart()"></div>
    <div class="flex justify-between items-center mb-5">
      <h3 class="font-extrabold text-slate-900 text-lg flex items-center gap-2">🛒 สรุปคำสั่งซื้อ</h3>
      <span class="bg-orange-100 text-orange-600 px-4 py-1.5 rounded-full text-sm font-black shadow-inner" id="cart-total-badge">0 ฿</span>
    </div>
    <div id="cart-items-list" class="max-h-36 overflow-y-auto hide-scrollbar mb-5 space-y-3 text-sm font-medium text-slate-600"></div>
    <div class="space-y-5 mb-6">
      <div>
        <label class="text-[11px] font-extrabold text-slate-500 mb-2 block uppercase tracking-wider">ระดับความเผ็ด</label>
        <div class="flex gap-3">
          <button onclick="setSpice('ไม่เผ็ด')" id="sp-ไม่เผ็ด" class="flex-1 py-3 rounded-2xl bg-white border-2 border-slate-100 text-xs font-bold text-slate-500 transition-all active:scale-95">ไม่เผ็ด</button>
          <button onclick="setSpice('เผ็ดกลาง')" id="sp-เผ็ดกลาง" class="flex-1 py-3 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-black shadow-sm transition-all active:scale-95">เผ็ดกลาง</button>
          <button onclick="setSpice('เผ็ดมาก')" id="sp-เผ็ดมาก" class="flex-1 py-3 rounded-2xl bg-white border-2 border-slate-100 text-xs font-bold text-slate-500 transition-all active:scale-95">เผ็ดมาก</button>
        </div>
      </div>
      <div>
        <label class="text-[11px] font-extrabold text-slate-500 mb-2 block uppercase tracking-wider">วิธีชำระเงิน</label>
        <div class="flex gap-3">
          <button onclick="setPayment('เงินโอน')" id="pay-เงินโอน" class="flex-1 py-3.5 rounded-2xl bg-white text-slate-500 font-bold text-sm border-2 border-slate-100 transition-all active:scale-95 flex justify-center items-center gap-2">💳 สแกนจ่าย</button>
          <button onclick="setPayment('เงินสด')" id="pay-เงินสด" class="flex-1 py-3.5 rounded-2xl bg-white text-slate-500 font-bold text-sm border-2 border-slate-100 transition-all active:scale-95 flex justify-center items-center gap-2">💵 เงินสด</button>
        </div>
      </div>
    </div>
    <button id="btn-submit" onclick="submitOrder()" class="w-full bg-slate-200 text-slate-400 font-extrabold text-base py-4 rounded-[1.5rem] transition-all" disabled>กรุณาเลือกเมนูและวิธีชำระเงิน</button>
  </div>

  <button onclick="toggleCart()" id="fab-cart" class="hidden fixed bottom-6 right-6 bg-gradient-to-r from-zinc-800 to-zinc-900 text-white p-4 rounded-full shadow-2xl shadow-zinc-900/50 z-40 transition-all hover:scale-105 active:scale-95 border border-zinc-700">
    🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-white shadow-sm">0</span>
  </button>

  <script>
    // ⚠️ ระบุ URL ของ Apps Script และเบอร์พร้อมเพย์
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; 
    const PROMPTPAY_NUMBER = "1418600121013"; 
    
    let cart = {}; let spiciness = 'เผ็ดกลาง'; let paymentMethod = ''; 
    let currentStudent = { id: '', name: '', class: '' };
    let pollingInterval = null;

    const Toast = Swal.mixin({
      toast: true, position: 'top', showConfirmButton: false, timer: 3000, timerProgressBar: true
    });

    async function fetchMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = `<div class="py-10 flex flex-col items-center"><div class="w-8 h-8 border-4 border-orange-200 border-t-orange-500 rounded-full animate-spin mb-3"></div><p class="text-slate-400 text-sm font-medium">กำลังโหลดเมนูความอร่อย...</p></div>`;
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        if (!data.menus || data.menus.length === 0) {
          container.innerHTML = `<div class="bg-white p-8 rounded-[2rem] text-center shadow-sm"><p class="text-slate-400 text-sm font-medium">ยังไม่มีรายการเมนูอาหาร</p></div>`; return;
        }
        container.innerHTML = data.menus.map(item => `
          <div class="bg-white p-4 rounded-[1.5rem] border border-slate-100 shadow-sm flex items-center gap-4 transition-all hover:shadow-md">
            <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-24 h-24 rounded-2xl object-cover bg-slate-50 shadow-inner">
            <div class="flex-1">
              <span class="text-[10px] font-black text-orange-500 bg-orange-50 px-2.5 py-1 rounded-md uppercase tracking-wider">${item.category}</span>
              <h4 class="font-extrabold text-slate-800 text-base mt-1.5">${item.name}</h4>
              <p class="text-sm font-black text-zinc-800 mt-1">${item.price} ฿ <span class="text-[10px] font-medium text-slate-400 ml-1">(เหลือ ${item.stock})</span></p>
            </div>
            ${item.stock > 0 ? `
              <div class="flex flex-col items-center gap-1.5 bg-slate-50 rounded-2xl p-1.5 border border-slate-100">
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, 1)" class="w-8 h-8 bg-orange-500 text-white rounded-xl font-bold text-lg shadow-md shadow-orange-500/20 active:scale-90 transition-transform">+</button>
                <span id="qty-${item.name}" class="font-black text-sm w-5 text-center text-slate-700">0</span>
                <button onclick="updateCartItem('${item.name}', ${item.price}, ${item.stock}, -1)" class="w-8 h-8 bg-white text-slate-600 rounded-xl font-bold text-lg shadow-sm border border-slate-200 active:scale-90 transition-transform">-</button>
              </div>
            ` : `<span class="text-xs font-black text-red-500 bg-red-50 px-4 py-2 rounded-xl border border-red-100">หมด</span>`}
          </div>
        `).join('');
        updateCartUI();
      } catch (err) { container.innerHTML = `<p class="text-center py-5 text-red-400 text-sm font-bold">โหลดข้อมูลล้มเหลว กรุณาลองใหม่</p>`; }
    }

    async function searchStudent() {
      const idInput = document.getElementById('student-id').value.trim();
      const infoBox = document.getElementById('student-info');
      const btn = document.getElementById('btn-search-student');
      if (!idInput) return Toast.fire({ icon: 'warning', title: 'กรุณากรอกรหัสนักเรียน' });
      btn.innerHTML = `<div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>`; btn.disabled = true;
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'searchStudent', studentId: idInput })
        });
        const result = await res.json();
        infoBox.classList.remove('hidden');
        if (result.found) {
          currentStudent = { id: idInput, name: result.name, class: result.class };
          infoBox.className = "mt-4 p-4 bg-emerald-50 text-emerald-700 rounded-2xl text-sm font-bold border border-emerald-100 text-center shadow-sm animate-fade-in";
          infoBox.innerHTML = `👋 สวัสดี ${result.name} (ห้อง ${result.class})`;
        } else {
          currentStudent = { id: '', name: '', class: '' };
          infoBox.className = "mt-4 p-4 bg-red-50 text-red-600 rounded-2xl text-sm font-bold border border-red-100 text-center shadow-sm animate-fade-in";
          infoBox.innerHTML = `❌ ไม่พบข้อมูลในระบบ`;
        }
      } catch (e) { Toast.fire({ icon: 'error', title: 'การเชื่อมต่อมีปัญหา' }); }
      finally { btn.innerText = "ค้นหา"; btn.disabled = false; checkSubmitReady(); }
    }

    function updateCartItem(name, price, maxStock, change) {
      if (!cart[name]) cart[name] = { price: price, qty: 0 };
      let newQty = cart[name].qty + change;
      if (newQty > maxStock) return Toast.fire({ icon: 'error', title: 'สินค้าหมดแล้ว!' });
      if (newQty <= 0) delete cart[name]; else cart[name].qty = newQty;
      const qtyEl = document.getElementById(`qty-${name}`); if (qtyEl) qtyEl.innerText = cart[name] ? cart[name].qty : 0;
      updateCartUI();
    }

    function updateCartUI() {
      let tCount = 0, tPrice = 0, html = '';
      for (let n in cart) { 
        tCount += cart[n].qty; tPrice += cart[n].qty * cart[n].price; 
        html += `<div class="flex justify-between py-2 border-b border-slate-100 last:border-0 items-center"><span class="text-slate-700"><span class="font-black text-orange-500 mr-2 bg-orange-50 px-2 py-0.5 rounded-lg">${cart[n].qty}x</span> ${n}</span><span class="font-extrabold text-slate-800">${cart[n].qty * cart[n].price} ฿</span></div>`; 
      }
      document.getElementById('cart-badge').innerText = tCount; document.getElementById('cart-total-badge').innerText = `${tPrice} ฿`;
      document.getElementById('cart-items-list').innerHTML = html || '<p class="text-slate-400 text-center py-4 text-xs font-medium">ยังไม่ได้เลือกรายการอาหาร</p>';
      const fab = document.getElementById('fab-cart');
      if (tCount > 0) fab.classList.remove('hidden'); else { fab.classList.add('hidden'); document.getElementById('cart-bar').classList.add('translate-y-full'); }
      checkSubmitReady();
    }

    function checkSubmitReady() {
      const btn = document.getElementById('btn-submit');
      let p = 0; for(let n in cart) p += cart[n].qty * cart[n].price;
      if (Object.keys(cart).length > 0 && currentStudent.id !== '' && paymentMethod !== '') {
        btn.className = "w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-extrabold text-base py-4 rounded-[1.5rem] shadow-[0_8px_20px_0_rgba(249,115,22,0.3)] transition-all active:scale-95 hover:shadow-orange-500/50";
        btn.innerText = `ยืนยันสั่งอาหาร ${p} ฿`; btn.disabled = false;
      } else {
        btn.className = "w-full bg-slate-200 text-slate-400 font-extrabold text-base py-4 rounded-[1.5rem] transition-all cursor-not-allowed";
        btn.innerText = "กรุณาเลือกเมนูและวิธีชำระเงิน"; btn.disabled = true;
      }
    }

    async function submitOrder() {
      const btn = document.getElementById('btn-submit'); btn.innerText = "กำลังดำเนินการ..."; btn.disabled = true;
      const itemsStr = Object.entries(cart).map(([n, i]) => `${n} x${i.qty}`).join(', ');
      let tPrice = 0; for(let n in cart) tPrice += cart[n].qty * cart[n].price;
      const payload = { action: 'newOrder', studentId: currentStudent.id, studentName: currentStudent.name, class: currentStudent.class, items: itemsStr, spiciness: spiciness, totalPrice: tPrice, paymentMethod: paymentMethod, cartRaw: cart };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          const orderData = { orderId: result.orderId, items: cart, spiciness: spiciness, paymentMethod: paymentMethod, totalPrice: tPrice, status: 'Pending', queueAhead: result.queueAhead || 0 };
          localStorage.setItem('my_order_details', JSON.stringify(orderData));
          
          if (paymentMethod === 'เงินโอน') {
            Swal.fire({ 
              title: 'แสกนเพื่อชำระเงิน', 
              html: `
                <div class="p-4 bg-slate-50 rounded-2xl mb-4 border border-slate-100">
                  <span class="text-sm font-bold text-slate-500 block mb-1">ยอดชำระสุทธิ</span>
                  <span class="text-3xl font-black text-orange-500 block">${tPrice} ฿</span>
                </div>
                <p class="text-xs font-bold text-red-500 bg-red-50 p-2 rounded-lg mb-2">⚠️ กรุณาบันทึกภาพสลิปเพื่อนำไปโชว์ที่ร้าน</p>
              `, 
              imageUrl: `https://promptpay.io/${PROMPTPAY_NUMBER}/${tPrice}.png`, 
              imageWidth: 220, imageHeight: 220, 
              confirmButtonText: 'โอนเงินเรียบร้อยแล้ว', confirmButtonColor: '#f97316', 
              allowOutsideClick: false,
              customClass: { confirmButton: 'font-bold rounded-xl py-3 px-6' }
            }).then(() => finishOrderUI());
          } else {
            Toast.fire({ icon: 'success', title: 'ส่งออเดอร์สำเร็จ!' }); finishOrderUI();
          }
        }
      } catch (e) { Swal.fire('Error', 'สั่งซื้อไม่สำเร็จ กรุณาลองใหม่', 'error'); btn.innerText = "ลองใหม่"; btn.disabled = false; }
    }

    function finishOrderUI() {
      cart = {}; paymentMethod = ''; setPayment(''); updateCartUI();
      document.getElementById('cart-bar').classList.add('translate-y-full');
      switchTab('queue'); fetchMenu(); startPollingQueue();
    }

    function renderMyQueue() {
      const qCard = document.getElementById('my-queue-card');
      const order = JSON.parse(localStorage.getItem('my_order_details'));
      if (!order || order.status === 'Done') {
        qCard.innerHTML = `<div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><span class="text-3xl opacity-40">🍽️</span></div><p class="text-slate-400 font-medium text-sm">ยังไม่มีคิว หรือ รับอาหารแล้ว</p>`;
        return;
      }

      let sLevel = order.status === 'Ready' ? 3 : (order.status === 'Cooking' ? 2 : 1);
      
      let itemsListHtml = '<div class="mb-4 space-y-2">';
      for (let itemName in order.items) {
        itemsListHtml += `<div class="flex justify-between text-sm items-center"><span class="text-slate-600 font-bold tracking-wide"><span class="text-orange-500 mr-2">•</span>${itemName}</span><span class="font-black text-slate-800 bg-slate-100 px-2 py-0.5 rounded-lg">x${order.items[itemName].qty}</span></div>`;
      }
      itemsListHtml += '</div>';
      
      let html = `<div class="text-left w-full">
        <div class="flex justify-between items-center mb-8 bg-gradient-to-r from-zinc-800 to-zinc-900 p-5 rounded-[1.5rem] text-white shadow-xl">
          <div><p class="text-zinc-400 text-[10px] uppercase tracking-widest mb-1 font-bold">Order ID</p><h4 class="text-2xl font-black text-orange-400">${order.orderId}</h4></div>
          <div class="text-right"><p class="text-zinc-400 text-[10px] uppercase tracking-widest mb-1 font-bold">คิวก่อนหน้า</p><h4 class="text-2xl font-black">${order.queueAhead !== undefined ? order.queueAhead : '?'} <span class="text-sm font-medium text-zinc-300">คิว</span></h4></div>
        </div>
        
        <div class="flex items-center justify-between mb-8 relative px-3">
          <div class="absolute left-7 right-7 top-1/2 h-1.5 bg-slate-100 -z-10 -translate-y-1/2 rounded-full"></div>
          <div class="absolute left-7 top-1/2 h-1.5 bg-orange-500 -z-10 -translate-y-1/2 rounded-full transition-all duration-700 step-line" style="width: ${sLevel===1 ? '0%' : (sLevel===2 ? '50%' : '100%')}"></div>
          
          <div class="flex flex-col items-center ${sLevel >= 1 ? 'step-active' : ''}">
            <div class="w-12 h-12 rounded-full flex items-center justify-center font-black text-base bg-white text-slate-300 step-icon z-10">1</div>
            <span class="text-[11px] font-extrabold mt-2 ${sLevel >= 1 ? 'text-slate-800' : 'text-slate-400'}">รับออเดอร์</span>
          </div>
          <div class="flex flex-col items-center ${sLevel >= 2 ? 'step-active' : ''}">
            <div class="w-12 h-12 rounded-full flex items-center justify-center font-black text-base bg-white text-slate-300 step-icon z-10">2</div>
            <span class="text-[11px] font-extrabold mt-2 ${sLevel >= 2 ? 'text-orange-600' : 'text-slate-400'} ${sLevel === 2 ? 'animate-pulse' : ''}">กำลังทำ</span>
          </div>
          <div class="flex flex-col items-center ${sLevel >= 3 ? 'step-done' : ''}">
            <div class="w-12 h-12 rounded-full flex items-center justify-center font-black text-base bg-white text-slate-300 step-icon z-10">3</div>
            <span class="text-[11px] font-extrabold mt-2 ${sLevel >= 3 ? 'text-green-600' : 'text-slate-400'}">เสร็จแล้ว</span>
          </div>
        </div>
        
        <div class="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm mb-5">
          <h5 class="text-xs font-black text-slate-400 mb-4 border-b border-slate-100 pb-3 uppercase tracking-wider">รายการอาหารที่สั่ง</h5>
          ${itemsListHtml}
          <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-100 bg-slate-50 -mx-5 -mb-5 p-5 rounded-b-[1.5rem]">
            <span class="text-xs text-slate-500 font-bold">ความเผ็ด: <span class="font-black text-orange-600 bg-orange-100 px-2 py-1 rounded-md ml-1">${order.spiciness}</span></span>
            <span class="text-sm font-bold text-slate-500">ยอดรวม <span class="text-xl font-black text-slate-800 ml-1">${order.totalPrice} ฿</span></span>
          </div>
        </div>
        
        ${sLevel === 3 ? `<button onclick="receiveOrder()" class="w-full mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black text-lg py-4 rounded-[1.5rem] shadow-lg shadow-green-500/40 animate-bounce">👉 กดเมื่อรับอาหารแล้ว</button>` : ''}
      </div>`;
      qCard.innerHTML = html;
    }

    function startPollingQueue() {
      if(pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(async () => {
        const order = JSON.parse(localStorage.getItem('my_order_details'));
        if (!order || order.status === 'Done') { clearInterval(pollingInterval); return; }
        
        try {
          const res = await fetch(GAS_URL, {
            method: 'POST', redirect: 'follow', headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: 'checkStatus', orderId: order.orderId })
          });
          const statusData = await res.json();
          
          if(statusData.found) {
            // ถ้าระบบเปลี่ยนสถานะเป็น Ready ให้เล่นเสียงและแสดงแจ้งเตือน
            if(order.status !== statusData.status && statusData.status === 'Ready') {
              document.getElementById('ready-sound').play().catch(e => console.log('Autoplay blocked by browser'));
              Swal.fire({ 
                icon: 'success', title: 'อาหารเสร็จแล้ว! 🎉', 
                text: `ออเดอร์ ${order.orderId} ของคุณพร้อมเสิร์ฟแล้วครับ`, 
                confirmButtonText: 'รับทราบ', confirmButtonColor: '#22c55e',
                customClass: { confirmButton: 'font-bold rounded-xl py-3 px-6' }
              });
            }
            order.status = statusData.status;
            order.queueAhead = statusData.queueAhead;
            localStorage.setItem('my_order_details', JSON.stringify(order));
            if(document.getElementById('view-queue').classList.contains('hidden') === false) renderMyQueue();
          }
        } catch(e) { console.log('Polling error'); }
      }, 10000);
    }

    function receiveOrder() {
      let order = JSON.parse(localStorage.getItem('my_order_details'));
      order.status = 'Done'; localStorage.setItem('my_order_details', JSON.stringify(order));
      clearInterval(pollingInterval); renderMyQueue();
      Toast.fire({ icon: 'success', title: 'ทานให้อร่อยนะครับ! 😋' });
    }

    function switchTab(tab) {
      document.getElementById('view-menu').classList.toggle('hidden', tab !== 'menu'); document.getElementById('view-queue').classList.toggle('hidden', tab !== 'queue');
      document.getElementById('tab-menu').className = tab === 'menu' ? "flex-1 py-3 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-lg transition-all active:scale-95" : "flex-1 py-3 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95";
      document.getElementById('tab-queue').className = tab === 'queue' ? "flex-1 py-3 rounded-xl text-xs font-bold bg-zinc-900 text-orange-400 shadow-lg transition-all active:scale-95" : "flex-1 py-3 rounded-xl text-xs font-bold text-zinc-400 hover:text-white transition-all active:scale-95";
      if (tab === 'queue') renderMyQueue();
    }

    function toggleCart() { document.getElementById('cart-bar').classList.toggle('translate-y-full'); }
    function setSpice(level) { spiciness = level; ['ไม่เผ็ด', 'เผ็ดกลาง', 'เผ็ดมาก'].forEach(l => { document.getElementById(`sp-${l}`).className = l === level ? "flex-1 py-3 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 text-xs font-black shadow-sm transition-all active:scale-95" : "flex-1 py-3 rounded-2xl bg-white border-2 border-slate-100 text-xs font-bold text-slate-500 transition-all active:scale-95"; }); }
    function setPayment(method) { paymentMethod = method; ['เงินโอน', 'เงินสด'].forEach(m => { document.getElementById(`pay-${m}`).className = m === method ? "flex-1 py-3.5 rounded-2xl border-2 border-orange-500 bg-orange-50 text-orange-600 font-black text-sm shadow-sm transition-all active:scale-95 flex justify-center items-center gap-2" : "flex-1 py-3.5 rounded-2xl bg-white text-slate-500 font-bold text-sm border-2 border-slate-100 transition-all active:scale-95 flex justify-center items-center gap-2"; }); checkSubmitReady(); }

    window.onload = () => { fetchMenu(); startPollingQueue(); };
  </script>
</body>
</html>
