<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mala Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white p-4 font-sans min-h-screen">

  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-amber-500">👨‍🍳 ครัวหมาล่า (Kitchen)</h1>
      <button onclick="loadAdminOrders()" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded text-sm hover:bg-slate-700 transition">🔄 รีเฟรช</button>
    </div>

    <!-- แผงแสดงออเดอร์ที่กำลังดำเนินการ -->
    <div id="adminOrders" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-slate-500 col-span-full text-center py-10">กำลังโหลดข้อมูลออเดอร์...</p>
    </div>
  </div>

  <script>
    // ⚠️ ใส่ URL ของ Google Apps Script ตรงนี้ (เหมือนกับไฟล์ index.html)
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";

    async function loadAdminOrders() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        
        // ดึงมาเฉพาะออเดอร์ที่ยังไม่เสร็จ (Pending และ Cooking)
        const active = data.orders.filter(o => o.status === 'Pending' || o.status === 'Cooking');
        
        const container = document.getElementById('adminOrders');
        container.innerHTML = '';
        
        if (active.length === 0) {
          container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">🎉 ไม่มีออเดอร์ค้างในขณะนี้</p>`;
          return;
        }

        active.forEach(o => {
          const isCooking = o.status === 'Cooking';
          container.innerHTML += `
            <div class="bg-slate-800 border ${isCooking ? 'border-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.2)]' : 'border-slate-700'} rounded-xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-3">
                  <span class="text-3xl font-black ${isCooking ? 'text-amber-400' : 'text-slate-300'}">${o.orderId}</span>
                  <span class="bg-red-900 text-red-200 text-xs px-2.5 py-1.5 rounded font-bold">🌶️ ${o.spiciness}</span>
                </div>
                <p class="font-bold text-lg mb-2">${o.customerName} <span class="text-sm text-slate-400 font-normal">(${o.phone})</span></p>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-sm text-slate-300 min-h-[5rem] whitespace-pre-wrap">
                  ${o.items}
                </div>
                <p class="text-right text-emerald-400 font-bold mt-3 text-lg">ยอดโอน: ${o.totalPrice} ฿</p>
              </div>
              
              <div class="mt-5 grid grid-cols-1 gap-2">
                ${!isCooking ? 
                  `<button onclick="updateStatus('${o.orderId}', 'Cooking')" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">🔥 รับออเดอร์ (เริ่มทอด)</button>` : 
                  `<button onclick="updateStatus('${o.orderId}', 'Completed')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition">✅ ทอดเสร็จแล้ว (ให้ลูกค้ามารับ)</button>`
                }
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Error loading admin orders", err);
      }
    }

    async function updateStatus(orderId, newStatus) {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, newStatus: newStatus })
        });
        loadAdminOrders(); // รีเฟรชหน้าจอทันทีเมื่ออัปเดตเสร็จ
      } catch (err) { 
        alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ!'); 
      }
    }

    // โหลดข้อมูลครั้งแรก และตั้งเวลาให้อัปเดตอัตโนมัติทุก 8 วินาที
    loadAdminOrders();
    setInterval(loadAdminOrders, 8000);
  </script>
</body>
</html>
