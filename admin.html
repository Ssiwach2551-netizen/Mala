<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการออเดอร์ - ล่าหมามาแดก (KDS Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Top Header Nav -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-xl shadow-md shadow-orange-500/30">🍳</div>
        <div>
          <h1 class="text-lg font-black tracking-wide flex items-center gap-2">
            ล่าหมามาแดก <span class="bg-orange-500/20 text-orange-400 text-[10px] px-2 py-0.5 rounded-md border border-orange-500/30 font-bold">KDS LIVE</span>
          </h1>
          <p class="text-[11px] text-slate-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            อัปเดตอัตโนมัติทุก 10 วินาที
          </p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="soundToggleBtn" onclick="toggleSoundPermission()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold transition-all border border-slate-700 flex items-center gap-1.5">
          🔔 เปิดระบบเสียง
        </button>
        <button onclick="fetchOrders(true)" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-extrabold transition-all shadow-md active:scale-95 flex items-center gap-1.5">
          <span id="refreshIcon">🔄</span> รีเฟรช
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-4 lg:p-6 max-w-7xl mx-auto w-full space-y-5">
    
    <!-- Quick Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-bold">รอปรุงอาหาร</p>
          <p id="stat-pending" class="text-2xl font-black text-amber-500">0</p>
        </div>
        <div class="w-9 h-9 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-base">📝</div>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-bold">กำลังปรุง</p>
          <p id="stat-cooking" class="text-2xl font-black text-blue-500">0</p>
        </div>
        <div class="w-9 h-9 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-base">🔥</div>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-bold">พร้อมเสิร์ฟ</p>
          <p id="stat-ready" class="text-2xl font-black text-emerald-500">0</p>
        </div>
        <div class="w-9 h-9 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center text-base">🔔</div>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400 font-bold">ออเดอร์ทั้งหมด</p>
          <p id="stat-total" class="text-2xl font-black text-slate-700">0</p>
        </div>
        <div class="w-9 h-9 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-base">📊</div>
      </div>
    </div>

    <!-- Kanban Board Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
      
      <!-- Column 1: Pending -->
      <div class="bg-slate-100/70 rounded-3xl border border-slate-200/80 p-3.5 flex flex-col max-h-[calc(100vh-220px)]">
        <div class="bg-amber-500 text-white px-4 py-3 rounded-2xl mb-3 shadow-md shadow-amber-500/20 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="text-lg">📝</span>
            <h2 class="font-extrabold text-sm tracking-wide">ออเดอร์ใหม่ (Pending)</h2>
          </div>
          <span id="badge-Pending" class="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
        </div>
        <div id="col-Pending" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[400px]"></div>
      </div>

      <!-- Column 2: Cooking -->
      <div class="bg-slate-100/70 rounded-3xl border border-slate-200/80 p-3.5 flex flex-col max-h-[calc(100vh-220px)]">
        <div class="bg-blue-600 text-white px-4 py-3 rounded-2xl mb-3 shadow-md shadow-blue-600/20 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="text-lg">🍳</span>
            <h2 class="font-extrabold text-sm tracking-wide">กำลังปรุง (Cooking)</h2>
          </div>
          <span id="badge-Cooking" class="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
        </div>
        <div id="col-Cooking" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[400px]"></div>
      </div>

      <!-- Column 3: Ready -->
      <div class="bg-slate-100/70 rounded-3xl border border-slate-200/80 p-3.5 flex flex-col max-h-[calc(100vh-220px)]">
        <div class="bg-emerald-600 text-white px-4 py-3 rounded-2xl mb-3 shadow-md shadow-emerald-600/20 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="text-lg">🔔</span>
            <h2 class="font-extrabold text-sm tracking-wide">พร้อมเสิร์ฟ (Ready)</h2>
          </div>
          <span id="badge-Ready" class="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-black">0</span>
        </div>
        <div id="col-Ready" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[400px]"></div>
      </div>

    </div>
  </main>

  <audio id="newOrderSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    
    let currentOrders = [];
    let previousPendingCount = 0;
    let isSoundUnlocked = false;

    window.onload = () => {
      fetchOrders();
      setInterval(fetchOrders, 10000);

      document.body.addEventListener('click', unlockAudio, { once: true });
    };

    function unlockAudio() {
      const audio = document.getElementById('newOrderSound');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        isSoundUnlocked = true;
        document.getElementById('soundToggleBtn').innerHTML = '🔔 เปิดเสียงเรียบร้อย';
        document.getElementById('soundToggleBtn').classList.replace('bg-slate-800', 'bg-emerald-800/60');
      }).catch(() => {});
    }

    function toggleSoundPermission() {
      unlockAudio();
      Swal.fire({
        icon: 'success',
        title: 'ตั้งค่าระบบเสียงสำเร็จ',
        text: 'เมื่อมีออเดอร์ใหม่เข้ามา เสียงแจ้งเตือนจะดังอัตโนมัติ',
        timer: 1800,
        showConfirmButton: false
      });
    }

    async function fetchOrders(showSpinner = false) {
      if (showSpinner) {
        document.getElementById('refreshIcon').classList.add('animate-spin');
      }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getAdminOrders' })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
          currentOrders = data.orders || [];
          renderOrders();
          checkNewOrders();
        }
      } catch (e) {
        console.error('Error fetching orders:', e);
      } finally {
        if (showSpinner) {
          setTimeout(() => document.getElementById('refreshIcon').classList.remove('animate-spin'), 500);
        }
      }
    }

    function checkNewOrders() {
      const pendingCount = currentOrders.filter(o => o.status === 'Pending').length;
      if (pendingCount > previousPendingCount && previousPendingCount !== 0) {
        document.getElementById('newOrderSound').play().catch(e => console.log(e));
      }
      previousPendingCount = pendingCount;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(Number(timestamp));
      if (isNaN(date.getTime())) return '';
      return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
    }

    function renderOrders() {
      const cols = { 'Pending': '', 'Cooking': '', 'Ready': '' };
      const counts = { 'Pending': 0, 'Cooking': 0, 'Ready': 0 };

      currentOrders.forEach(order => {
        if (cols[order.status] === undefined) return;

        counts[order.status]++;

        const isTransfer = (order.paymentMethod === 'เงินโอน' || order.paymentMethod === 'Paid');
        const isPaid = (order.paymentStatus === 'Paid');
        const formattedTime = formatTime(order.timestamp);

        // Badge สถานะชำระเงิน
        let paymentBadge = '';
        if (isTransfer) {
          if (isPaid) {
            paymentBadge = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] px-2 py-0.5 rounded-md font-bold">💳 โอนแล้ว</span>`;
          } else {
            paymentBadge = `<span class="bg-amber-50 text-amber-700 border border-amber-200 text-[10px] px-2 py-0.5 rounded-md font-bold">💳 รอตรวจสอบโอน</span>`;
          }
        } else {
          paymentBadge = `<span class="bg-slate-100 text-slate-700 border border-slate-200 text-[10px] px-2 py-0.5 rounded-md font-bold">💵 เงินสด</span>`;
        }

        // ปุ่มดูสลิป
        const slipBtn = isTransfer && order.slipImage 
          ? `<button onclick="viewSlip('${order.orderId}')" class="mt-2.5 w-full bg-slate-900 hover:bg-slate-800 text-white text-xs py-2 rounded-xl font-bold flex items-center justify-center gap-1.5 transition-all active:scale-95 shadow-sm">📸 ดูสลิปโอนเงิน</button>` 
          : (isTransfer ? `<div class="mt-2.5 text-center text-[11px] font-bold text-amber-600 bg-amber-50/80 py-1.5 rounded-xl border border-amber-200">⏳ ยังไม่แนบสลิป</div>` : '');

        // ปุ่มดำเนินการตามสถานะ
        let actionButton = '';
        if (order.status === 'Pending') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Cooking')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1">🍳 เริ่มปรุงอาหาร ➔</button>`;
        } else if (order.status === 'Cooking') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Ready')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-2.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-1">🔔 ปรุงเสร็จแล้ว ➔</button>`;
        } else if (order.status === 'Ready') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Completed')" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold text-xs py-2.5 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-1">✅ ลูกค้ารับอาหารแล้ว</button>`;
        }

        const card = `
          <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md transition-all space-y-3 relative group">
            
            <!-- Card Header -->
            <div class="flex justify-between items-start pb-2 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="bg-slate-900 text-white text-xs font-black px-2.5 py-1 rounded-lg tracking-wide">${order.orderId}</span>
                ${paymentBadge}
              </div>
              <div class="text-right">
                <span class="text-base font-black text-red-600">${order.totalPrice} ฿</span>
                ${formattedTime ? `<p class="text-[10px] text-slate-400 font-semibold">${formattedTime}</p>` : ''}
              </div>
            </div>

            <!-- Customer Info -->
            <div class="flex justify-between items-center">
              <div>
                <p class="font-bold text-sm text-slate-800">👤 ${order.studentName || 'ไม่ระบุชื่อ'}</p>
              </div>
              <span class="text-[11px] text-red-600 font-extrabold bg-red-50 border border-red-100 px-2 py-0.5 rounded-md">🌶️ ${order.spiciness || 'ปกติ'}</span>
            </div>

            <!-- Order Items -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs font-medium text-slate-700 whitespace-pre-wrap leading-relaxed">
              ${order.items}
            </div>

            ${slipBtn}

            <!-- Card Actions -->
            <div class="pt-1 flex items-center gap-2">
              <div class="flex-1">${actionButton}</div>
              <button onclick="cancelOrder('${order.orderId}')" title="ยกเลิกออเดอร์" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all">
                🗑️
              </button>
            </div>
          </div>
        `;

        cols[order.status] += card;
      });

      // Update Column Counters
      document.getElementById('badge-Pending').innerText = counts['Pending'];
      document.getElementById('badge-Cooking').innerText = counts['Cooking'];
      document.getElementById('badge-Ready').innerText = counts['Ready'];

      document.getElementById('stat-pending').innerText = counts['Pending'];
      document.getElementById('stat-cooking').innerText = counts['Cooking'];
      document.getElementById('stat-ready').innerText = counts['Ready'];
      document.getElementById('stat-total').innerText = currentOrders.length;

      // Empty states
      const emptyState = (text) => `<div class="h-40 flex flex-col items-center justify-center text-slate-400 text-xs font-bold gap-2"><span class="text-2xl">🍃</span>${text}</div>`;

      document.getElementById('col-Pending').innerHTML = cols['Pending'] || emptyState('ไม่มีออเดอร์ใหม่');
      document.getElementById('col-Cooking').innerHTML = cols['Cooking'] || emptyState('ไม่มีรายการกำลังปรุง');
      document.getElementById('col-Ready').innerHTML = cols['Ready'] || emptyState('ไม่มีรายการรอรับ');
    }

    function viewSlip(orderId) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order && order.slipImage) {
        Swal.fire({
          title: `สลิปโอนเงิน #${orderId}`,
          html: `<p class="text-xs text-slate-500 mb-3">ลูกค้า: <b>${order.studentName}</b> | ยอด: <b>${order.totalPrice} ฿</b></p>`,
          imageUrl: order.slipImage,
          imageAlt: 'สลิปโอนเงิน',
          imageStyle: 'max-height: 420px; border-radius: 1rem; object-fit: contain;',
          showCancelButton: true,
          confirmButtonText: '✅ ยืนยันยอดโอนถูกต้อง',
          cancelButtonText: 'ปิด',
          confirmButtonColor: '#10b981',
          cancelButtonColor: '#64748b'
        }).then((res) => {
          if (res.isConfirmed) {
            changePaymentStatus(orderId, 'Paid');
          }
        });
      } else {
        Swal.fire('ข้อผิดพลาด', 'ไม่พบรูปสลิปของออเดอร์นี้', 'error');
      }
    }

    async function changePaymentStatus(orderId, status) {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, type: 'payment', value: status })
        });
        const order = currentOrders.find(o => o.orderId === orderId);
        if (order) order.paymentStatus = status;
        renderOrders();
        Swal.fire({ icon: 'success', title: 'อัปเดตการชำระเงินแล้ว', timer: 1200, showConfirmButton: false });
      } catch (e) {
        Swal.fire('Error', 'ไม่สามารถอัปเดตได้', 'error');
      }
    }

    async function changeStatus(orderId, newStatus) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order) order.status = newStatus;
      renderOrders();

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, newStatus: newStatus })
        });
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'อัปเดตสถานะไม่สำเร็จ', 'error');
        fetchOrders();
      }
    }

    async function cancelOrder(orderId) {
      const res = await Swal.fire({
        title: `ยกเลิกออเดอร์ #${orderId}?`,
        text: 'การยกเลิกจะคืนสต๊อกสินค้าเข้าสู่ระบบอัตโนมัติ',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ยืนยันยกเลิก',
        cancelButtonText: 'ถอยกลับ',
        confirmButtonColor: '#ef4444'
      });

      if (res.isConfirmed) {
        changeStatus(orderId, 'Cancelled');
      }
    }
  </script>
</body>
</html>
