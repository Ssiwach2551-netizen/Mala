<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแม่ค้า| ล่าหมามาแดก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #F3F4F6; color: #1F2937; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold">จัดการออเดอร์</h1>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm text-gray-500" id="last-update">อัปเดตล่าสุด: กำลังโหลด...</span>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-gray-50 text-gray-600 border-b">
                    <tr>
                        <th class="px-4 py-3 font-medium">ชื่อ/ห้อง</th>
                        <th class="px-4 py-3 font-medium">รายการอาหาร</th>
                        <th class="px-4 py-3 font-medium">ยอด/ชำระเงิน</th>
                        <th class="px-4 py-3 font-medium">สถานะ</th>
                        <th class="px-4 py-3 font-medium">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="admin-orders" class="divide-y divide-gray-100">
                    <tr><td colspan="5" class="text-center py-8 text-gray-500">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwYPwixCzaWRagRdkkfO3Na3z62MBtfaJaCzJh5ZN0WA3eTgdakM68pEiLRQMOjHFC3fQ/exec';
        let lastOrderCount = 0;
        const alertSound = new Audio('https://files.catbox.moe/7s5kwu.mp3');

        async function fetchOrders() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'getOrders'}) });
                const data = await res.json();
                
                if(data.status === 'success') {
                    // กรองเฉพาะออเดอร์ที่ยังไม่เสร็จ (หรือต้องการแสดงทั้งหมด ให้เอา .filter ออก)
                    const activeOrders = data.data.filter(o => o.Status !== 'เสร็จแล้วมารับได้').reverse();
                    
                    if(activeOrders.length > lastOrderCount && lastOrderCount !== 0) {
                        alertSound.play();
                        Swal.fire({toast: true, position: 'top-end', icon: 'info', title: 'มีออเดอร์ใหม่เข้า!', showConfirmButton: false, timer: 3000});
                    }
                    lastOrderCount = activeOrders.length;
                    
                    renderOrders(activeOrders);
                    
                    const now = new Date();
                    document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} น.`;
                }
            } catch (error) {
                console.error("Error fetching orders");
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('admin-orders');
            tbody.innerHTML = '';
            
            if(orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">ไม่มีออเดอร์ค้างอยู่</td></tr>';
                return;
            }

            orders.forEach(order => {
                let itemsHtml = '';
                try {
                    const items = JSON.parse(order.Items);
                    itemsHtml = items.map(i => `${i.name} (x${i.qty})`).join('<br>');
                } catch(e) { itemsHtml = order.Items; }

                let slipBtn = '';
                if(order['Slip URL']) {
                    slipBtn = `<a href="${order['Slip URL']}" target="_blank" class="text-blue-500 underline text-xs block mt-1">ดูสลิป</a>`;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-4">
                            <div class="font-medium">${order.nikeName}</div>
                            <div class="text-gray-500 text-xs">ห้อง ${order.Class}</div>
                        </td>
                        <td class="px-4 py-4 whitespace-normal">
                            ${itemsHtml}
                            <div class="text-red-500 text-xs mt-1">🌶 ${order.Spiciness}</div>
                        </td>
                        <td class="px-4 py-4">
                            <div class="font-medium">฿${order.TotalPrice}</div>
                            <div class="text-gray-500 text-xs">${order.PaymentMethod}</div>
                            ${slipBtn}
                        </td>
                        <td class="px-4 py-4">
                            <span class="px-2 py-1 rounded-full text-xs font-medium 
                                ${order.Status === 'รอรับออเดอร์' ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'}">
                                ${order.Status}
                            </span>
                        </td>
                        <td class="px-4 py-4 flex gap-2">
                            ${order.Status === 'รอรับออเดอร์' 
                                ? `<button onclick="updateStatus('${order.OrderID}', 'กำลังทอด')" class="bg-gray-900 text-white px-3 py-1.5 rounded text-xs hover:bg-gray-800">รับออเดอร์ & ทอด</button>` 
                                : `<button onclick="updateStatus('${order.OrderID}', 'เสร็จแล้วมารับได้')" class="bg-green-500 text-white px-3 py-1.5 rounded text-xs hover:bg-green-600">เสร็จแล้ว</button>`
                            }
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatus(orderId, newStatus) {
            Swal.fire({title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateStatus', orderId: orderId, newStatus: newStatus })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    Swal.fire({toast: true, position: 'top-end', icon: 'success', title: 'อัปเดตสถานะสำเร็จ', showConfirmButton: false, timer: 1500});
                    fetchOrders();
                }
            } catch (err) {
                Swal.fire('Error', 'อัปเดตไม่สำเร็จ', 'error');
            }
        }

        // โหลดครั้งแรก และดึงข้อมูลใหม่ทุกๆ 10 วินาที
        fetchOrders();
        setInterval(fetchOrders, 10000);
    </script>
</body>
</html>
