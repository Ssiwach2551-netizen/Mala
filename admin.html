<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - หน้าจอแม่ค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.5rem !important; }
  </style>
</head>
<body class="text-slate-800">

  <!-- Header -->
  <div class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-black">👨‍🍳 จัดการออเดอร์ (Mala Admin)</h1>
      <p class="text-xs text-slate-400">อัปเดตอัตโนมัติทุกๆ 10 วินาที</p>
    </div>
    <div class="flex gap-2">
      <button onclick="fetchOrders()" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-xl text-sm font-bold transition-all">
        🔄 รีเฟรช
      </button>
    </div>
  </div>

  <!-- Board -->
  <div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto items-start">
    
    <!-- Column: ออเดอร์ใหม่ -->
    <div class="bg-orange-100 rounded-3xl p-4 shadow-sm border border-orange-200 min-h-[500px]">
      <div class="bg-orange-500 text-white font-black text-center py-2 rounded-2xl mb-4 shadow-sm">📝 ออเดอร์ใหม่ (Pending)</div>
      <div id="col-Pending" class="space-y-3"></div>
    </div>

    <!-- Column: กำลังทำ -->
    <div class="bg-blue-100 rounded-3xl p-4 shadow-sm border border-blue-200 min-h-[500px]">
      <div class="bg-blue-500 text-white font-black text-center py-2 rounded-2xl mb-4 shadow-sm">🍳 กำลังทอด(Cooking)</div>
      <div id="col-Cooking" class="space-y-3"></div>
    </div>

    <!-- Column: พร้อมเสิร์ฟ -->
    <div class="bg-emerald-100 rounded-3xl p-4 shadow-sm border border-emerald-200 min-h-[500px]">
      <div class="bg-emerald-500 text-white font-black text-center py-2 rounded-2xl mb-4 shadow-sm">🔔 พร้อมเสิร์ฟ (Ready)</div>
      <div id="col-Ready" class="space-y-3"></div>
    </div>

  </div>

  <!-- เสียงเตือนออเดอร์ใหม่ -->
  <audio id="newOrderSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; // 👈 วางลิงก์ Web App ตรงนี้
    
    let currentOrders = [];
    let previousPendingCount = 0;

    // เริ่มการทำงานและดึงข้อมูลทุกๆ 10 วินาที
    window.onload = () => {
      fetchOrders();
      setInterval(fetchOrders, 10000);
      
      // ปลดล็อกเสียงเมื่อคลิกครั้งแรก (นโยบายเบราว์เซอร์)
      document.body.addEventListener('click', () => {
        document.getElementById('newOrderSound').play().catch(()=>{});
        document.getElementById('newOrderSound').pause();
      }, { once: true });
    };

    async function fetchOrders() {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getAdminOrders' })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
          currentOrders = data.orders;
          renderOrders();
          checkNewOrders();
        }
      } catch (e) {
        console.error('Error fetching orders:', e);
      }
    }

    function checkNewOrders() {
      const pendingCount = currentOrders.filter(o => o.status === 'Pending').length;
      if (pendingCount > previousPendingCount) {
        document.getElementById('newOrderSound').play().catch(e=>console.log(e));
      }
      previousPendingCount = pendingCount;
    }

    function renderOrders() {
      const cols = { 'Pending': '', 'Cooking': '', 'Ready': '' };

      currentOrders.forEach(order => {
        if (!cols[order.status] && cols[order.status] !== '') return; // ข้ามถ้าสถานะไม่ตรงกับคอลัมน์

        const isTransferred = (order.paymentMethod === 'เงินโอน' || order.paymentMethod === 'Paid');
        
        const slipButton = isTransferred && order.slipImage 
          ? `<button onclick="viewSlip('${order.orderId}')" class="mt-2 w-full bg-slate-800 text-white text-xs py-2 rounded-xl font-bold flex items-center justify-center gap-1 hover:bg-slate-700">📸 ดูสลิปโอนเงิน</button>` 
          : `<div class="mt-2 text-center text-xs font-bold text-orange-600 bg-orange-100 py-2 rounded-xl border border-orange-200">จ่ายเงินสด / รอสลิป</div>`;

        let actionButton = '';
        if (order.status === 'Pending') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Cooking')" class="mt-3 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow-md transition-all">➡️ เริ่มปรุงอาหาร</button>`;
        } else if (order.status === 'Cooking') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Ready')" class="mt-3 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow-md transition-all">✅ ปรุงเสร็จแล้ว</button>`;
        } else if (order.status === 'Ready') {
          actionButton = `<button onclick="changeStatus('${order.orderId}', 'Completed')" class="mt-3 w-full bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-2.5 rounded-xl shadow-md transition-all">ลูกค้ารับแล้ว (ลบออก)</button>`;
        }

        const card = `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-start mb-2">
              <span class="bg-slate-100 text-slate-800 text-xs font-black px-2 py-1 rounded-lg">#${order.orderId}</span>
              <span class="text-lg font-black text-red-500">${order.totalPrice} ฿</span>
            </div>
            
            <p class="font-bold text-sm text-slate-800">👤 ${order.studentName} (${order.class})</p>
            <p class="text-xs text-red-600 font-bold bg-red-50 inline-block px-2 py-1 rounded-md mt-1 mb-2">🌶️ ${order.spiciness}</p>
            
            <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 text-sm text-slate-600 mb-2 whitespace-pre-wrap leading-relaxed">${order.items}</div>
            
            ${slipButton}
            ${actionButton}
          </div>
        `;

        cols[order.status] += card;
      });

      document.getElementById('col-Pending').innerHTML = cols['Pending'] || '<p class="text-center text-sm text-slate-400 mt-4">ไม่มีรายการ</p>';
      document.getElementById('col-Cooking').innerHTML = cols['Cooking'] || '<p class="text-center text-sm text-slate-400 mt-4">ไม่มีรายการ</p>';
      document.getElementById('col-Ready').innerHTML = cols['Ready'] || '<p class="text-center text-sm text-slate-400 mt-4">ไม่มีรายการ</p>';
    }

    // แสดงรูปสลิป
    function viewSlip(orderId) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order && order.slipImage) {
        Swal.fire({
          title: 'สลิปโอนเงิน',
          html: `<p class="mb-2 font-bold text-sm text-slate-600">ออเดอร์: ${orderId}</p>`,
          imageUrl: order.slipImage,
          imageAlt: 'Slip Image',
          confirmButtonText: 'ปิดรูปภาพ'
        });
      } else {
        Swal.fire('ข้อผิดพลาด', 'ไม่พบรูปสลิปของออเดอร์นี้', 'error');
      }
    }

    // เปลี่ยนสถานะออเดอร์
    async function changeStatus(orderId, newStatus) {
      // อัปเดต UI ทันทีเพื่อให้ดูไวขึ้น (Optimistic UI)
      const order = currentOrders.find(o => o.orderId === orderId);
      if(order) order.status = newStatus;
      renderOrders();

      // ส่งคำสั่งไปอัปเดตใน Google Sheet
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, newStatus: newStatus })
        });
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'อัปเดตสถานะไม่สำเร็จ กรุณาลองใหม่', 'error');
        fetchOrders(); // โหลดใหม่ถ้าผิดพลาด
      }
    }
  </script>
</body>
</html>
