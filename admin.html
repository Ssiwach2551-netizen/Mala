<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ล่าหมามาแดก - Executive KDS & Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #f1f5f9; }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1.25rem !important; background: #182232 !important; color: #fff !important; }
    .glass-card { background: rgba(24, 34, 50, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.07); }
    .glass-nav { background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

  <!-- Header Nav -->
  <header class="glass-nav sticky top-0 z-40">
    <div class="max-w-[1600px] mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 font-black text-xl">
          🔥
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold tracking-tight text-white">ล่าหมามาแดก</h1>
            <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Executive KDS</span>
          </div>
          <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Auto Refresh Active
          </p>
        </div>
      </div>

      <!-- Center KPI Quick Stats -->
      <div class="hidden md:flex items-center gap-6 bg-slate-900/80 px-5 py-2 rounded-2xl border border-slate-800">
        <div class="text-center">
          <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">รอปรุง</p>
          <p id="kpi-pending" class="text-base font-bold text-amber-400">0</p>
        </div>
        <div class="w-px h-6 bg-slate-800"></div>
        <div class="text-center">
          <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">กำลังทำ</p>
          <p id="kpi-cooking" class="text-base font-bold text-blue-400">0</p>
        </div>
        <div class="w-px h-6 bg-slate-800"></div>
        <div class="text-center">
          <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">พร้อมเสิร์ฟ</p>
          <p id="kpi-ready" class="text-base font-bold text-emerald-400">0</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button onclick="openStockModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 active:scale-95">
          <span>📦</span> จัดการสต๊อก
        </button>
        <button onclick="fetchData(true)" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-lg shadow-amber-500/10 flex items-center gap-2 active:scale-95">
          <span id="refreshIcon">🔄</span> รีเฟรช
        </button>
      </div>
    </div>
  </header>

  <!-- Kanban Grid Layout -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
    
    <!-- Pending Column -->
    <div class="glass-card rounded-2xl p-4 flex flex-col max-h-[calc(100vh-140px)]">
      <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">ออเดอร์ใหม่</h2>
        </div>
        <span id="badge-Pending" class="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">0</span>
      </div>
      <div id="col-Pending" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[500px]"></div>
    </div>

    <!-- Cooking Column -->
    <div class="glass-card rounded-2xl p-4 flex flex-col max-h-[calc(100vh-140px)]">
      <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-pulse"></span>
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">กำลังปรุงอาหาร</h2>
        </div>
        <span id="badge-Cooking" class="text-xs font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20">0</span>
      </div>
      <div id="col-Cooking" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[500px]"></div>
    </div>

    <!-- Ready Column -->
    <div class="glass-card rounded-2xl p-4 flex flex-col max-h-[calc(100vh-140px)]">
      <div class="flex justify-between items-center pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">พร้อมเสิร์ฟ</h2>
        </div>
        <span id="badge-Ready" class="text-xs font-bold px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">0</span>
      </div>
      <div id="col-Ready" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1 min-h-[500px]"></div>
    </div>

  </main>

  <!-- Modal: Stock Management -->
  <div id="stockModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="glass-card w-full max-w-2xl rounded-2xl border border-slate-800 overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">📦</div>
          <div>
            <h3 class="font-bold text-white text-base">จัดการสต๊อกสินค้า</h3>
            <p class="text-xs text-slate-400">อัปเดตจำนวนสินค้าที่เหลือในระบบ</p>
          </div>
        </div>
        <button onclick="closeStockModal()" class="text-slate-400 hover:text-white p-2 text-lg">✕</button>
      </div>
      
      <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-3" id="menuStockList">
        <p class="text-center text-slate-500 text-sm py-8">กำลังโหลดข้อมูลเมนู...</p>
      </div>

      <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-end">
        <button onclick="closeStockModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-5 py-2.5 rounded-xl transition-all">
          ปิดหน้าต่าง
        </button>
      </div>
    </div>
  </div>

  <audio id="newOrderSound" src="https://files.catbox.moe/7s5kwu.mp3" preload="auto"></audio>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec";
    
    let currentOrders = [];
    let currentMenus = [];
    let previousPendingCount = 0;

    window.onload = () => {
      fetchData();
      setInterval(fetchData, 10000);
      document.body.addEventListener('click', () => {
        const audio = document.getElementById('newOrderSound');
        audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(()=>{});
      }, { once: true });
    };

    async function fetchData(showSpinner = false) {
      if (showSpinner) document.getElementById('refreshIcon').classList.add('animate-spin');

      try {
        // Fetch Admin Orders
        const resOrders = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getAdminOrders' })
        });
        const dataOrders = await resOrders.json();
        if (dataOrders.status === 'success') {
          currentOrders = dataOrders.orders || [];
          renderOrders();
          checkNewOrders();
        }

        // Fetch Menus (for stock)
        const resMenu = await fetch(GAS_URL);
        const dataMenu = await resMenu.json();
        if (dataMenu.menus) {
          currentMenus = dataMenu.menus;
        }
      } catch (e) {
        console.error('Error fetching data:', e);
      } finally {
        if (showSpinner) setTimeout(() => document.getElementById('refreshIcon').classList.remove('animate-spin'), 400);
      }
    }

    function checkNewOrders() {
      const pendingCount = currentOrders.filter(o => o.status === 'Pending').length;
      if (pendingCount > previousPendingCount && previousPendingCount !== 0) {
        document.getElementById('newOrderSound').play().catch(()=>{});
      }
      previousPendingCount = pendingCount;
    }

    function renderOrders() {
      const cols = { 'Pending': '', 'Cooking': '', 'Ready': '' };
      const counts = { 'Pending': 0, 'Cooking': 0, 'Ready': 0 };

      currentOrders.forEach(order => {
        if (cols[order.status] === undefined) return;
        counts[order.status]++;

        const isTransfer = (order.paymentMethod === 'เงินโอน' || order.paymentMethod === 'Paid');
        const isPaid = (order.paymentStatus === 'Paid');
        
        // Badge การชำระเงิน
        let payBadge = isTransfer
          ? (isPaid 
              ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">โอนแล้ว</span>`
              : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">รอตรวจสลิป</span>`)
          : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">เงินสด</span>`;

        // ปุ่มดูสลิป
        const slipBtn = isTransfer && order.slipImage 
          ? `<button onclick="viewSlip('${order.orderId}')" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-xl border border-slate-700 font-medium transition-all flex items-center justify-center gap-1.5">📸 ตรวจสลิปโอนเงิน</button>`
          : (isTransfer ? `<div class="mt-2 text-center text-[11px] text-slate-500 bg-slate-900/40 py-1.5 rounded-xl border border-slate-800">ยังไม่แนบสลิป</div>` : '');

        // ปุ่มเปลี่ยนสถานะ
        let actionBtn = '';
        if (order.status === 'Pending') {
          actionBtn = `<button onclick="changeStatus('${order.orderId}', 'Cooking')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/10">เริ่มปรุงอาหาร ➔</button>`;
        } else if (order.status === 'Cooking') {
          actionBtn = `<button onclick="changeStatus('${order.orderId}', 'Ready')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-emerald-600/10">ปรุงเสร็จแล้ว ➔</button>`;
        } else if (order.status === 'Ready') {
          actionBtn = `<button onclick="changeStatus('${order.orderId}', 'Completed')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs py-2.5 rounded-xl border border-slate-700 transition-all">ลูกค้ารับเรียบร้อย</button>`;
        }

        const card = `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 space-y-3 hover:border-slate-700 transition-all">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-2">
                <span class="text-xs font-black text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">#${order.orderId}</span>
                ${payBadge}
              </div>
              <span class="text-sm font-bold text-white">${order.totalPrice} ฿</span>
            </div>

            <div class="flex justify-between items-center text-xs">
              <span class="font-semibold text-slate-200">👤 ${order.studentName || 'ไม่ระบุชื่อ'}</span>
              <span class="text-amber-400 font-medium bg-amber-500/10 px-2 py-0.5 rounded text-[11px]">🌶️ ${order.spiciness}</span>
            </div>

            <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800/80 text-xs text-slate-300 whitespace-pre-wrap leading-relaxed font-mono">
              ${order.items}
            </div>

            ${slipBtn}

            <div class="flex items-center gap-2 pt-1">
              <div class="flex-1">${actionBtn}</div>
              <button onclick="cancelOrder('${order.orderId}')" title="ยกเลิกออเดอร์" class="p-2 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-xl border border-transparent hover:border-red-500/20 transition-all">
                🗑️
              </button>
            </div>
          </div>
        `;

        cols[order.status] += card;
      });

      // Update counters
      document.getElementById('badge-Pending').innerText = counts['Pending'];
      document.getElementById('badge-Cooking').innerText = counts['Cooking'];
      document.getElementById('badge-Ready').innerText = counts['Ready'];

      document.getElementById('kpi-pending').innerText = counts['Pending'];
      document.getElementById('kpi-cooking').innerText = counts['Cooking'];
      document.getElementById('kpi-ready').innerText = counts['Ready'];

      const empty = (text) => `<div class="h-44 flex flex-col items-center justify-center text-slate-600 text-xs gap-2"><span class="text-xl opacity-40">☕</span>${text}</div>`;
      document.getElementById('col-Pending').innerHTML = cols['Pending'] || empty('ไม่มีออเดอร์ใหม่');
      document.getElementById('col-Cooking').innerHTML = cols['Cooking'] || empty('ไม่มีรายการกำลังปรุง');
      document.getElementById('col-Ready').innerHTML = cols['Ready'] || empty('ไม่มีรายการรอรับ');
    }

    // Modal Stock Controls
    function openStockModal() {
      document.getElementById('stockModal').classList.remove('hidden');
      renderStockList();
    }

    function closeStockModal() {
      document.getElementById('stockModal').classList.add('hidden');
    }

    function renderStockList() {
      const container = document.getElementById('menuStockList');
      if (!currentMenus || currentMenus.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-sm py-8">ไม่พบรายการเมนู</p>`;
        return;
      }

      container.innerHTML = currentMenus.map((item, idx) => `
        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-lg border border-slate-700">🍜</div>
            <div>
              <p class="font-bold text-sm text-white">${item.name}</p>
              <p class="text-xs text-slate-400">${item.category} • <span class="text-amber-400 font-semibold">${item.price} ฿</span></p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="updateStockMemory(${idx}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm border border-slate-700 active:scale-95 transition-all">-</button>
            <input type="number" id="stock-input-${idx}" value="${item.stock}" onchange="updateStockInput(${idx}, this.value)" class="w-16 bg-slate-950 border border-slate-800 rounded-lg text-center font-bold text-sm py-1 text-amber-400 focus:outline-none focus:border-amber-500">
            <button onclick="updateStockMemory(${idx}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm border border-slate-700 active:scale-95 transition-all">+</button>
            <button onclick="saveStockToServer(${idx})" class="ml-2 bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95">
              บันทึก
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateStockMemory(index, delta) {
      let currentVal = Number(currentMenus[index].stock) || 0;
      let newVal = Math.max(0, currentVal + delta);
      currentMenus[index].stock = newVal;
      document.getElementById(`stock-input-${index}`).value = newVal;
    }

    function updateStockInput(index, value) {
      currentMenus[index].stock = Math.max(0, Number(value) || 0);
    }

    async function saveStockToServer(index) {
      const item = currentMenus[index];
      try {
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'updateMenu',
            category: item.category,
            name: item.name,
            price: item.price,
            image: item.image,
            stock: item.stock
          })
        });
        const data = await res.json();
        if (data.status === 'success') {
          Swal.fire({ icon: 'success', title: `อัปเดตสต๊อก ${item.name} เรียบร้อย`, timer: 1200, showConfirmButton: false });
        }
      } catch (e) {
        Swal.fire('Error', 'บันทึกสต๊อกไม่สำเร็จ', 'error');
      }
    }

    // Slip View
    function viewSlip(orderId) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order && order.slipImage) {
        Swal.fire({
          title: `สลิปโอนเงิน #${orderId}`,
          html: `<p class="text-xs text-slate-400 mb-3">ลูกค้า: <b class="text-white">${order.studentName}</b> | ยอด: <b class="text-amber-400">${order.totalPrice} ฿</b></p>`,
          imageUrl: order.slipImage,
          imageAlt: 'สลิปโอนเงิน',
          imageStyle: 'max-height: 400px; border-radius: 0.75rem; object-fit: contain;',
          showCancelButton: true,
          confirmButtonText: '✅ สลิปถูกต้อง (Paid)',
          cancelButtonText: 'ปิด',
          confirmButtonColor: '#10b981',
          cancelButtonColor: '#334155'
        }).then((res) => {
          if (res.isConfirmed) changePaymentStatus(orderId, 'Paid');
        });
      }
    }

    async function changePaymentStatus(orderId, status) {
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, type: 'payment', value: status })
        });
        const order = currentOrders.find(o => o.orderId === orderId);
        if (order) order.paymentStatus = status;
        renderOrders();
      } catch (e) {}
    }

    async function changeStatus(orderId, newStatus) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order) order.status = newStatus;
      renderOrders();

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, newStatus: newStatus })
        });
      } catch (e) {
        fetchData();
      }
    }

    async function cancelOrder(orderId) {
      const res = await Swal.fire({
        title: `ยกเลิกออเดอร์ #${orderId}?`,
        text: 'ระบบจะคืนสต๊อกอาหารให้อัตโนมัติ',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ยืนยันยกเลิก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#ef4444'
      });
      if (res.isConfirmed) changeStatus(orderId, 'Cancelled');
    }
  </script>
</body>
</html>
