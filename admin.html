<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALA — หลังร้าน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 pb-12">

  <!-- Header Nav -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center text-amber-400 font-black text-lg">🍳</div>
        <div>
          <h1 class="text-sm font-black text-slate-800">ล่าหมามาแดก</h1>
          <p class="text-[10px] text-slate-400 font-medium">ออเดอร์หลังร้าน</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="openStockModal()" class="bg-slate-900 hover:bg-slate-800 text-amber-400 px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-sm">
          📦 จัดการสต๊อก
        </button>
        <button onclick="fetchData(true)" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 transition-all">
          🔄
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <p class="text-[11px] font-bold text-slate-400">ออเดอร์ใหม่</p>
        <p class="text-xl font-black text-amber-500 mt-1" id="kpi-pending">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <p class="text-[11px] font-bold text-slate-400">กำลังปรุง</p>
        <p class="text-xl font-black text-blue-600 mt-1" id="kpi-cooking">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <p class="text-[11px] font-bold text-slate-400">รอรับอาหาร</p>
        <p class="text-xl font-black text-emerald-600 mt-1" id="kpi-ready">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <p class="text-[11px] font-bold text-slate-400">รวมทั้งหมดวันนี้</p>
        <p class="text-xl font-black text-slate-800 mt-1" id="kpi-total">0</p>
      </div>
    </div>

    <!-- Kanban Columns -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Pending -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> ออเดอร์ใหม่
          </h2>
          <span id="badge-Pending" class="bg-amber-100 text-amber-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-Pending" class="space-y-3"></div>
      </div>

      <!-- Cooking -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> กำลังปรุง
          </h2>
          <span id="badge-Cooking" class="bg-blue-100 text-blue-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-Cooking" class="space-y-3"></div>
      </div>

      <!-- Ready -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> รอรับอาหาร
          </h2>
          <span id="badge-Ready" class="bg-emerald-100 text-emerald-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="col-Ready" class="space-y-3"></div>
      </div>

    </div>

  </main>

  <!-- Stock Modal -->
  <div id="stockModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-extrabold text-slate-800 text-sm">จัดการสต๊อกสินค้า</h3>
        <button onclick="closeStockModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-xs">✕</button>
      </div>
      <div id="menuStockList" class="p-4 overflow-y-auto space-y-3 flex-1"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7L7W7WFuTrRwS5iRKHl3_GaILa7TMpR-m4JNC7dnhjJI4ZO4sGj651_dU55oZa9aEBg/exec"; 

    let currentOrders = [];
    let currentMenus = [];

    window.onload = () => {
      fetchData();
      setInterval(fetchData, 8000);
    };

    async function fetchData() {
      try {
        const resOrders = await fetch(GAS_URL + "?action=getAdminOrders");
        const dataOrders = await resOrders.json();
        if (dataOrders.orders) {
          currentOrders = dataOrders.orders;
          renderOrders();
        }

        const resMenu = await fetch(GAS_URL + "?action=getMenus");
        const dataMenu = await resMenu.json();
        if (dataMenu.menus) {
          currentMenus = dataMenu.menus;
        }
      } catch (e) {}
    }

    function renderOrders() {
      const cols = { Pending: '', Cooking: '', Ready: '' };
      const counts = { Pending: 0, Cooking: 0, Ready: 0 };

      currentOrders.forEach(o => {
        if (cols[o.status] === undefined) return;
        counts[o.status]++;

        const isTransfer = o.paymentMethod === 'เงินโอน';
        const isPaid = o.paymentStatus === 'Paid';

        let payBadge = isTransfer
          ? (isPaid 
              ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-200">💳 โอนแล้ว</span>`
              : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-50 text-amber-600 border border-amber-200">💳 รอโอน</span>`)
          : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200">💵 เงินสด</span>`;

        let actionBtn = '';
        if (o.status === 'Pending') {
          actionBtn = `<button onclick="changeStatus('${o.orderId}', 'Cooking')" class="w-full bg-blue-600 text-white font-extrabold text-xs py-2 rounded-xl active:scale-95">🍳 เริ่มปรุง</button>`;
        } else if (o.status === 'Cooking') {
          actionBtn = `<button onclick="changeStatus('${o.orderId}', 'Ready')" class="w-full bg-emerald-600 text-white font-extrabold text-xs py-2 rounded-xl active:scale-95">🔔 ปรุงเสร็จแล้ว</button>`;
        } else if (o.status === 'Ready') {
          actionBtn = `<button onclick="changeStatus('${o.orderId}', 'Completed')" class="w-full bg-slate-200 text-slate-700 font-extrabold text-xs py-2 rounded-xl active:scale-95">✅ รับเรียบร้อย</button>`;
        }

        const card = `
          <div class="bg-white border border-slate-200/90 rounded-2xl p-4 space-y-3 shadow-sm">
            <div class="flex justify-between items-start pb-2 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="text-xs font-black bg-slate-900 text-white px-2 py-0.5 rounded-md">#${o.orderId}</span>
                ${payBadge}
              </div>
              <span class="text-sm font-black text-slate-800">${o.totalPrice} ฿</span>
            </div>
            <div class="flex justify-between text-xs font-bold text-slate-700">
              <span>👤 ${o.studentName}</span>
              <span class="text-red-500">🌶️ ${o.spiciness}</span>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs text-slate-600 whitespace-pre-wrap leading-relaxed">
              ${o.items}
            </div>
            ${actionBtn}
          </div>
        `;
        cols[o.status] += card;
      });

      document.getElementById('badge-Pending').innerText = counts.Pending;
      document.getElementById('badge-Cooking').innerText = counts.Cooking;
      document.getElementById('badge-Ready').innerText = counts.Ready;

      document.getElementById('kpi-pending').innerText = counts.Pending;
      document.getElementById('kpi-cooking').innerText = counts.Cooking;
      document.getElementById('kpi-ready').innerText = counts.Ready;
      document.getElementById('kpi-total').innerText = currentOrders.length;

      const empty = (t) => `<div class="h-32 flex items-center justify-center text-slate-400 text-xs font-bold">${t}</div>`;
      document.getElementById('col-Pending').innerHTML = cols.Pending || empty('ไม่มีออเดอร์ใหม่');
      document.getElementById('col-Cooking').innerHTML = cols.Cooking || empty('ไม่มีรายการกำลังปรุง');
      document.getElementById('col-Ready').innerHTML = cols.Ready || empty('ไม่มีรายการรอรับ');
    }

    async function changeStatus(orderId, newStatus) {
      const order = currentOrders.find(o => o.orderId === orderId);
      if (order) order.status = newStatus;
      renderOrders();

      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateStatus', orderId, newStatus })
      });
    }

    function openStockModal() {
      renderStockList();
      document.getElementById('stockModal').classList.remove('hidden');
    }

    function closeStockModal() {
      document.getElementById('stockModal').classList.add('hidden');
    }

    function renderStockList() {
      const container = document.getElementById('menuStockList');
      container.innerHTML = currentMenus.map((item, idx) => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-200">
          <div>
            <p class="font-bold text-xs text-slate-800">${item.name}</p>
            <p class="text-[10px] text-slate-400">${item.price} ฿</p>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" id="stock-${idx}" value="${item.stock}" class="w-16 bg-white border border-slate-200 text-center rounded-xl py-1 text-xs font-bold">
            <button onclick="saveStock(${idx})" class="bg-slate-900 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold">บันทึก</button>
          </div>
        </div>
      `).join('');
    }

    async function saveStock(idx) {
      const item = currentMenus[idx];
      const newStock = document.getElementById(`stock-${idx}`).value;
      
      Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateMenu', name: item.name, stock: newStock })
      });
      Swal.fire({ icon: 'success', title: 'อัปเดตสต๊อกแล้ว', timer: 1000, showConfirmButton: false });
      fetchData();
    }
  </script>
</body>
</html>
